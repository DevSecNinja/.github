---
name: Auto-fix formatting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofix:
    uses: DevSecNinja/.github/.github/workflows/autofix.yml@eadb4f166f27d0864147189741c7596560be39dd # v3.6.0
    permissions:
      contents: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.11.8"
      # Optional: use formatter configs from a non-root directory.
      # autofix-config-dir: config-sync/files
      # Toggle formatters on/off (all default to true):
      # autofix-dprint: true
      # autofix-yamlfmt: true
      # autofix-shfmt: true
