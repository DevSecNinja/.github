---
name: Auto-fix formatting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofix:
    uses: DevSecNinja/.github/.github/workflows/autofix.yml@main
    permissions:
      contents: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.4.9"
      # Toggle formatters on/off (all default to true):
      # autofix-dprint: true
      # autofix-yamlfmt: true
      # autofix-shfmt: true
