---
name: Auto-fix formatting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofix:
    uses: DevSecNinja/.github/.github/workflows/autofix.yml@a9e3a11178ccd6e76115d3d7b31616631305991f # v3.4.0
    permissions:
      contents: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.10.19"
      # Optional: use formatter configs from a non-root directory.
      # autofix-config-dir: config-sync/files
      # Toggle formatters on/off (all default to true):
      # autofix-dprint: true
      # autofix-yamlfmt: true
      # autofix-shfmt: true
