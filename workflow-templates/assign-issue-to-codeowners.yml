---
name: Assign issue to CODEOWNERS

on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue number to assign (leave empty for all open issues)"
        required: false
        type: number
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  assign:
    uses: DevSecNinja/.github/.github/workflows/assign-issue-to-codeowners.yml@533c9fa80c07dc081dbd86d48efb97cd479828c9 # v1.0.0
    with:
      issue-number: ${{ inputs.issue-number || 0 }}
    permissions:
      contents: read
      issues: write
