---
name: Assign issue to CODEOWNERS

on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue number to assign (leave empty for all open issues)"
        required: false
        type: number
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  assign:
    uses: DevSecNinja/.github/.github/workflows/assign-issue-to-codeowners.yml@2978f7f87d39870cb8193069a2f1f01d55dfc6ea # main
    with:
      issue-number: ${{ inputs.issue-number && fromJSON(inputs.issue-number) || 0 }}
    permissions:
      contents: read
      issues: write
