---
name: Renovate PR cooldown

on:
  pull_request:
  # Daily re-check flips the status once a gated PR has soaked. Against a
  # 14-day soak, merging up to a day later costs nothing, and it is a quarter
  # of the runs of a 6-hourly schedule.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cooldown:
    uses: DevSecNinja/.github/.github/workflows/renovate-pr-cooldown.yml@46c8d52b2f3ca613956756a583332ba84b7f938e # main
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      # Optional overrides (defaults shown):
      # with:
      #   cooldown-days: 14
      #   gated-branch-prefixes: "renovate/docker-gated-"
      #   status-context: "pr-cooldown"
