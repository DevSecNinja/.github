---
name: Lint

on:
  pull_request:
  # Keep push only when results are uploaded to code scanning (upload-sarif:
  # true, the default): code scanning needs a default-branch analysis as the
  # baseline for PR alerts. Without SARIF uploads (e.g. private repos without
  # GitHub Advanced Security) drop it: the PR run already covered the commit.
  push:
    branches:
      - $default-branch

permissions:
  contents: read

# One run per PR (or branch). A newer push to a PR cancels its running run.
# A running push/main run is never cancelled, but a queued one is superseded
# by a newer push: only the latest commit's result matters, and dropping the
# stale run saves Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: DevSecNinja/.github/.github/workflows/lint.yml@0d0f448de257f354c89dc3a128871235d6ba8c11 # v2.5.0
    permissions:
      contents: read
      security-events: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.10.19"
      # renovate: datasource=github-releases depName=golangci/golangci-lint
      # golangci-lint-version: "v2.12.2"
      # Optional: use configs from a non-root directory.
      # lint-config-dir: config-sync/files
      # Optional: fail this workflow when a linter fails (default: false).
      # lint-fail-on-error: true
      # Optional: upload checkov/trivy/zizmor results to GitHub code scanning
      # (default: true, requires GitHub Advanced Security). Set false for
      # private repos without GHAS to gate on exit codes with console output.
      # upload-sarif: false
      # Optional (v3.3.0+): how linters are scheduled. `auto` (default) runs
      # every linter as a step of one `all linters` job on private repos (one
      # billed job instead of ~11) and one job per linter on public repos.
      # Force either with `single` or `parallel`. Before switching a repo with
      # required per-linter checks to `single`, require `all linters` instead:
      # skipped per-linter jobs report success.
      # lint-job-mode: auto
      # Optional: use a different Go version file.
      # go-version-file: go.mod
      # Toggle linters on/off (all default to true):
      # lint-dprint: true
      # lint-yamlfmt: true
      # lint-yamllint: true
      # lint-actionlint: true
      # lint-gitleaks: true
      # lint-go: true
      # lint-shellcheck: true
      # lint-shfmt: true
      # lint-checkov: true
      # lint-trivy: true
      # lint-zizmor: true
      # lint-config-drift: false
