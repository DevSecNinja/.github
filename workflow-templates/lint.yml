---
name: Lint

on:
  pull_request:
  push:
    branches:
      - $default-branch

permissions:
  contents: read

jobs:
  lint:
    uses: DevSecNinja/.github/.github/workflows/lint.yml@d5381d4da98c75b3c86c6b4699616d176090824f # v1.2.0
    permissions:
      contents: read
      security-events: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.4.18"
      # Optional: use configs from a non-root directory.
      # lint-config-dir: config-sync/files
      # Toggle linters on/off (all default to true):
      # lint-dprint: true
      # lint-yamlfmt: true
      # lint-yamllint: true
      # lint-actionlint: true
      # lint-gitleaks: true
      # lint-shellcheck: true
      # lint-shfmt: true
      # lint-checkov: true
      # lint-trivy: true
      # lint-zizmor: true
      # lint-config-drift: false
