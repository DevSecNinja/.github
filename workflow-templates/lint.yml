---
name: Lint

on:
  pull_request:
  push:
    branches:
      - $default-branch

permissions:
  contents: read

jobs:
  lint:
    uses: DevSecNinja/.github/.github/workflows/lint.yml@0d0f448de257f354c89dc3a128871235d6ba8c11 # v2.5.0
    permissions:
      contents: read
      security-events: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.8.10"
      # renovate: datasource=github-releases depName=golangci/golangci-lint
      # golangci-lint-version: "v2.12.2"
      # Optional: use configs from a non-root directory.
      # lint-config-dir: config-sync/files
      # Optional: fail this workflow when a linter fails (default: false).
      # lint-fail-on-error: true
      # Optional: upload checkov/trivy/zizmor results to GitHub code scanning
      # (default: true, requires GitHub Advanced Security). Set false for
      # private repos without GHAS to gate on exit codes with console output.
      # upload-sarif: false
      # Optional: use a different Go version file.
      # go-version-file: go.mod
      # Toggle linters on/off (all default to true):
      # lint-dprint: true
      # lint-yamlfmt: true
      # lint-yamllint: true
      # lint-actionlint: true
      # lint-gitleaks: true
      # lint-go: true
      # lint-shellcheck: true
      # lint-shfmt: true
      # lint-checkov: true
      # lint-trivy: true
      # lint-zizmor: true
      # lint-config-drift: false
