---
name: Release Please

# Drives semver bumping via release-please. On every push to main this
# workflow opens (or updates) a release PR with the next version's
# CHANGELOG bump. Merging that PR creates the `vX.Y.Z` tag, which
# triggers this repo's existing tag-triggered release workflow.
#
# Per-repo config:
#   - release-please-config.json
#   - .release-please-manifest.json
#
# IMPORTANT: configure the GitHub App credentials below so release PRs
# trigger CI status checks. Without them, release PRs open under the
# GITHUB_TOKEN identity, which (by GitHub design) does NOT trigger
# `pull_request` events — required CI status checks will never fire and
# the PR cannot satisfy branch protection.
#
# Onboarding guide:
#   https://github.com/DevSecNinja/.github/blob/main/docs/release-please-onboarding.md
#
# Reusable workflow:
#   https://github.com/DevSecNinja/.github/blob/main/.github/workflows/release-please.yml

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    uses: DevSecNinja/.github/.github/workflows/release-please.yml@d5381d4da98c75b3c86c6b4699616d176090824f # v1.2.0
    permissions:
      contents: write
      pull-requests: write
    with:
      app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
