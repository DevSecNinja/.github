---
name: Release Please

# Drives semver bumping via release-please. On every push to main this
# workflow opens (or updates) a release PR with the next version's
# CHANGELOG bump. Merging that PR creates the `vX.Y.Z` tag, which
# triggers this repo's existing tag-triggered release workflow.
#
# Per-repo config:
#   - release-please-config.json
#   - .release-please-manifest.json
#
# REQUIRED: install the DevSecNinja Automation GitHub App and provision the
# AUTOMATION_APP_ID variable and AUTOMATION_APP_PRIVATE_KEY secret (dotfiles
# GitHubRepoConfig, -Check AppCredential). The reusable workflow fails closed
# when either credential is missing, so release PRs and tags always trigger
# downstream workflows. "Allow GitHub Actions to create and approve pull
# requests" is not needed; leave it off.
#
# Onboarding guide:
#   https://github.com/DevSecNinja/.github/blob/main/docs/release-please-onboarding.md
# App credential contract:
#   https://github.com/DevSecNinja/.github/blob/main/docs/automation-app.md
#
# Reusable workflow:
#   https://github.com/DevSecNinja/.github/blob/main/.github/workflows/release-please.yml

on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

jobs:
  release-please:
    uses: DevSecNinja/.github/.github/workflows/release-please.yml@a9e3a11178ccd6e76115d3d7b31616631305991f # v3.4.0
    permissions:
      contents: write
      pull-requests: write
    # The App ID is read from the AUTOMATION_APP_ID variable; pass the key.
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
