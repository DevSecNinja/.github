---
name: Release Please

# Drives semver bumping via release-please. On every push to main this
# workflow opens (or updates) a release PR with the next version's
# CHANGELOG bump. Merging that PR creates the `vX.Y.Z` tag, which
# triggers this repo's existing tag-triggered release workflow.
#
# Per-repo config:
#   - release-please-config.json
#   - .release-please-manifest.json
#
# REQUIRED: install the Release Please GitHub App, configure both
# credentials below, and enable "Allow GitHub Actions to create and
# approve pull requests". The reusable workflow fails closed when either
# credential is empty so release PRs and tags always trigger downstream
# workflows.
#
# Onboarding guide:
#   https://github.com/DevSecNinja/.github/blob/main/docs/release-please-onboarding.md
#
# Reusable workflow:
#   https://github.com/DevSecNinja/.github/blob/main/.github/workflows/release-please.yml

on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

jobs:
  release-please:
    uses: DevSecNinja/.github/.github/workflows/release-please.yml@783a7a3a03ae71efcdf5b13eaea80efe26dfa641 # v2.2.0
    permissions:
      contents: write
      pull-requests: write
    with:
      app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
