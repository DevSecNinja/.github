---
name: Label Sync

on:
  workflow_dispatch:
  push:
    branches:
      - $default-branch
    paths:
      - .github/labels.yaml
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  label-sync:
    uses: DevSecNinja/.github/.github/workflows/label-sync.yml@d5381d4da98c75b3c86c6b4699616d176090824f # v1.2.0
    permissions:
      contents: read
      issues: write
