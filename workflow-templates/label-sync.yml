---
name: Label Sync

on:
  workflow_dispatch:
  push:
    branches:
      - $default-branch
    paths:
      - .github/labels.yaml
      - .github/labels-base.yaml
  # Weekly drift correction for labels edited in the UI; changes to the label
  # files themselves are applied by the push trigger above.
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  label-sync:
    uses: DevSecNinja/.github/.github/workflows/label-sync.yml@9c281b38f863550ddff25df04e6fda0b9b23d00c # v3.3.0
    permissions:
      contents: read
      issues: write
