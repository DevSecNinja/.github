---
name: Label Sync

on:
  workflow_dispatch:
  push:
    branches:
      - $default-branch
    paths:
      - .github/labels.yaml
      - .github/labels-base.yaml
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  label-sync:
    uses: DevSecNinja/.github/.github/workflows/label-sync.yml@24acc67adf1be33089e73b2fdbdb4be8c12d145b # v3.2.0
    permissions:
      contents: read
      issues: write
