---
name: TODO to Issue

on:
  push:
    branches:
      - $default-branch

permissions:
  contents: read
  issues: write

jobs:
  run:
    # Dependency bumps never add TODO comments; skip Renovate's automerge
    # pushes instead of billing a run for each one.
    if: github.actor != 'renovate[bot]'
    uses: DevSecNinja/.github/.github/workflows/todo-to-issue.yml@9c281b38f863550ddff25df04e6fda0b9b23d00c # v3.3.0
    permissions:
      contents: read
      issues: write
    with:
      auto_assign: false
      label: "todo-to-issue"
