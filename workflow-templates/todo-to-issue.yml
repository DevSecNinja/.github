---
name: TODO to Issue

on:
  push:
    branches:
      - $default-branch

permissions:
  contents: read
  issues: write

jobs:
  run:
    # Dependency bumps never add TODO comments; skip Renovate's automerge
    # pushes instead of billing a run for each one.
    if: github.actor != 'renovate[bot]'
    uses: DevSecNinja/.github/.github/workflows/todo-to-issue.yml@a9e3a11178ccd6e76115d3d7b31616631305991f # v3.4.0
    permissions:
      contents: read
      issues: write
    with:
      auto_assign: false
      label: "todo-to-issue"
