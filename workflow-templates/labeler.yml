---
name: Labeler

on:
  workflow_dispatch:
  pull_request:
    branches:
      - $default-branch
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read

jobs:
  labeler:
    uses: DevSecNinja/.github/.github/workflows/labeler.yml@9c281b38f863550ddff25df04e6fda0b9b23d00c # v3.3.0
    permissions:
      contents: read
      pull-requests: write
      issues: write
