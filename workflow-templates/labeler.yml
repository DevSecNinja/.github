---
name: Labeler

on:
  workflow_dispatch:
  pull_request:
    branches:
      - $default-branch
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read

jobs:
  labeler:
    uses: DevSecNinja/.github/.github/workflows/labeler.yml@d5381d4da98c75b3c86c6b4699616d176090824f # v1.2.0
    permissions:
      contents: read
      pull-requests: write
      issues: write
