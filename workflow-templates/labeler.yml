---
name: Labeler

on:
  workflow_dispatch:
  pull_request:
    branches:
      - $default-branch
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read

jobs:
  labeler:
    uses: DevSecNinja/.github/.github/workflows/labeler.yml@eadb4f166f27d0864147189741c7596560be39dd # v3.6.0
    permissions:
      contents: read
      pull-requests: write
      issues: write
