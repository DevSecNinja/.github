---
name: Labeler

on:
  workflow_dispatch:
  pull_request:
    branches:
      - $default-branch
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read

jobs:
  labeler:
    uses: DevSecNinja/.github/.github/workflows/labeler.yml@27fd66740c629ea38380dcd3bf93e7bc74c54247 # v1.9.0
    permissions:
      contents: read
      pull-requests: write
      issues: write
