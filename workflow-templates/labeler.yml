---
name: Labeler

on:
  workflow_dispatch:
  pull_request:
    branches:
      - $default-branch
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read

jobs:
  labeler:
    uses: DevSecNinja/.github/.github/workflows/labeler.yml@e7037884132e77504ca7f50a23e98f594d1c764b # v1.1.0
    permissions:
      contents: read
      pull-requests: write
      issues: write
