---
name: Config Sync

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: DevSecNinja/.github/.github/workflows/config-sync.yml@9c281b38f863550ddff25df04e6fda0b9b23d00c # v3.3.0
    permissions:
      contents: write
      # Required: the reusable workflow creates the config-sync label through
      # the issues API. Without it the run fails with startup_failure.
      issues: write
      pull-requests: write
      # Uncomment to also bootstrap template files for new repos:
      # with:
      #   sync-templates: true
