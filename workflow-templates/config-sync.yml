---
name: Config Sync

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: DevSecNinja/.github/.github/workflows/config-sync.yml@a9e3a11178ccd6e76115d3d7b31616631305991f # v3.4.0
    permissions:
      contents: write
      pull-requests: write
    # The PR is opened as the DevSecNinja Automation GitHub App, so it runs CI
    # and needs no "Allow GitHub Actions to create and approve pull requests"
    # setting. The App ID is read from the AUTOMATION_APP_ID variable; pass
    # the key. Without it the workflow warns and falls back to GITHUB_TOKEN.
    # See https://github.com/DevSecNinja/.github/blob/main/docs/automation-app.md
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
      # Uncomment to also bootstrap template files for new repos:
      # with:
      #   sync-templates: true
