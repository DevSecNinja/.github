    uses: DevSecNinja/.github/.github/workflows/release.yml@c1725a7573e1cb5277889d925901b477ee814352 # v1.7.0
    permissions:
      contents: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.6.1"
      tag: ${{ github.ref_name }}
