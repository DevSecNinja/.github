---
name: Reusable — Vendored File Sync

on:
  workflow_call:
    inputs:
      refresh-command:
        description: "Command that refreshes vendored files in the caller repository"
        required: true
        type: string
      paths:
        description: "Newline-delimited pathspecs to watch and stage"
        required: true
        type: string
      create-pr:
        description: "Open or update a pull request when refreshed files drift"
        required: false
        type: boolean
        default: true
      branch:
        description: "Working branch for the vendored-file sync pull request"
        required: false
        type: string
        default: chore/vendored-file-sync
      base:
        description: "Base branch for the vendored-file sync pull request"
        required: false
        type: string
        default: main
      pr-title:
        description: "Pull request title and default commit message"
        required: false
        type: string
        default: "chore: sync vendored files"
      pr-body:
        description: "Pull request body"
        required: false
        type: string
        default: ""
      labels:
        description: "Newline-delimited labels to apply when creating the pull request"
        required: false
        type: string
        default: vendored-file-sync
      commit-message:
        description: "Commit message for refreshed vendored files"
        required: false
        type: string
        default: ""
      draft:
        description: "Open the pull request as a draft"
        required: false
        type: boolean
        default: false
      signoff:
        description: "Add a Signed-off-by trailer to the commit"
        required: false
        type: boolean
        default: false
    outputs:
      changed:
        description: "true when the refresher left drift in the watched paths"
        value: ${{ jobs.sync.outputs.changed }}
      pr-number:
        description: "Pull request number when create-pr=true and drift was found"
        value: ${{ jobs.sync.outputs.pr-number }}
      pr-url:
        description: "Pull request URL when create-pr=true and drift was found"
        value: ${{ jobs.sync.outputs.pr-url }}

permissions:
  contents: read

jobs:
  sync:
    name: Refresh vendored files
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      pr-number: ${{ steps.open-pr.outputs.pr-number }}
      pr-url: ${{ steps.open-pr.outputs.pr-url }}
    steps:
      - name: Checkout vendored-file-sync scripts
        # The vendored-file-sync scripts ship with this reusable workflow: fetch
        # them from the same commit of DevSecNinja/.github that the caller
        # pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-vendored-file-sync
          sparse-checkout: |-
            scripts/vendored-file-sync/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move vendored-file-sync scripts out of the workspace
        # Outside the workspace the drift check doesn't see them, and a code
        # checkout doesn't delete them.
        run: mv .devsecninja-vendored-file-sync "${RUNNER_TEMP}/devsecninja-vendored-file-sync"

      - name: Checkout code
        # zizmor: ignore[artipacked]
        # Persisted credentials are required: the `actions/open-pr`
        # step below invokes `git push` which relies on the bearer
        # token that `actions/checkout` writes into the remote URL.
        # The caller-supplied `refresh-command` runs in this same job
        # and could in theory exfiltrate the token, but the caller
        # also controls the workflow that wires this input — so the
        # trust boundary is the same as for any caller-owned step.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run vendored-file refresher
        env:
          REFRESH_COMMAND: ${{ inputs.refresh-command }}
        run: bash -c "${REFRESH_COMMAND}"

      - name: Detect vendored-file drift
        id: detect
        env:
          PATHS: ${{ inputs.paths }}
        run: bash "${RUNNER_TEMP}/devsecninja-vendored-file-sync/scripts/vendored-file-sync/detect-drift.sh"

      - name: Fail validation when vendored files drift
        if: ${{ !inputs.create-pr && steps.detect.outputs.changed == 'true' }}
        env:
          PATHS: ${{ inputs.paths }}
        run: bash "${RUNNER_TEMP}/devsecninja-vendored-file-sync/scripts/vendored-file-sync/report-drift.sh"

      - name: Fetch working branch
        # The pinned open-pr version pushes with a bare --force-with-lease,
        # which needs a remote-tracking ref for the branch; without it a push
        # to an already existing branch is rejected with "stale info".
        # open-pr v3.3.0+ leases against `git ls-remote` itself; this step is
        # harmless there.
        if: ${{ inputs.create-pr && steps.detect.outputs.changed == 'true' }}
        env:
          BRANCH: ${{ inputs.branch }}
        run: bash "${RUNNER_TEMP}/devsecninja-vendored-file-sync/scripts/vendored-file-sync/fetch-working-branch.sh"

      - name: Open or update vendored-file sync PR
        id: open-pr
        if: ${{ inputs.create-pr && steps.detect.outputs.changed == 'true' }}
        uses: DevSecNinja/.github/actions/open-pr@0d0f448de257f354c89dc3a128871235d6ba8c11 # v2.5.0
        with:
          branch: ${{ inputs.branch }}
          base: ${{ inputs.base }}
          title: ${{ inputs.pr-title }}
          body: ${{ inputs.pr-body }}
          commit-message: ${{ inputs.commit-message }}
          paths: ${{ inputs.paths }}
          labels: ${{ inputs.labels }}
          draft: ${{ inputs.draft }}
          signoff: ${{ inputs.signoff }}
