---
name: Reusable — Config Sync

# Pull-based config sync: each repo calls this workflow to pull the latest
# config files from the public DevSecNinja/.github repo and open a PR if
# anything changed. Only requires the default GITHUB_TOKEN (no PAT needed).

on:
  workflow_call:
    inputs:
      sync-templates:
        description: "Also sync template files (only copies if file does not exist locally — will not overwrite customized
          files)"
        required: false
        type: boolean
        default: false
      sync-workflows:
        description: "Also sync workflow templates into .github/workflows"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync config from central repo
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pull config files from central repo
        id: pull
        env:
          SYNC_TEMPLATES: ${{ inputs.sync-templates }}
          SYNC_WORKFLOWS: ${{ inputs.sync-workflows }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |-
          REPO_URL="https://raw.githubusercontent.com/DevSecNinja/.github/main"
          API_URL="https://api.github.com/repos/DevSecNinja/.github/contents"
          updated=0

          workflow_is_excluded() {
            [ -f "${1}" ] && head -n 1 "${1}" | grep -Eq 'config-sync: (ignore|skip)'
          }

          merge_workflow_exclusions() {
            python3 - "${1}" "${2}" <<'PY'
          from pathlib import Path
          import sys

          current = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines(keepends=True)
          incoming = Path(sys.argv[2]).read_text(encoding="utf-8").splitlines(keepends=True)
          replacements = []
          index = 0

          while index < len(current):
              if "config-sync: off" in current[index]:
                  start = index
                  index += 1
                  while index < len(current) and "config-sync: on" not in current[index]:
                      index += 1
                  if index < len(current):
                      index += 1
                  replacements.append((start, index, current[start:index]))
                  continue

              if "config-sync: ignore-line" in current[index]:
                  replacements.append((index, index + 1, [current[index]]))

              index += 1

          for start, end, lines in reversed(replacements):
              if start < len(incoming):  # Only preserve markers that map to valid lines in the new template.
                  incoming[start:min(end, len(incoming))] = lines

          sys.stdout.write("".join(incoming))
          PY
          }

          # --- Sync files (always overwrite to match central repo) ---
          echo "=== Syncing config files ==="
          files=$(curl -sf "${API_URL}/config-sync/files" | grep '"name"' | sed 's/.*"name": "\(.*\)".*/\1/')

          for file in ${files}; do
            echo "Fetching ${file}..."
            if curl -sf "${REPO_URL}/config-sync/files/${file}" -o "/tmp/${file}"; then
              if [ -f "${file}" ]; then
                if ! diff -q "${file}" "/tmp/${file}" > /dev/null 2>&1; then
                  cp "/tmp/${file}" "${file}"
                  echo "  ⬆ Updated ${file}"
                  updated=1
                else
                  echo "  ✓ ${file} is up to date"
                fi
              else
                cp "/tmp/${file}" "${file}"
                echo "  ➕ Added ${file}"
                updated=1
              fi
            else
              echo "  ⚠ Failed to fetch ${file} (skipping)"
            fi
          done

          # --- Sync templates (only if enabled; never overwrite existing) ---
          if [ "${SYNC_TEMPLATES}" = "true" ]; then
            echo ""
            echo "=== Syncing template files (new files only) ==="
            templates=$(curl -sf "${API_URL}/config-sync/templates" | grep '"name"' | sed 's/.*"name": "\(.*\)".*/\1/' | grep -v '^README\.md$')

            for tpl in ${templates}; do
              if [ -f "${tpl}" ]; then
                echo "  ✔ ${tpl} already exists locally (skipping — templates are not overwritten)"
              else
                echo "  Fetching template ${tpl}..."
                if curl -sf "${REPO_URL}/config-sync/templates/${tpl}" -o "${tpl}"; then
                  echo "  ➕ Added ${tpl} from template"
                  updated=1
                else
                  echo "  ⚠ Failed to fetch template ${tpl} (skipping)"
                fi
              fi
            done
          fi

          # --- Sync workflows (if enabled; supports local exclusion markers) ---
          if [ "${SYNC_WORKFLOWS}" = "true" ]; then
            echo ""
            echo "=== Syncing workflow templates ==="
            mkdir -p .github/workflows
            workflows=$(curl -sf "${API_URL}/workflow-templates" | grep '"name"' | sed 's/.*"name": "\(.*\)".*/\1/' | grep -E '\.ya?ml$')

            for workflow in ${workflows}; do
              target=".github/workflows/${workflow}"

              if workflow_is_excluded "${target}"; then
                echo "  [SKIP] ${target} is excluded by its first line"
                continue
              fi

              echo "  Fetching workflow ${workflow}..."
              tmp_workflow=$(mktemp)
              workflow_url="${REPO_URL}/workflow-templates/${workflow}"
              if curl -sf "${workflow_url}" -o "${tmp_workflow}"; then
                python3 - "${tmp_workflow}" "${DEFAULT_BRANCH}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          default_branch = sys.argv[2]
          path.write_text(path.read_text(encoding="utf-8").replace("$default-branch", default_branch), encoding="utf-8")
          PY

                if [ -f "${target}" ]; then
                  merged_workflow=$(mktemp)
                  merge_workflow_exclusions "${target}" "${tmp_workflow}" > "${merged_workflow}"
                  mv "${merged_workflow}" "${tmp_workflow}"

                  if ! diff -q "${target}" "${tmp_workflow}" > /dev/null 2>&1; then
                    cp "${tmp_workflow}" "${target}"
                    echo "  ⬆ Updated ${target}"
                    updated=1
                  else
                    echo "  ✓ ${target} is up to date"
                  fi
                else
                  cp "${tmp_workflow}" "${target}"
                  echo "  ➕ Added ${target}"
                  updated=1
                fi
              else
                echo "  ⚠ Failed to fetch workflow ${workflow} from ${workflow_url} (skipping)"
              fi
              rm -f "${tmp_workflow}"
            done
          fi

          sync_scope="config files"
          if [ "${SYNC_TEMPLATES}" = "true" ] && [ "${SYNC_WORKFLOWS}" = "true" ]; then
            sync_scope="config files, templates, and workflows"
          elif [ "${SYNC_TEMPLATES}" = "true" ]; then
            sync_scope="config files and templates"
          elif [ "${SYNC_WORKFLOWS}" = "true" ]; then
            sync_scope="config files and workflows"
          fi

          echo "updated=${updated}" >> "${GITHUB_OUTPUT}"
          echo "sync_scope=${sync_scope}" >> "${GITHUB_OUTPUT}"

      - name: Ensure config-sync label exists
        if: steps.pull.outputs.updated == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          gh label create "config-sync" \
            --color "0075ca" \
            --description "Automated config sync PR" \
            --force

      - name: Create PR if configs changed
        if: steps.pull.outputs.updated == '1'
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/open-pr@af5030dd0d6f61b80fe58f949c9b985d1931ddf2 # v1.3.0
        with:
          branch: chore/config-sync
          title: 'chore: sync ${{ steps.pull.outputs.sync_scope }} from central repo'
          commit-message: 'chore: sync ${{ steps.pull.outputs.sync_scope }} from DevSecNinja/.github'
          labels: config-sync
          body: |-
            Automated PR — repository configuration pulled from
            [DevSecNinja/.github](https://github.com/DevSecNinja/.github).

            Triggered by `${{ github.workflow }}` on `${{ github.ref_name }}`
            at commit `${{ github.sha }}`.
