---
name: Reusable — Config Sync

# Pull-based config sync: each repo calls this workflow to pull the
# latest config files from the public DevSecNinja/.github repo and open
# a PR if anything changed.
#
# Auth model: the calling workflow MUST pass the credentials of a
# GitHub App (default: the "DevSecNinja Repo Manager" App) via the
# `secrets:` block. The reusable workflow mints a short-lived (1h)
# installation token at job start and uses it for all push/PR-create
# calls. Rationale + setup steps: docs/repo-manager-app.md.
#
# Source layout mirrors target layout: anything under
# `config-sync/files/` in the central repo is synced (overwriting) to
# the same relative path in the calling repo. Anything under
# `config-sync/templates/` is bootstrapped (only if the target file
# does not yet exist) when `sync-templates: true`.
#
# Per-repo opt-out: list paths (one per line, relative to repo root)
# in `.github/.config-sync-ignore` to skip them during sync. Blank
# lines and `#` comments are allowed.

on:
  workflow_call:
    inputs:
      sync-templates:
        description: "Also sync template files (only copies if file does not exist locally — will not overwrite customized
          files)"
        required: false
        type: boolean
        default: false
      central-ref:
        description: "Git ref of DevSecNinja/.github to sync from (branch, tag, or SHA). Defaults to main."
        required: false
        type: string
        default: main
    secrets:
      app-id:
        description: |
          App ID of the GitHub App used to authenticate pushes and PR
          creation. Stored per repo as `REPO_MANAGER_APP_ID`.
        required: true
      private-key:
        description: |
          PEM-encoded private key of the same GitHub App. Stored per
          repo as `REPO_MANAGER_APP_PRIVATE_KEY`.
        required: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync config from central repo
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.private-key }}
          # Narrow the installation token below the App's blanket
          # permissions: this workflow only ever pushes a branch,
          # opens a PR, and ensures a label exists. No account
          # permissions, no admin, no workflows.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-metadata: read
      - name: Checkout calling repository
        # zizmor: ignore[artipacked]
        # The App token is short-lived (≤1h) and scoped per the
        # `permission-*` inputs above. Persisting it in the local
        # git config is required so the working branch can be
        # pushed in `actions/open-pr` below.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Checkout central config source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: DevSecNinja/.github
          ref: ${{ inputs.central-ref }}
          path: .config-sync-source
          persist-credentials: false
      - name: Sync config files from central repo
        id: pull
        env:
          SYNC_TEMPLATES: ${{ inputs.sync-templates }}
          IGNORE_FILE: .github/.config-sync-ignore
          SOURCE_DIR: .config-sync-source/config-sync
        run: |-
          set -euo pipefail

          updated=0
          source_sha=$(git -C .config-sync-source rev-parse HEAD)
          echo "Source: DevSecNinja/.github @ ${source_sha}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

          # Load ignore list (paths relative to repo root, one per line).
          ignored=""
          if [ -f "${IGNORE_FILE}" ]; then
              ignored=$(cat "${IGNORE_FILE}")
              echo "Loaded ignore list from ${IGNORE_FILE}:"
              while IFS= read -r line; do
                  [ -z "${line}" ] && continue
                  case "${line}" in \#*) continue ;; esac
                  echo "  - ${line}"
              done <<< "${ignored}"
          fi

          is_ignored() {
              local target="$1"
              local pattern trimmed
              [ -z "${ignored}" ] && return 1
              while IFS= read -r pattern; do
                  trimmed="${pattern#"${pattern%%[![:space:]]*}"}"
                  trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
                  [ -z "${trimmed}" ] && continue
                  case "${trimmed}" in \#*) continue ;; esac
                  if [ "${target}" = "${trimmed}" ]; then
                      return 0
                  fi
              done <<< "${ignored}"
              return 1
          }

          sync_tree() {
              local kind="$1"   # "files" or "templates"
              local src_root="${SOURCE_DIR}/${kind}"

              if [ ! -d "${src_root}" ]; then
                  echo "  (no ${kind} directory in central repo, skipping)"
                  return
              fi

              # README.md inside templates/ is documentation, never synced.
              local find_args=()
              if [ "${kind}" = "templates" ]; then
                  find_args=(-not -path "${src_root}/README.md")
              fi

              while IFS= read -r src; do
                  local rel="${src#"${src_root}/"}"
                  local dest="${rel}"

                  if is_ignored "${dest}"; then
                      echo "  ⊘ ${dest} (ignored via ${IGNORE_FILE})"
                      continue
                  fi

                  if [ "${kind}" = "templates" ] && [ -e "${dest}" ]; then
                      echo "  ✔ ${dest} already exists (templates are not overwritten)"
                      continue
                  fi

                  mkdir -p "$(dirname "${dest}")"

                  if [ -f "${dest}" ] && cmp -s "${src}" "${dest}"; then
                      echo "  ✓ ${dest} is up to date"
                      continue
                  fi

                  if [ -f "${dest}" ]; then
                      echo "  ⬆ Updated ${dest}"
                  else
                      echo "  ➕ Added ${dest}"
                  fi
                  cp "${src}" "${dest}"
                  updated=1
              done < <(find "${src_root}" -type f "${find_args[@]}")
          }

          echo "=== Syncing config files ==="
          sync_tree files

          if [ "${SYNC_TEMPLATES}" = "true" ]; then
              echo ""
              echo "=== Syncing template files (new files only) ==="
              sync_tree templates
          fi

          # Clean up the source checkout so it never lands in a PR.
          rm -rf .config-sync-source

          echo "updated=${updated}" >> "${GITHUB_OUTPUT}"
      - name: Ensure config-sync label exists
        if: steps.pull.outputs.updated == '1'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |-
          gh label create "config-sync" \
              --color "0075ca" \
              --description "Automated config sync PR" \
              --force
      - name: Create PR if configs changed
        if: steps.pull.outputs.updated == '1'
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/open-pr@af5030dd0d6f61b80fe58f949c9b985d1931ddf2 # v1.3.0
        with:
          branch: chore/config-sync
          title: 'chore: sync config files from central repo'
          commit-message: 'chore: sync config files from DevSecNinja/.github'
          labels: config-sync
          github-token: ${{ steps.app-token.outputs.token }}
          body: |-
            Automated PR — config files pulled from
            [DevSecNinja/.github](https://github.com/DevSecNinja/.github/tree/main/config-sync)
            at commit
            [`${{ steps.pull.outputs.source_sha }}`](https://github.com/DevSecNinja/.github/commit/${{ steps.pull.outputs.source_sha }}).

            Per-repo opt-out: add paths to `.github/.config-sync-ignore`.

            Triggered by `${{ github.workflow }}` on `${{ github.ref_name }}`
            at commit `${{ github.sha }}`.
