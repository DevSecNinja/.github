---
name: Reusable — Config Sync

# Pull-based config sync: each repo calls this workflow to pull the
# latest config files from the public DevSecNinja/.github repo and open
# a PR if anything changed.
#
# Source layout mirrors target layout: anything under
# `config-sync/files/` in the central repo is synced (overwriting) to
# the same relative path in the calling repo. Anything under
# `config-sync/templates/` is bootstrapped (only if the target file
# does not yet exist) when `sync-templates: true`.
#
# Per-repo opt-out: list paths (one per line, relative to repo root)
# in `.github/.config-sync-ignore` to skip them during sync. Blank
# lines and `#` comments are allowed.
#
# APM-managed paths: a path listed under `deployed_files` in the
# calling repo's `apm.lock.yaml` is skipped automatically, and so is a
# generated file whose provenance marker names a package the repo
# installs through APM (or the calling repo itself). Repos that install
# DevSecNinja/ai-toolkit through APM keep their own copy of the synced
# ai-toolkit instructions (see docs/architecture.md).
#
# Authentication (single-App contract, see docs/automation-app.md): the
# sync PR is opened with a short-lived token of the DevSecNinja
# Automation GitHub App, minted from the caller repository's
# `AUTOMATION_APP_ID` variable and `AUTOMATION_APP_PRIVATE_KEY` secret.
# The variable is read automatically; the caller passes the secret:
#
#   secrets:
#     AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
#
# (or `secrets: inherit`). The `app-id` input and `app-private-key`
# secret override those names. App-opened PRs trigger the repository's
# CI and need no "Allow GitHub Actions to create and approve pull
# requests" setting. Without App credentials the workflow falls back to
# GITHUB_TOKEN with a warning; that PR only opens when the setting above
# is enabled, and it does not trigger CI.
#
# Caller permissions: `contents: write` and `pull-requests: write` (used
# by the GITHUB_TOKEN fallback). `issues: write` is not needed: labels
# are created with the Pull requests permission. A caller that grants
# less than the job requests fails with `startup_failure`.

on:
  workflow_call:
    inputs:
      sync-templates:
        description: "Also sync template files (only copies if file does not exist locally — will not overwrite customized
          files)"
        required: false
        type: boolean
        default: false
      central-ref:
        description: "Git ref of DevSecNinja/.github to sync from (branch, tag, or SHA). Defaults to main."
        required: false
        type: string
        default: main
      app-id:
        description: >-
          GitHub App ID used to open the sync PR. Empty (default) reads the caller repository's AUTOMATION_APP_ID
          variable. See docs/automation-app.md.
        required: false
        type: string
        default: ""
      app-environment:
        description: >-
          Actions environment that holds the App credentials (the dotfiles GitHubRepoConfig module provisions them into
          `production`, pinned to the default branch). Repository-level credentials work with the default too: environment
          values only take precedence when they exist.
        required: false
        type: string
        default: production
    secrets:
      AUTOMATION_APP_PRIVATE_KEY:
        description: "PEM private key of the GitHub App. Pass it by name, or use `secrets: inherit`."
        required: false
      app-private-key:
        description: "Explicit private key; overrides AUTOMATION_APP_PRIVATE_KEY (e.g. for a differently named secret)."
        required: false
permissions:
  contents: read

jobs:
  sync:
    name: Sync config from central repo
    runs-on: ubuntu-24.04
    # Exposes the environment's AUTOMATION_APP_* values without creating a
    # deployment record on every run.
    environment:
      name: ${{ inputs.app-environment }}
      deployment: false
    permissions:
      # Only used by the GITHUB_TOKEN fallback; the App token carries its own
      # permissions.
      contents: write
      pull-requests: write
    steps:
      - name: Resolve GitHub App credentials
        id: app
        env:
          APP_ID: ${{ inputs.app-id || vars.AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key || secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: |-
          set -euo pipefail

          id_set=false
          key_set=false
          [[ -n "${APP_ID//[[:space:]]/}" ]] && id_set=true
          [[ -n "${APP_PRIVATE_KEY//[[:space:]]/}" ]] && key_set=true

          if [[ "${id_set}" == true && "${key_set}" == true ]]; then
            echo "available=true" >>"${GITHUB_OUTPUT}"
            echo "Opening the PR as the GitHub App (ID ${APP_ID})."
            exit 0
          fi

          echo "available=false" >>"${GITHUB_OUTPUT}"
          if [[ "${id_set}" == true ]]; then
            reason="AUTOMATION_APP_ID is set, but the calling job does not pass the AUTOMATION_APP_PRIVATE_KEY secret."
          elif [[ "${key_set}" == true ]]; then
            reason="A private key was passed, but neither the AUTOMATION_APP_ID variable nor the app-id input is set."
          else
            reason="No GitHub App credentials (AUTOMATION_APP_ID variable, AUTOMATION_APP_PRIVATE_KEY secret)."
          fi
          echo "::warning title=Config Sync falls back to GITHUB_TOKEN::${reason} GITHUB_TOKEN can only open the PR when 'Allow GitHub Actions to create and approve pull requests' is enabled, and that PR does not trigger CI. See https://github.com/DevSecNinja/.github/blob/main/docs/automation-app.md"
      - name: Generate App token
        id: app-token
        if: steps.app.outputs.available == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-id || vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.app-private-key || secrets.AUTOMATION_APP_PRIVATE_KEY }}
          # Only the calling repository, and only what the sync needs (labels
          # are covered by Pull requests), whatever the App installation has.
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout calling repository
        # zizmor: ignore[artipacked]
        # Persisted credentials are required: the `actions/open-pr` step
        # below invokes `git push` which relies on the bearer token that
        # `actions/checkout` writes into the remote URL. Setting
        # `persist-credentials: false` here breaks PR creation without
        # offering meaningful isolation, since this job never executes
        # content fetched from the central repo (it only reads files
        # from `.config-sync-source/` to copy them).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
      - name: Checkout central config source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DevSecNinja/.github
          ref: ${{ inputs.central-ref }}
          path: .config-sync-source
          persist-credentials: false
      - name: Sync config files from central repo
        id: pull
        env:
          SYNC_TEMPLATES: ${{ inputs.sync-templates }}
          IGNORE_FILE: .github/.config-sync-ignore
          SOURCE_DIR: .config-sync-source/config-sync
        run: |-
          set -euo pipefail

          updated=0
          source_sha=$(git -C .config-sync-source rev-parse HEAD)
          echo "Source: DevSecNinja/.github @ ${source_sha}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

          # Load ignore list (paths relative to repo root, one per line).
          ignored=""
          if [ -f "${IGNORE_FILE}" ]; then
              ignored=$(cat "${IGNORE_FILE}")
              echo "Loaded ignore list from ${IGNORE_FILE}:"
              while IFS= read -r line; do
                  [ -z "${line}" ] && continue
                  case "${line}" in \#*) continue ;; esac
                  echo "  - ${line}"
              done <<< "${ignored}"
          fi

          is_ignored() {
              local target="$1"
              local pattern trimmed
              [ -z "${ignored}" ] && return 1
              while IFS= read -r pattern; do
                  trimmed="${pattern#"${pattern%%[![:space:]]*}"}"
                  trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
                  [ -z "${trimmed}" ] && continue
                  case "${trimmed}" in \#*) continue ;; esac
                  if [ "${target}" = "${trimmed}" ]; then
                      return 0
                  fi
              done <<< "${ignored}"
              return 1
          }

          # Files APM owns in this repository are left alone:
          # - paths APM deploys here (`deployed_files` in apm.lock.yaml);
          # - files generated from a package (their `<!-- config-sync:
          #   source=<owner/repo>` marker) that this repository installs
          #   whole through APM, even when its pinned release doesn't ship
          #   them, so a later APM upgrade isn't blocked by a config-sync
          #   copy. Subpath pins (`virtual_path`) only own what they deploy;
          # - files generated from this repository itself.
          apm_managed=""
          apm_sources=""
          if [ -f apm.lock.yaml ]; then
              apm_managed=$(sed -n 's/^[[:space:]]*-[[:space:]]\{1,\}\([^:[:space:]]\{1,\}\)[[:space:]]*$/\1/p' apm.lock.yaml)
              apm_sources=$(awk '
                  function flush() { if (repo != "" && !virtual) print tolower(repo); repo = ""; virtual = 0 }
                  /^[^[:space:]-]/ { flush(); in_deps = ($0 ~ /^dependencies:/); next }
                  !in_deps { next }
                  /^- / { flush() }
                  { line = $0; sub(/^- /, "  ", line) }
                  line ~ /^  repo_url:/ { repo = line; sub(/^  repo_url:[[:space:]]*/, "", repo); sub(/[[:space:]].*/, "", repo) }
                  line ~ /^  virtual_path:/ { virtual = 1 }
                  END { flush() }
              ' apm.lock.yaml)
          fi
          self_repo=$(tr '[:upper:]' '[:lower:]' <<< "${GITHUB_REPOSITORY:-}")

          apm_owner() {
              local dest="$1" src="$2" source
              if [ -n "${apm_managed}" ] && grep -Fxq -- "${dest}" <<< "${apm_managed}"; then
                  echo "deployed by APM, see apm.lock.yaml"
                  return 0
              fi
              source=$(sed -n 's/^<!-- config-sync: source=\([^[:space:]]*\) .*/\1/p;/^<!-- config-sync: /q' "${src}" | tr '[:upper:]' '[:lower:]')
              [ -n "${source}" ] || return 1
              if [ -n "${apm_sources}" ] && grep -Fxq -- "${source}" <<< "${apm_sources}"; then
                  echo "${source} is installed whole through APM, see apm.lock.yaml"
                  return 0
              fi
              if [ "${source}" = "${self_repo}" ]; then
                  echo "generated from this repository"
                  return 0
              fi
              return 1
          }

          sync_tree() {
              local kind="$1"   # "files" or "templates"
              local src_root="${SOURCE_DIR}/${kind}"

              if [ ! -d "${src_root}" ]; then
                  echo "  (no ${kind} directory in central repo, skipping)"
                  return
              fi

              # README.md inside templates/ is documentation, never synced.
              local find_args=()
              if [ "${kind}" = "templates" ]; then
                  find_args=(-not -path "${src_root}/README.md")
              fi

              while IFS= read -r src; do
                  local rel="${src#"${src_root}/"}"
                  local dest="${rel}"
                  local reason

                  if is_ignored "${dest}"; then
                      echo "  ⊘ ${dest} (ignored via ${IGNORE_FILE})"
                      continue
                  fi

                  if reason=$(apm_owner "${dest}" "${src}"); then
                      echo "  ⊘ ${dest} (${reason})"
                      continue
                  fi

                  if [ "${kind}" = "templates" ] && [ -e "${dest}" ]; then
                      echo "  ✔ ${dest} already exists (templates are not overwritten)"
                      continue
                  fi

                  mkdir -p "$(dirname "${dest}")"

                  if [ -f "${dest}" ] && cmp -s "${src}" "${dest}"; then
                      echo "  ✓ ${dest} is up to date"
                      continue
                  fi

                  if [ -f "${dest}" ]; then
                      echo "  ⬆ Updated ${dest}"
                  else
                      echo "  ➕ Added ${dest}"
                  fi
                  cp "${src}" "${dest}"
                  updated=1
              done < <(find "${src_root}" -type f "${find_args[@]}")
          }

          echo "=== Syncing config files ==="
          sync_tree files

          if [ "${SYNC_TEMPLATES}" = "true" ]; then
              echo ""
              echo "=== Syncing template files (new files only) ==="
              sync_tree templates
          fi

          # Clean up the source checkout so it never lands in a PR.
          rm -rf .config-sync-source

          echo "updated=${updated}" >> "${GITHUB_OUTPUT}"
      - name: Ensure config-sync label exists
        if: steps.pull.outputs.updated == '1'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |-
          if ! gh label create "config-sync" \
              --color "0075ca" \
              --description "Automated config sync PR" \
              --force; then
            echo "::warning::Could not create/update config-sync label (transient error or org policy). The PR will be created without it."
          fi
      - name: Create PR if configs changed
        if: steps.pull.outputs.updated == '1'
        uses: DevSecNinja/.github/actions/open-pr@9c281b38f863550ddff25df04e6fda0b9b23d00c # v3.3.0
        with:
          branch: chore/config-sync
          title: 'chore: sync config files from central repo'
          commit-message: 'chore: sync config files from DevSecNinja/.github'
          labels: config-sync
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          body: |-
            Automated PR — config files pulled from
            [DevSecNinja/.github](https://github.com/DevSecNinja/.github/tree/main/config-sync)
            at commit
            [`${{ steps.pull.outputs.source_sha }}`](https://github.com/DevSecNinja/.github/commit/${{ steps.pull.outputs.source_sha }}).

            Per-repo opt-out: add paths to `.github/.config-sync-ignore`.

            Triggered by `${{ github.workflow }}` on `${{ github.ref_name }}`
            at commit `${{ github.sha }}`.
