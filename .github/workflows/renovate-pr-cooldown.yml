---
name: Reusable — Renovate PR cooldown

# Enforces a "soak" period for Renovate PRs whose source registry does not
# expose a trusted release timestamp (e.g. ghcr.io / lscr.io / quay.io). For
# those registries the Renovate presets use `minimumReleaseAgeBehaviour:
# timestamp-optional`, so Renovate opens the PR immediately instead of blocking
# it forever. This workflow re-introduces the soak as a required
# `pr-cooldown` status check that only turns green once the PR has proposed
# its current change for at least `cooldown-days`. The clock starts at the
# oldest commit in the branch's force-push chain whose diff (the changed lines)
# equals the head commit's, so a rebase, a retitle or an autoclose/reopen that
# keeps the same version does not restart it, while any version or digest
# change does. Anything that cannot be compared (more than one commit, a
# missing patch, an unexpected push chain) falls back to the head commit date.
# GitHub auto-merge (Renovate `platformAutomerge`) then merges the PR once the
# check passes.
#
# Non-gated PRs (human PRs, or Renovate PRs from registries that DO provide a
# trusted timestamp) always receive a passing status so the required check
# never blocks them. See docs/design-decisions/0005-pr-age-cooldown-for-
# untrusted-timestamps.md.

on:
  workflow_call:
    inputs:
      cooldown-days:
        description: "Days a gated PR must soak before its status check passes."
        required: false
        type: number
        default: 14
      gated-branch-prefixes:
        description: >-
          Comma-separated Renovate branch prefixes to gate. The default matches
          the `docker-gated-` marker that .renovate/packageRules.json5 stamps
          onto every dependency Renovate cannot soak natively, so the gate and
          the Renovate config are driven by one shared decision.
        required: false
        type: string
        default: "renovate/docker-gated-"
      renovate-bot-login:
        description: "Login of the account that opens Renovate PRs."
        required: false
        type: string
        default: "renovate[bot]"
      status-context:
        description: "Commit status context name (add this to required checks)."
        required: false
        type: string
        default: "pr-cooldown"

permissions:
  contents: read

jobs:
  cooldown:
    name: pr-cooldown
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Evaluate PR cooldown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COOLDOWN_DAYS: ${{ inputs.cooldown-days }}
          GATED_PREFIXES: ${{ inputs.gated-branch-prefixes }}
          BOT_LOGIN: ${{ inputs.renovate-bot-login }}
          STATUS_CONTEXT: ${{ inputs.status-context }}
        with:
          script: |-
            const cooldownDays = Number(process.env.COOLDOWN_DAYS) || 14;
            const context_name = process.env.STATUS_CONTEXT || 'pr-cooldown';
            const botLogin = process.env.BOT_LOGIN || 'renovate[bot]';
            const prefixes = (process.env.GATED_PREFIXES || '')
              .split(',')
              .map((p) => p.trim())
              .filter(Boolean);
            const { owner, repo } = context.repo;
            const dayMs = 24 * 60 * 60 * 1000;

            // The `docker-gated-` marker is applied by the same Renovate rule
            // that sets timestamp-optional, so this can never drift from it.
            const isGated = (branch) =>
              prefixes.some((prefix) => branch.startsWith(prefix));

            // At most this many earlier commits are compared per PR. Stopping
            // early only makes the clock start later, never earlier.
            const maxLookback = 30;

            // The changed lines of a single-parent commit, per file. Renovate
            // force-pushes its branch as one commit on top of the base, so two
            // commits with the same signature propose the same change, whatever
            // the base or commit message. null means "cannot compare".
            const changeSignature = (commit) => {
              const files = commit.files || [];
              if ((commit.parents || []).length !== 1 || files.length === 0) {
                return null;
              }
              const parts = [];
              const sorted = [...files].sort((a, b) =>
                a.filename.localeCompare(b.filename),
              );
              for (const file of sorted) {
                if (typeof file.patch !== 'string') return null;
                const changed = file.patch
                  .split('\n')
                  .filter((line) => line.startsWith('+') || line.startsWith('-'));
                const renamedFrom = file.previous_filename || '';
                parts.push([file.status, renamedFrom, file.filename, ...changed].join('\n'));
              }
              return parts.join('\n\u0000\n');
            };

            const getCommit = async (ref) =>
              (await github.rest.repos.getCommit({ owner, repo, ref })).data;

            // When the PR started proposing its current change: the committer
            // date of the oldest commit in its force-push chain with the same
            // signature as the head. Falls back to the head commit date.
            const soakStart = async (pr) => {
              const head = await getCommit(pr.head.sha);
              const headDate = new Date(head.commit.committer.date);
              const headSignature = changeSignature(head);
              if (headSignature === null) return headDate;

              let pull;
              try {
                const data = await github.graphql(
                  `query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        commits { totalCount }
                        timelineItems(last: 100, itemTypes: [HEAD_REF_FORCE_PUSHED_EVENT]) {
                          nodes {
                            ... on HeadRefForcePushedEvent {
                              beforeCommit { oid }
                              afterCommit { oid }
                            }
                          }
                        }
                      }
                    }
                  }`,
                  { owner, repo, number: pr.number },
                );
                pull = data.repository.pullRequest;
              } catch (error) {
                core.warning(
                  `PR #${pr.number}: timeline unavailable (${error.message}); using the head commit date`,
                );
                return headDate;
              }
              if (pull.commits.totalCount !== 1) return headDate;

              const pushes = pull.timelineItems.nodes;
              let since = headDate;
              let expected = pr.head.sha;
              const oldest = Math.max(0, pushes.length - maxLookback);
              for (let i = pushes.length - 1; i >= oldest; i--) {
                const push = pushes[i];
                const after = push.afterCommit && push.afterCommit.oid;
                if (after !== expected || !push.beforeCommit) break;
                let before;
                try {
                  before = await getCommit(push.beforeCommit.oid);
                } catch (error) {
                  break;
                }
                if (changeSignature(before) !== headSignature) break;
                since = new Date(before.commit.committer.date);
                expected = push.beforeCommit.oid;
              }
              return since;
            };

            const setStatus = async (sha, state, description) => {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state,
                context: context_name,
                description: description.slice(0, 140),
              });
            };

            let pulls;
            if (context.eventName === 'pull_request') {
              pulls = [context.payload.pull_request];
            } else {
              pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
            }

            for (const pr of pulls) {
              const sha = pr.head.sha;
              const branch = pr.head.ref;
              const author = pr.user && pr.user.login;

              if (author !== botLogin || !isGated(branch)) {
                await setStatus(sha, 'success', 'No cooldown required');
                continue;
              }

              const since = await soakStart(pr);
              const ageDays = (Date.now() - since.getTime()) / dayMs;

              if (ageDays >= cooldownDays) {
                await setStatus(
                  sha,
                  'success',
                  `Cooldown complete (${cooldownDays}-day soak met)`,
                );
                core.info(`PR #${pr.number} (${branch}): cooldown met`);
              } else {
                const remaining = Math.max(1, Math.ceil(cooldownDays - ageDays));
                await setStatus(
                  sha,
                  'pending',
                  `Soaking: ${remaining} day(s) left of ${cooldownDays}-day cooldown`,
                );
                core.info(
                  `PR #${pr.number} (${branch}): ${remaining} day(s) left (proposed since ${since.toISOString()})`,
                );
              }
            }
