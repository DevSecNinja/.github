---
name: Reusable — Release Please

# Drives semver bumping and CHANGELOG.md generation via release-please.
# On every push to the target branch, this workflow either:
#
#   1. Opens (or force-updates) a release PR titled
#      `chore(<scope>): release <version>` containing the chore commit
#      and CHANGELOG.md update for the next semver derived from
#      Conventional Commits since the last tag.
#
#   2. When that release PR is merged, creates the `vX.Y.Z` git tag
#      pointing at the merge commit. **It does NOT create a GitHub
#      Release** (skip-github-release: true is set in each consumer's
#      release-please-config.json) — publishing is owned by the
#      consumer's existing tag-triggered `release.yml`.
#
# Branch protection is fully respected: the chore commit always lands
# via PR through normal CI. No bypass actor is needed.
#
# Authentication: pass `app-id` (input) + `app-private-key` (secret) so
# release PRs are opened by a GitHub App identity — App-opened PRs
# trigger `pull_request: opened` events, so required CI status checks
# fire automatically. Without those, release-please falls back to
# `GITHUB_TOKEN`, which by GitHub design does NOT trigger workflow runs
# on the PRs it opens; under branch protection that means the PR cannot
# satisfy required status checks. See:
#   https://docs.github.com/en/actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
#
# See also:
#   - https://github.com/googleapis/release-please-action
#   - DevSecNinja/.github docs/release-please-onboarding.md

on:
  workflow_call:
    inputs:
      target-branch:
        description: "Branch to track (defaults to main)."
        required: false
        type: string
        default: main
      config-file:
        description: "Path to release-please-config.json (relative to repo root)."
        required: false
        type: string
        default: release-please-config.json
      manifest-file:
        description: "Path to .release-please-manifest.json (relative to repo root)."
        required: false
        type: string
        default: .release-please-manifest.json
      app-id:
        description: |
          GitHub App ID used to mint a short-lived token for opening the
          release PR. When set, the App must be installed on the calling
          repo with Contents: write + Pull requests: write permissions.
          When unset, release-please falls back to GITHUB_TOKEN — release
          PRs will open but won't trigger CI on `pull_request` events.
        required: false
        type: string
        default: ""
    secrets:
      app-private-key:
        description: |
          PEM contents of the GitHub App's private key, paired with
          `app-id`. Required when `app-id` is set.
        required: false
    outputs:
      releases_created:
        description: "`true` when this run created at least one new tag."
        value: ${{ jobs.release-please.outputs.releases_created }}
      tag_name:
        description: "Tag created by release-please (e.g. `v1.2.0`), if any."
        value: ${{ jobs.release-please.outputs.tag_name }}
      pr:
        description: "PR JSON for the open release-PR, if any."
        value: ${{ jobs.release-please.outputs.pr }}

permissions:
  contents: read

jobs:
  release-please:
    name: Open or update release PR
    runs-on: ubuntu-24.04
    permissions:
      # release-please needs to push the chore-release branch and tag.
      # Used as fallback when `app-id` is not provided.
      contents: write
      # …and to open / update the release PR.
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      pr: ${{ steps.release-please.outputs.pr }}
    steps:
      - name: Generate App token
        id: app-token
        if: inputs.app-id != ''
        # renovate: datasource=github-releases depName=actions/create-github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          # Scope the minted token to only the permissions release-please
          # needs, instead of inheriting the App installation's blanket
          # permissions.
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release-please
        # renovate: datasource=github-releases depName=googleapis/release-please-action
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: ${{ inputs.target-branch }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          # Use the App token if available; otherwise fall back to
          # GITHUB_TOKEN. Release PRs opened with GITHUB_TOKEN won't
          # trigger CI — see top-of-file comment.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
