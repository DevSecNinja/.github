---
name: Reusable — Release Please

# Drives semver bumping and CHANGELOG.md generation via release-please.
# On every push to the target branch, this workflow either:
#
#   1. Opens (or force-updates) a release PR titled
#      `chore(<scope>): release <version>` containing the chore commit
#      and CHANGELOG.md update for the next semver derived from
#      Conventional Commits since the last tag.
#
#   2. When that release PR is merged, creates the `vX.Y.Z` git tag
#      pointing at the merge commit. Depending on the caller's config,
#      release-please either creates the GitHub Release directly
#      (`skip-github-release: false`) or leaves release publication to a
#      tag-triggered workflow (`skip-github-release: true`).
#
# Branch protection is fully respected: the chore commit always lands
# via PR through normal CI. No bypass actor is needed.
#
# Authentication (single-App contract, see docs/automation-app.md): a
# GitHub App token is mandatory; there is no GITHUB_TOKEN fallback,
# because release PRs and tags created by GITHUB_TOKEN do not trigger
# downstream workflows. The App ID comes from the `app-id` input or the
# caller repository's `AUTOMATION_APP_ID` variable; the private key from
# the `app-private-key` secret or the `AUTOMATION_APP_PRIVATE_KEY`
# secret (passed by name or via `secrets: inherit`). The job fails
# before Release Please runs when either is missing. App-opened PRs need
# no "Allow GitHub Actions to create and approve pull requests" setting.
#   https://docs.github.com/en/actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
#
# See also:
#   - https://github.com/googleapis/release-please-action
#   - DevSecNinja/.github docs/release-please-onboarding.md

on:
  workflow_call:
    inputs:
      target-branch:
        description: "Branch to track (defaults to main)."
        required: false
        type: string
        default: main
      config-file:
        description: "Path to release-please-config.json (relative to repo root)."
        required: false
        type: string
        default: release-please-config.json
      manifest-file:
        description: "Path to .release-please-manifest.json (relative to repo root)."
        required: false
        type: string
        default: .release-please-manifest.json
      app-id:
        description: |
          GitHub App ID used to mint a short-lived token. Empty (default)
          reads the caller repository's AUTOMATION_APP_ID variable. The App
          must be installed on the calling repo with Contents: write and
          Pull requests: write permissions.
        required: false
        type: string
        default: ""
      app-environment:
        description: |
          Actions environment that holds the App credentials (the dotfiles
          GitHubRepoConfig module provisions them into `production`, pinned
          to the default branch). Repository-level credentials work with the
          default too: environment values only take precedence when they
          exist.
        required: false
        type: string
        default: production
    secrets:
      app-private-key:
        description: |
          Explicit PEM private key of the GitHub App; overrides
          AUTOMATION_APP_PRIVATE_KEY.
        required: false
      AUTOMATION_APP_PRIVATE_KEY:
        description: |
          PEM private key of the GitHub App. Pass it by name, or use
          `secrets: inherit`.
        required: false
    outputs:
      releases_created:
        description: "`true` when this run created at least one new tag."
        value: ${{ jobs.release-please.outputs.releases_created }}
      tag_name:
        description: "Tag created by release-please (e.g. `v1.2.0`), if any."
        value: ${{ jobs.release-please.outputs.tag_name }}
      pr:
        description: "PR JSON for the open release-PR, if any."
        value: ${{ jobs.release-please.outputs.pr }}

permissions:
  contents: read

jobs:
  release-please:
    name: Open or update release PR
    runs-on: ubuntu-24.04
    # Exposes the environment's AUTOMATION_APP_* values without creating a
    # deployment record on every run.
    environment:
      name: ${{ inputs.app-environment }}
      deployment: false
    permissions:
      # release-please needs to push the chore-release branch and tag.
      contents: write
      # ...and to open / update the release PR.
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      pr: ${{ steps.release-please.outputs.pr }}
    steps:
      - name: Validate GitHub App credentials
        shell: bash
        env:
          APP_ID: ${{ inputs.app-id || vars.AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key || secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: |-
          if [[ -z "${APP_ID//[[:space:]]/}" || -z "${APP_PRIVATE_KEY//[[:space:]]/}" ]]; then
              if [[ -n "${APP_ID//[[:space:]]/}" ]]; then
                  echo "::error title=GitHub App authentication required::AUTOMATION_APP_ID is set, but the calling job does not pass the AUTOMATION_APP_PRIVATE_KEY secret: https://github.com/DevSecNinja/.github/blob/main/docs/automation-app.md"
              else
                  echo "::error title=GitHub App authentication required::Configure the App installation and the AUTOMATION_APP_ID / AUTOMATION_APP_PRIVATE_KEY credentials: https://github.com/DevSecNinja/.github/blob/main/docs/release-please-onboarding.md"
              fi
              exit 1
          fi

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-id || vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.app-private-key || secrets.AUTOMATION_APP_PRIVATE_KEY }}
          # Scope the minted token to the calling repository and only the
          # permissions release-please needs, instead of inheriting the App
          # installation's blanket permissions.
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: ${{ inputs.target-branch }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          token: ${{ steps.app-token.outputs.token }}
