---
name: Secret scan

# Full-history gitleaks scan, after each merge and weekly (#520). Pull requests
# are scanned by the Lint workflow, which checks only the PR's own commits.
# This repository is public, so findings go to code scanning (category
# `gitleaks/history`) and the log shows a count only.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch: # checkov:skip=CKV_GHA_7: Scan workflow only -- no artifacts produced.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    # Local reference validates reusable workflow changes in this repository.
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      security-events: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.10.19"
      lint-config-dir: config-sync/files
      lint-dprint: false
      lint-yamlfmt: false
      lint-yamllint: false
      lint-actionlint: false
      lint-go: false
      lint-shellcheck: false
      lint-shfmt: false
      lint-checkov: false
      lint-trivy: false
      lint-zizmor: false
