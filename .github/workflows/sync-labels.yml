---
name: Label Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - config-sync/files/.github/labels-base.yaml
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  label-sync:
    uses: DevSecNinja/.github/.github/workflows/label-sync.yml@2af80ab424c47cb8fb112240986f6fec864d883f # v5.0.1
    permissions:
      contents: read
      issues: write
    with:
      base-labels-file: config-sync/files/.github/labels-base.yaml
