---
name: Reusable — Lint

on:
  workflow_call:
    inputs:
      mise-version:
        description: "mise version to install"
        required: true
        type: string
      golangci-lint-version:
        description: "golangci-lint version to install (required only when Go linting runs)"
        required: false
        type: string
        default: ""
      go-version-file:
        description: "Path to the Go version file"
        required: false
        type: string
        default: "go.mod"
      lint-config-dir:
        description: "Directory containing optional linter config files"
        required: false
        type: string
        default: ""
      lint-fail-on-error:
        description: "Fail the workflow when a linter fails"
        required: false
        type: boolean
        default: false
      lint-dprint:
        description: "Run dprint (Markdown formatting)"
        required: false
        type: boolean
        default: true
      lint-yamlfmt:
        description: "Run yamlfmt (YAML formatting)"
        required: false
        type: boolean
        default: true
      lint-yamllint:
        description: "Run yamllint (YAML linting)"
        required: false
        type: boolean
        default: true
      lint-actionlint:
        description: "Run actionlint (GitHub Actions linting)"
        required: false
        type: boolean
        default: true
      lint-gitleaks:
        description: "Run gitleaks (secret scanning)"
        required: false
        type: boolean
        default: true
      lint-go:
        description: "Run golangci-lint (Go linting)"
        required: false
        type: boolean
        default: true
      lint-shellcheck:
        description: "Run shellcheck (shell linting)"
        required: false
        type: boolean
        default: true
      lint-shellcheck-exclude:
        description: "Glob pattern for paths to exclude from shellcheck (passed to find -not -path)"
        required: false
        type: string
        default: ""
      lint-shfmt:
        description: "Run shfmt (shell formatting)"
        required: false
        type: boolean
        default: true
      lint-shfmt-exclude:
        description: "Glob pattern for paths to exclude from shfmt (passed to find -not -path)"
        required: false
        type: string
        default: ""
      lint-checkov:
        description: "Run checkov (IaC security) — uploads SARIF"
        required: false
        type: boolean
        default: true
      lint-trivy:
        description: "Run trivy fs (misconfig + secrets) — uploads SARIF"
        required: false
        type: boolean
        default: true
      lint-zizmor:
        description: "Run zizmor (Actions security) — uploads SARIF"
        required: false
        type: boolean
        default: true
      lint-config-drift:
        description: "Check local config files match central DevSecNinja/.github repo"
        required: false
        type: boolean
        default: false
      upload-sarif:
        description: "Upload checkov/trivy/zizmor results to GitHub code scanning (requires GitHub Advanced Security). Set
          false for private repos without GHAS to gate on exit codes with console output instead."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dprint:
    name: dprint
    if: ${{ inputs.lint-dprint }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Check formatting with dprint
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
        run: |-
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which dprint >/dev/null 2>&1; then
            echo "::error::'dprint' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use dprint@<version>', so this lint job can run it."
            exit 1
          fi
          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/dprint.json" ]; then
            mise exec -- dprint check \
              --config "${CONFIG_DIR}/dprint.json" \
              --config-discovery=false \
              --allow-no-files
          else
            mise exec -- dprint check --allow-no-files
          fi

  yamlfmt:
    name: yamlfmt
    if: ${{ inputs.lint-yamlfmt }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Check YAML formatting
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
        run: |-
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which yamlfmt >/dev/null 2>&1; then
            echo "::error::'yamlfmt' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use yamlfmt@<version>', so this lint job can run it."
            exit 1
          fi
          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/.yamlfmt.yaml" ]; then
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 |
              xargs -0 mise exec -- yamlfmt -conf "${CONFIG_DIR}/.yamlfmt.yaml" -lint
          else
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 |
              xargs -0 mise exec -- yamlfmt -lint
          fi

  yamllint:
    name: yamllint
    if: ${{ inputs.lint-yamllint }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run yamllint
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
        run: |-
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which yamllint >/dev/null 2>&1; then
            echo "::error::'yamllint' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use yamllint@<version>', so this lint job can run it."
            exit 1
          fi
          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/.yamllint.yaml" ]; then
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 |
              xargs -0 mise exec -- yamllint -c "${CONFIG_DIR}/.yamllint.yaml"
          else
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 |
              xargs -0 mise exec -- yamllint
          fi

  actionlint:
    name: actionlint
    if: ${{ inputs.lint-actionlint }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run actionlint
        run: mise exec -- actionlint

  gitleaks:
    name: gitleaks
    if: ${{ inputs.lint-gitleaks }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run gitleaks
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
        run: |-
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which gitleaks >/dev/null 2>&1; then
            echo "::error::'gitleaks' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use gitleaks@<version>', so this lint job can run it."
            exit 1
          fi
          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/.gitleaks.toml" ]; then
            mise exec -- gitleaks detect --redact --config "${CONFIG_DIR}/.gitleaks.toml"
          else
            mise exec -- gitleaks detect --redact
          fi

  go:
    name: go
    if: ${{ inputs.lint-go }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Go version file
        id: go-version-file
        env:
          GO_VERSION_FILE: ${{ inputs.go-version-file }}
        run: |-
          if [ -f "${GO_VERSION_FILE}" ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::${GO_VERSION_FILE} not found; skipping Go linter"
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate golangci-lint version
        if: ${{ steps.go-version-file.outputs.exists == 'true' && inputs.golangci-lint-version == '' }}
        env:
          GO_VERSION_FILE: ${{ inputs.go-version-file }}
        run: |-
          echo "::error::Go linting is required (${GO_VERSION_FILE} found) but no golangci-lint-version input was provided. Pass golangci-lint-version when calling this reusable workflow for Go repositories."
          exit 1

      - name: Setup Go
        if: ${{ steps.go-version-file.outputs.exists == 'true' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Run golangci-lint
        if: ${{ steps.go-version-file.outputs.exists == 'true' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}

  shellcheck:
    name: shellcheck
    if: ${{ inputs.lint-shellcheck }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run shellcheck
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
          EXCLUDE_PATTERN: ${{ inputs.lint-shellcheck-exclude }}
        run: |
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which shellcheck >/dev/null 2>&1; then
            echo "::error::'shellcheck' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use shellcheck@<version>', so this lint job can run it."
            exit 1
          fi
          repo_dir="${GITHUB_WORKSPACE:-$PWD}"
          shellcheck_workdir="${repo_dir}"

          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/.shellcheckrc" ]; then
            if [ -f "${repo_dir}/.shellcheckrc" ]; then
              echo "::notice::.shellcheckrc already exists; using the local file"
            else
              shellcheck_workdir="${RUNNER_TEMP:-/tmp}/shellcheck-config"
              mkdir -p "${shellcheck_workdir}"
              cp "${CONFIG_DIR}/.shellcheckrc" "${shellcheck_workdir}/.shellcheckrc"
            fi
          fi

          if [ -n "${EXCLUDE_PATTERN}" ]; then
            find "${repo_dir}" -name '*.sh' -not -path "${repo_dir}/${EXCLUDE_PATTERN}" -print0 |
              (cd "${shellcheck_workdir}" && xargs -0 -r mise exec -- shellcheck)
          else
            find "${repo_dir}" -name '*.sh' -print0 |
              (cd "${shellcheck_workdir}" && xargs -0 -r mise exec -- shellcheck)
          fi

  shfmt:
    name: shfmt
    if: ${{ inputs.lint-shfmt }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run shfmt
        env:
          EXCLUDE_PATTERN: ${{ inputs.lint-shfmt-exclude }}
        run: |
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which shfmt >/dev/null 2>&1; then
            echo "::error::'shfmt' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use shfmt@<version>', so this lint job can run it."
            exit 1
          fi
          if [ -n "${EXCLUDE_PATTERN}" ]; then
            find . -name '*.sh' -not -path "./${EXCLUDE_PATTERN}" -print0 | xargs -0 -r mise exec -- shfmt --diff
          else
            find . -name '*.sh' -print0 | xargs -0 -r mise exec -- shfmt --diff
          fi

  checkov:
    name: checkov
    if: ${{ inputs.lint-checkov }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run checkov
        env:
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: |-
          if [ "${UPLOAD_SARIF}" = "true" ]; then
            mise exec -- checkov -d . --output sarif --output-file-path . || true
          else
            # No GitHub Advanced Security: gate on exit code with console output.
            mise exec -- checkov -d . --compact --quiet
          fi

      - name: Filter skipped checks from SARIF
        if: ${{ always() && inputs.upload-sarif }}
        run: |-
          if [ -f results_sarif.sarif ]; then
            jq '
              .runs |= [
                .[] | .results |= [
                  .[] | select(.level != "none")
                ]
              ]
            ' results_sarif.sarif > results_sarif_filtered.sarif
            mv results_sarif_filtered.sarif results_sarif.sarif
          fi

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: ${{ always() && inputs.upload-sarif }}
        with:
          sarif_file: results_sarif.sarif
          category: checkov

  trivy:
    name: trivy
    if: ${{ inputs.lint-trivy }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run trivy
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: |-
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which trivy >/dev/null 2>&1; then
            echo "::error::'trivy' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use trivy@<version>', so this lint job can run it."
            exit 1
          fi
          trivy_args=()
          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/trivy.yaml" ]; then
            trivy_args+=(--config "${CONFIG_DIR}/trivy.yaml")
          fi

          if [ "${UPLOAD_SARIF}" = "true" ]; then
            mise exec -- trivy fs "${trivy_args[@]}" \
              --scanners misconfig,secret \
              --format sarif \
              --output trivy.sarif . || true
          else
            # No GitHub Advanced Security: gate on exit code with console output.
            mise exec -- trivy fs "${trivy_args[@]}" \
              --scanners misconfig,secret \
              --exit-code 1 .
          fi

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: ${{ inputs.upload-sarif }}
        with:
          sarif_file: trivy.sarif
          category: trivy

  zizmor:
    name: zizmor
    if: ${{ inputs.lint-zizmor }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run zizmor
        env:
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: |-
          if [ "${UPLOAD_SARIF}" = "true" ]; then
            mise exec -- zizmor --format sarif . > zizmor.sarif
          else
            # No GitHub Advanced Security: gate on exit code with console output.
            mise exec -- zizmor .
          fi

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: ${{ always() && inputs.upload-sarif }}
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  config-drift:
    name: config drift
    if: ${{ inputs.lint-config-drift }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check config drift against central repo
        run: |-
          BASE_URL="https://raw.githubusercontent.com/DevSecNinja/.github/main/config-sync/files"
          API_URL="https://api.github.com/repos/DevSecNinja/.github/contents/config-sync/files"
          drifted=0

          # Dynamically discover files from the central repo
          files=$(curl -sf "${API_URL}" | grep '"name"' | sed 's/.*"name": "\(.*\)".*/\1/')

          for file in ${files}; do
            if [ ! -f "${file}" ]; then
              echo "::warning::${file} exists in central repo but not locally (skipping)"
              continue
            fi

            echo "Checking ${file}..."
            if ! curl -sf "${BASE_URL}/${file}" | diff -u "${file}" - > /tmp/diff_output 2>&1; then
              echo "::error::${file} has drifted from central config"
              cat /tmp/diff_output
              drifted=1
            else
              echo "  ✓ ${file} matches"
            fi
          done

          if [ "${drifted}" -eq 1 ]; then
            echo ""
            echo "Config files have drifted from DevSecNinja/.github/config-sync/files/"
