  config-drift:
    name: config drift
    if: ${{ inputs.lint-config-drift && !inputs.lint-gitleaks-only && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode
      == 'auto' && !github.event.repository.private)) }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check config drift against central repo
        run: |-
          BASE_URL="https://raw.githubusercontent.com/DevSecNinja/.github/main/config-sync/files"
          API_URL="https://api.github.com/repos/DevSecNinja/.github/contents/config-sync/files"
          drifted=0

          # Dynamically discover files from the central repo
          files=$(curl -sf "${API_URL}" | grep '"name"' | sed 's/.*"name": "\(.*\)".*/\1/')

          for file in ${files}; do
            if [ ! -f "${file}" ]; then
              echo "::warning::${file} exists in central repo but not locally (skipping)"
              continue
            fi

            echo "Checking ${file}..."
            if ! curl -sf "${BASE_URL}/${file}" | diff -u "${file}" - > /tmp/diff_output 2>&1; then
              echo "::error::${file} has drifted from central config"
              cat /tmp/diff_output
              drifted=1
            else
              echo "  ✓ ${file} matches"
            fi
          done

          if [ "${drifted}" -eq 1 ]; then
            echo ""
            echo "Config files have drifted from DevSecNinja/.github/config-sync/files/"
            echo "Run the config-sync workflow or manually update the files."
            exit 1
          fi

          echo ""
          echo "All config files match the central repository."

  all-linters:
    # Single-job mode (`lint-job-mode: single`, or `auto` on a private
    # repository). Every enabled linter runs as a step of this one job, so a
    # lint run is billed as one job instead of a rounded-up minute per linter
    # job, and mise and its tools are installed once instead of ten times.
    # Each linter step repeats the run script of its per-linter job above
    # verbatim; tests/lint-job-modes-contract.sh fails when the copies drift.
    # Linter steps use continue-on-error so one failure does not hide the
    # others; the final step reports every failure and fails the job.
    name: all linters
    if: ${{ !(inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Validate lint-job-mode
        env:
          LINT_JOB_MODE: ${{ inputs.lint-job-mode }}
        run: |-
          case "${LINT_JOB_MODE}" in
            auto | single) ;;
            *)
              echo "::error::lint-job-mode must be one of: auto, single, parallel (got '${LINT_JOB_MODE}')."
              exit 1
              ;;
          esac

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the full git history; the other linters need only HEAD.
          fetch-depth: ${{ !inputs.lint-gitleaks && 1 || 0 }}
          persist-credentials: false

      - name: Install mise
        if: >-
          ${{ inputs.lint-dprint || inputs.lint-yamlfmt || inputs.lint-yamllint || inputs.lint-actionlint || inputs.lint-gitleaks
          || inputs.lint-shellcheck || inputs.lint-shfmt || inputs.lint-checkov || inputs.lint-trivy || inputs.lint-zizmor
          }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Check formatting with dprint
        id: dprint
        if: ${{ inputs.lint-dprint && !inputs.lint-gitleaks-only }}
        continue-on-error: true
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
        run: |-
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which dprint >/dev/null 2>&1; then
            echo "::error::'dprint' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use dprint@<version>', so this lint job can run it."
            exit 1
          fi
          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/dprint.json" ]; then
            mise exec -- dprint check \
              --config "${CONFIG_DIR}/dprint.json" \
              --config-discovery=false \
              --allow-no-files
          else
            mise exec -- dprint check --allow-no-files
          fi

      - name: Check YAML formatting
        id: yamlfmt
        if: ${{ inputs.lint-yamlfmt && !inputs.lint-gitleaks-only }}
        continue-on-error: true
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
        run: |-
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which yamlfmt >/dev/null 2>&1; then
            echo "::error::'yamlfmt' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use yamlfmt@<version>', so this lint job can run it."
            exit 1
          fi
          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/.yamlfmt.yaml" ]; then
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 |
              xargs -0 mise exec -- yamlfmt -conf "${CONFIG_DIR}/.yamlfmt.yaml" -lint
          else
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 |
              xargs -0 mise exec -- yamlfmt -lint
          fi

      - name: Run yamllint
        id: yamllint
        if: ${{ inputs.lint-yamllint && !inputs.lint-gitleaks-only }}
        continue-on-error: true
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
        run: |-
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which yamllint >/dev/null 2>&1; then
            echo "::error::'yamllint' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use yamllint@<version>', so this lint job can run it."
            exit 1
          fi
          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/.yamllint.yaml" ]; then
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 |
              xargs -0 mise exec -- yamllint -c "${CONFIG_DIR}/.yamllint.yaml"
          else
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 |
              xargs -0 mise exec -- yamllint
          fi

      - name: Run actionlint
        id: actionlint
        if: ${{ inputs.lint-actionlint && !inputs.lint-gitleaks-only }}
        continue-on-error: true
        run: mise exec -- actionlint

      - name: Run gitleaks
        id: gitleaks
        if: ${{ inputs.lint-gitleaks }}
        continue-on-error: true
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which gitleaks >/dev/null 2>&1; then
            echo "::error::'gitleaks' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use gitleaks@<version>', so this lint job can run it."
            exit 1
          fi
          config_args=()
          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/.gitleaks.toml" ]; then
            config_args=(--config "${CONFIG_DIR}/.gitleaks.toml")
          fi
          # --redact keeps the secret out of every report.
          report="${RUNNER_TEMP}/gitleaks-report.json"

          # Pull requests (and merge queues) scan only their own commits, so
          # old history never shows up on an unrelated PR, and a secret added
          # in the PR fails it. The next step annotates those findings.
          if [ -n "${BASE_SHA}" ] && [ -n "${HEAD_SHA}" ]; then
            echo "mode=pr" >>"${GITHUB_OUTPUT}"
            for sha in "${BASE_SHA}" "${HEAD_SHA}"; do
              if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
                echo "::error::Commit ${sha} of this pull request isn't checked out (pull_request_target?), so its commits can't be scanned."
                exit 1
              fi
            done
            # Also skip commits already on the base branch's current tip: the
            # event's base SHA can be older when the PR merged newer commits.
            range="${HEAD_SHA} --not ${BASE_SHA}"
            if base_tip="$(git rev-parse --verify -q "refs/remotes/origin/${BASE_REF#refs/heads/}^{commit}")"; then
              range="${range} ${base_tip}"
            fi
            mise exec -- gitleaks detect --redact --log-opts="${range}" \
              --report-format json --report-path "${report}" "${config_args[@]}"
            exit 0
          fi

          # Other events (push, schedule, dispatch) scan the full history, so
          # new gitleaks rules re-check old commits. This only reports, so the
          # findings are triaged as alerts. Job logs of public repositories are
          # public: there the findings go only to code scanning, and the log
          # shows a count. Internal repositories (logs visible enterprise-wide)
          # and a failed visibility lookup count as public.
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility 2>/dev/null)" = private ]; then
            mode=history-private
            format=json
          else
            mode=history-public
            format=sarif
            report="${RUNNER_TEMP}/gitleaks-history.sarif"
          fi
          echo "mode=${mode}" >>"${GITHUB_OUTPUT}"
          status=0
          log="${RUNNER_TEMP}/gitleaks-history.log"
          mise exec -- gitleaks detect --redact --exit-code 42 \
            --report-format "${format}" --report-path "${report}" "${config_args[@]}" >"${log}" 2>&1 || status=$?
          if [ "${mode}" = history-private ]; then
            cat "${log}"
          fi
          rm -f "${log}"
          if [ "${status}" -ne 0 ] && [ "${status}" -ne 42 ]; then
            if [ "${mode}" = history-public ]; then
              # gitleaks' diagnostics can name findings (for example an invalid
              # .gitleaksignore entry), and this log is public: withhold them.
              echo "::error::gitleaks failed (exit ${status}). Its log is withheld because job logs of public repositories are public: run gitleaks on a private clone to see why."
            fi
            exit "${status}"
          fi
          if [ "${mode}" = history-private ]; then
            count="$(jq length "${report}")"
            where="See the job summary."
          else
            # Make the SARIF valid for code scanning, whose upload would
            # otherwise log invalid URIs (file paths) or reject path-only
            # findings (line 0): percent-encode paths, drop empty regions.
            # Without a security-severity, code scanning files the findings as
            # non-security warnings.
            jq '(.runs[].results[].locations[]?.physicalLocation) |= (
                .artifactLocation.uri |= (split("/") | map(@uri) | join("/"))
                | if .region then .region |= with_entries(select(.value | type != "number" or . >= 1)) else . end
                | if (.region.startLine // 0) < 1 then del(.region) else . end
              )
              # Leaked secrets are security alerts: high severity, error level.
              | (.runs[].tool.driver.rules[]?.properties) |= ((. // {}) + {"security-severity": "8.0"}
                  | .tags = ((.tags // []) + ["security", "secret"]))
              | (.runs[].results[]?.level) = "error"
              # The upload also rejects repeated tags, which gitleaks copies from rules.
              | walk(if type == "object" then (if (.tags | type) == "array" then .tags |= unique else . end) else . end)
            ' "${report}" >"${report}.tmp"
            mv "${report}.tmp" "${report}"
            count="$(jq '[.runs[].results[]] | length' "${report}")"
            where="They are in code scanning (category gitleaks/history), visible only with write access."
            if [ "${UPLOAD_SARIF}" != true ]; then
              where="upload-sarif is off, so they are not published: run gitleaks on a private clone."
            elif [ "${RUNNER_DEBUG:-}" = 1 ]; then
              # With debug logging the upload logs file paths it can't fingerprint.
              where="Debug logging is on, so the code scanning upload is skipped: re-run without it."
            else
              echo "sarif=true" >>"${GITHUB_OUTPUT}"
            fi
          fi
          if [ "${count}" -gt 0 ]; then
            echo "::warning::gitleaks found ${count} finding(s) in the git history. ${where}"
          fi

      - name: Report gitleaks findings
        if: ${{ !cancelled() && inputs.lint-gitleaks }}
        env:
          SCAN_MODE: ${{ steps.gitleaks.outputs.mode }}
          FINDINGS_ARTIFACT: gitleaks-findings-${{ job.check_run_id }}
        run: |-
          # Turns the gitleaks report into one annotation per finding and a
          # step-summary table. Only the rule, location, commit and date leave
          # the report: never the secret, the match or the matched line. On
          # public repositories only PR findings get here: full-history
          # findings go to code scanning, never to the public log.
          case "${SCAN_MODE}" in
            pr) level=error scope="this pull request's commits" ;;
            history-private) level=warning scope="the git history" ;;
            *) exit 0 ;;
          esac
          report="${RUNNER_TEMP}/gitleaks-report.json"
          findings="${RUNNER_TEMP}/gitleaks-findings.json"
          [ -s "${report}" ] || exit 0
          jq '[.[] | {RuleID, Description, File, StartLine, EndLine, Commit, Date, Fingerprint}]' \
            "${report}" >"${findings}"
          count="$(jq length "${findings}")"
          if [ "${count}" -eq 0 ]; then
            rm -f "${findings}"
            exit 0
          fi

          jq -r --arg level "${level}" '
            def msg: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def prop: msg | gsub(":"; "%3A") | gsub(","; "%2C");
            # Path-only rules report StartLine 0; annotate those at file level.
            .[] | "::\($level) file=\(.File | prop)\(if .StartLine > 0 then ",line=\(.StartLine)" else "" end)"
              + ",title=gitleaks \(.RuleID | prop)::"
              + "\(.RuleID | msg) in commit \((.Commit // "")[0:7] | msg) (secret redacted)"
          ' "${findings}"

          {
            echo "### gitleaks: ${count} finding(s) in ${scope}"
            echo ""
            echo "Secrets are redacted. To accept a false positive, add its fingerprint (in the"
            echo "\`${FINDINGS_ARTIFACT}\` artifact) to \`.gitleaksignore\`; rotate any real secret."
            echo ""
            echo "| Rule | File:line | Commit | Author date |"
            echo "| ---- | --------- | ------ | ----------- |"
            jq -r '
              def cell: tostring | gsub("\\|"; "\\|") | gsub("[\r\n]"; " ");
              .[] | "| \(.RuleID | cell) | \(.File | cell)\(if .StartLine > 0 then ":\(.StartLine)" else "" end)"
                + " | \((.Commit // "")[0:7]) | \(.Date | cell) |"
            ' "${findings}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload gitleaks findings
        # The findings file exists only for PR and private history scans.
        if: ${{ !cancelled() && steps.gitleaks.outputs.mode != 'history-public' }}
        # Best effort: a failed upload must not change the lint gate.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Unique per job: a caller may run lint.yml more than once per run.
          name: gitleaks-findings-${{ job.check_run_id }}
          path: ${{ runner.temp }}/gitleaks-findings.json
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload gitleaks history to code scanning
        id: gitleaks-sarif
        if: ${{ !cancelled() && inputs.upload-sarif && steps.gitleaks.outputs.sarif == 'true' }}
        # Let the remaining linters run; the last step reports the failure.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-history.sarif
          category: gitleaks/history
      - name: Check for Go version file
        id: go-version-file
        if: ${{ inputs.lint-go && !inputs.lint-gitleaks-only }}
        env:
          GO_VERSION_FILE: ${{ inputs.go-version-file }}
        run: |-
          if [ -f "${GO_VERSION_FILE}" ]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::${GO_VERSION_FILE} not found; skipping Go linter"
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate golangci-lint version
        id: golangci-lint-version
        if: ${{ steps.go-version-file.outputs.exists == 'true' && inputs.golangci-lint-version == '' }}
        continue-on-error: true
        env:
          GO_VERSION_FILE: ${{ inputs.go-version-file }}
        run: |-
          echo "::error::Go linting is required (${GO_VERSION_FILE} found) but no golangci-lint-version input was provided. Pass golangci-lint-version when calling this reusable workflow for Go repositories."
          exit 1

      - name: Setup Go
        id: setup-go
        if: ${{ steps.go-version-file.outputs.exists == 'true' && inputs.golangci-lint-version != '' }}
        continue-on-error: true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Run golangci-lint
        id: go
        if: ${{ steps.setup-go.outcome == 'success' }}
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}

      - name: Run shellcheck
        id: shellcheck
        if: ${{ inputs.lint-shellcheck && !inputs.lint-gitleaks-only }}
        continue-on-error: true
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
          EXCLUDE_PATTERN: ${{ inputs.lint-shellcheck-exclude }}
        run: |
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which shellcheck >/dev/null 2>&1; then
            echo "::error::'shellcheck' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use shellcheck@<version>', so this lint job can run it."
            exit 1
          fi
          repo_dir="${GITHUB_WORKSPACE:-$PWD}"
          shellcheck_workdir="${repo_dir}"

          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/.shellcheckrc" ]; then
            if [ -f "${repo_dir}/.shellcheckrc" ]; then
              echo "::notice::.shellcheckrc already exists; using the local file"
            else
              shellcheck_workdir="${RUNNER_TEMP:-/tmp}/shellcheck-config"
              mkdir -p "${shellcheck_workdir}"
              cp "${CONFIG_DIR}/.shellcheckrc" "${shellcheck_workdir}/.shellcheckrc"
            fi
          fi

          if [ -n "${EXCLUDE_PATTERN}" ]; then
            find "${repo_dir}" -name '*.sh' -not -path "${repo_dir}/${EXCLUDE_PATTERN}" -print0 |
              (cd "${shellcheck_workdir}" && xargs -0 -r mise exec -- shellcheck)
          else
            find "${repo_dir}" -name '*.sh' -print0 |
              (cd "${shellcheck_workdir}" && xargs -0 -r mise exec -- shellcheck)
          fi

      - name: Run shfmt
        id: shfmt
        if: ${{ inputs.lint-shfmt && !inputs.lint-gitleaks-only }}
        continue-on-error: true
        env:
          EXCLUDE_PATTERN: ${{ inputs.lint-shfmt-exclude }}
        run: |
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which shfmt >/dev/null 2>&1; then
            echo "::error::'shfmt' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use shfmt@<version>', so this lint job can run it."
            exit 1
          fi
          if [ -n "${EXCLUDE_PATTERN}" ]; then
            find . -name '*.sh' -not -path "./${EXCLUDE_PATTERN}" -print0 | xargs -0 -r mise exec -- shfmt --diff
          else
            find . -name '*.sh' -print0 | xargs -0 -r mise exec -- shfmt --diff
          fi

      - name: Run checkov
        id: checkov
        if: ${{ inputs.lint-checkov && !inputs.lint-gitleaks-only }}
        continue-on-error: true
        env:
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: |-
          if [ "${UPLOAD_SARIF}" = "true" ]; then
            mise exec -- checkov -d . --output sarif --output-file-path "${RUNNER_TEMP}" || true
          else
            # No GitHub Advanced Security: gate on exit code with console output.
            mise exec -- checkov -d . --compact --quiet
          fi

      - name: Filter skipped checks from SARIF
        id: checkov-sarif-filter
        if: ${{ inputs.lint-checkov && !inputs.lint-gitleaks-only && inputs.upload-sarif }}
        continue-on-error: true
        run: |-
          sarif="${RUNNER_TEMP}/results_sarif.sarif"
          if [ -f "${sarif}" ]; then
            jq '
              .runs |= [
                .[] | .results |= [
                  .[] | select(.level != "none")
                ]
              ]
            ' "${sarif}" > "${sarif}.filtered"
            mv "${sarif}.filtered" "${sarif}"
          fi

      - name: Upload checkov SARIF report
        id: checkov-sarif
        if: ${{ inputs.lint-checkov && !inputs.lint-gitleaks-only && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/results_sarif.sarif
          category: checkov

      - name: Run trivy
        id: trivy
        if: ${{ inputs.lint-trivy && !inputs.lint-gitleaks-only }}
        continue-on-error: true
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: |-
          # Lint tool versions are owned by the consuming repo: pinned and
          # Renovate-managed in its mise config. Fail early with guidance when
          # the tool this job needs is missing, rather than a cryptic mise error.
          if [ ! -f mise.toml ] && [ ! -f .mise.toml ] && [ ! -f .config/mise/config.toml ] && [ ! -f .config/mise.toml ]; then
            echo "::error::No mise config found. Add a Renovate-managed mise.toml (or .mise.toml) that pins your lint tools."
            exit 1
          fi
          if ! mise which trivy >/dev/null 2>&1; then
            echo "::error::'trivy' is not pinned in this repository's mise config. Add it (Renovate-managed), e.g. 'mise use trivy@<version>', so this lint job can run it."
            exit 1
          fi
          trivy_args=()
          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/trivy.yaml" ]; then
            trivy_args+=(--config "${CONFIG_DIR}/trivy.yaml")
          fi

          if [ "${UPLOAD_SARIF}" = "true" ]; then
            mise exec -- trivy fs "${trivy_args[@]}" \
              --scanners misconfig,secret \
              --format sarif \
              --output "${RUNNER_TEMP}/trivy.sarif" . || true
          else
            # No GitHub Advanced Security: gate on exit code with console output.
            mise exec -- trivy fs "${trivy_args[@]}" \
              --scanners misconfig,secret \
              --exit-code 1 .
          fi

      - name: Upload trivy SARIF report
        id: trivy-sarif
        if: ${{ inputs.lint-trivy && !inputs.lint-gitleaks-only && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy

      - name: Run zizmor
        id: zizmor
        if: ${{ inputs.lint-zizmor && !inputs.lint-gitleaks-only }}
        continue-on-error: true
        env:
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: |-
          if [ "${UPLOAD_SARIF}" = "true" ]; then
            mise exec -- zizmor --format sarif . > "${RUNNER_TEMP}/zizmor.sarif"
          else
            # No GitHub Advanced Security: gate on exit code with console output.
            mise exec -- zizmor .
          fi

      - name: Upload zizmor SARIF report
        id: zizmor-sarif
        if: ${{ inputs.lint-zizmor && !inputs.lint-gitleaks-only && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor

      - name: Check config drift against central repo
        id: config-drift
        if: ${{ inputs.lint-config-drift && !inputs.lint-gitleaks-only }}
        continue-on-error: true
        run: |-
          BASE_URL="https://raw.githubusercontent.com/DevSecNinja/.github/main/config-sync/files"
          API_URL="https://api.github.com/repos/DevSecNinja/.github/contents/config-sync/files"
          drifted=0

          # Dynamically discover files from the central repo
          files=$(curl -sf "${API_URL}" | grep '"name"' | sed 's/.*"name": "\(.*\)".*/\1/')

          for file in ${files}; do
            if [ ! -f "${file}" ]; then
              echo "::warning::${file} exists in central repo but not locally (skipping)"
              continue
            fi

            echo "Checking ${file}..."
            if ! curl -sf "${BASE_URL}/${file}" | diff -u "${file}" - > /tmp/diff_output 2>&1; then
              echo "::error::${file} has drifted from central config"
              cat /tmp/diff_output
              drifted=1
            else
              echo "  ✓ ${file} matches"
            fi
          done

          if [ "${drifted}" -eq 1 ]; then
            echo ""
            echo "Config files have drifted from DevSecNinja/.github/config-sync/files/"
            echo "Run the config-sync workflow or manually update the files."
            exit 1
          fi

          echo ""
          echo "All config files match the central repository."

      - name: Report linter results
        if: ${{ !cancelled() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: |-
          set -euo pipefail

          {
            echo "### Lint results"
            echo ""
            echo "| Step | Outcome |"
            echo "| ---- | ------- |"
            jq -r 'to_entries[] | "| `\(.key)` | \(.value.outcome) |"' <<<"${STEP_RESULTS}"
          } >>"${GITHUB_STEP_SUMMARY}"

          # A setup step (validation, checkout, mise install) has no id, so it
          # is missing from STEP_RESULTS; when one fails, every linter after it
          # is skipped and only the job status tells.
          if [ "${JOB_STATUS}" = "failure" ]; then
            echo "::error::A setup step failed before the linters could run; see the job log above."
            exit 1
          fi

          failed="$(jq -r 'to_entries[] | select(.value.outcome == "failure") | .key' <<<"${STEP_RESULTS}")"
          if [ -n "${failed}" ]; then
            while IFS= read -r step; do
              echo "::error::Lint step '${step}' failed; see its log above."
            done <<<"${failed}"
            exit 1
          fi

          echo "All enabled linters passed."
