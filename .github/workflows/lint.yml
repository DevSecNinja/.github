---
name: Reusable — Lint

on:
  workflow_call:
    inputs:
      mise-version:
        description: "mise version to install"
        required: true
        type: string
      golangci-lint-version:
        description: "golangci-lint version to install (required only when Go linting runs)"
        required: false
        type: string
        default: ""
      go-version-file:
        description: "Path to the Go version file"
        required: false
        type: string
        default: "go.mod"
      lint-config-dir:
        description: "Directory containing optional linter config files"
        required: false
        type: string
        default: ""
      lint-fail-on-error:
        description: "Fail the workflow when a linter fails"
        required: false
        type: boolean
        default: false
      lint-dprint:
        description: "Run dprint (Markdown formatting)"
        required: false
        type: boolean
        default: true
      lint-yamlfmt:
        description: "Run yamlfmt (YAML formatting)"
        required: false
        type: boolean
        default: true
      lint-yamllint:
        description: "Run yamllint (YAML linting)"
        required: false
        type: boolean
        default: true
      lint-actionlint:
        description: "Run actionlint (GitHub Actions linting)"
        required: false
        type: boolean
        default: true
      lint-gitleaks:
        description: "Run gitleaks (secret scanning)"
        required: false
        type: boolean
        default: true
      lint-go:
        description: "Run golangci-lint (Go linting)"
        required: false
        type: boolean
        default: true
      lint-shellcheck:
        description: "Run shellcheck (shell linting)"
        required: false
        type: boolean
        default: true
      lint-shellcheck-exclude:
        description: "Glob pattern for paths to exclude from shellcheck (passed to find -not -path)"
        required: false
        type: string
        default: ""
      lint-shfmt:
        description: "Run shfmt (shell formatting)"
        required: false
        type: boolean
        default: true
      lint-shfmt-exclude:
        description: "Glob pattern for paths to exclude from shfmt (passed to find -not -path)"
        required: false
        type: string
        default: ""
      lint-checkov:
        description: "Run checkov (IaC security) — uploads SARIF"
        required: false
        type: boolean
        default: true
      lint-trivy:
        description: "Run trivy fs (misconfig + secrets) — uploads SARIF"
        required: false
        type: boolean
        default: true
      lint-zizmor:
        description: "Run zizmor (Actions security) — uploads SARIF"
        required: false
        type: boolean
        default: true
      lint-ruff:
        description: "Run ruff (Python linting and formatting) when the repository has Python files — uploads SARIF"
        required: false
        type: boolean
        default: true
      lint-config-drift:
        description: "Check local config files match central DevSecNinja/.github repo"
        required: false
        type: boolean
        default: false
      lint-inline-scripts:
        description: >-
          Report inline scripts in the `run:` steps of workflows and composite actions: a `run:` may hold one line with
          one simple command (scripts/lint-inline-scripts.py). Warnings only, unless `lint-inline-scripts-blocking` is
          true.
        required: false
        type: boolean
        default: true
      lint-inline-scripts-blocking:
        description: "Report inline scripts as errors and fail the inline-scripts linter instead of warning"
        required: false
        type: boolean
        default: false
      upload-sarif:
        description: "Upload checkov/trivy/zizmor/ruff results to GitHub code scanning (requires GitHub Advanced Security).
          Set false for private repos without GHAS to gate on exit codes with console output instead."
        required: false
        type: boolean
        default: true
      lint-job-mode:
        description: >-
          How linters are scheduled. `parallel`: one job per enabled linter (fastest wall-clock time, but every job is
          billed at least one minute). `single`: all enabled linters run sequentially in one `all linters` job (far fewer
          billed minutes). `auto` (default): `single` for private repositories, `parallel` for public ones (and for
          events whose payload has no repository, such as `schedule`). Repos whose branch rulesets require the
          per-linter checks must require `all linters` instead before switching to `single`: skipped jobs report success.
        required: false
        type: string
        default: auto

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dprint:
    name: dprint
    if: ${{ inputs.lint-dprint && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Check formatting with dprint
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/dprint.sh"

  yamlfmt:
    name: yamlfmt
    if: ${{ inputs.lint-yamlfmt && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Check YAML formatting
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/yamlfmt.sh"

  yamllint:
    name: yamllint
    if: ${{ inputs.lint-yamllint && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run yamllint
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/yamllint.sh"

  actionlint:
    name: actionlint
    if: ${{ inputs.lint-actionlint && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run actionlint
        run: mise exec -- actionlint

  gitleaks:
    name: gitleaks
    if: ${{ inputs.lint-gitleaks && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Full-history findings of public repos go to code scanning.
      security-events: write
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run gitleaks
        id: gitleaks
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
          GH_TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/gitleaks.sh"

      - name: Report gitleaks findings
        if: ${{ !cancelled() }}
        env:
          SCAN_MODE: ${{ steps.gitleaks.outputs.mode }}
          FINDINGS_ARTIFACT: gitleaks-findings-${{ job.check_run_id }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/gitleaks-report.sh"

      - name: Upload gitleaks findings
        # The findings file exists only for PR and private history scans.
        if: ${{ !cancelled() && steps.gitleaks.outputs.mode != 'history-public' }}
        # Best effort: a failed upload must not change the lint gate.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Unique per job: a caller may run lint.yml more than once per run.
          name: gitleaks-findings-${{ job.check_run_id }}
          path: ${{ runner.temp }}/gitleaks-findings.json
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload gitleaks history to code scanning
        if: ${{ !cancelled() && inputs.upload-sarif && steps.gitleaks.outputs.sarif == 'true' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-history.sarif
          category: gitleaks/history
  go:
    name: go
    if: ${{ inputs.lint-go && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Go version file
        id: go-version-file
        env:
          GO_VERSION_FILE: ${{ inputs.go-version-file }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/go-version-file.sh"

      - name: Validate golangci-lint version
        if: ${{ steps.go-version-file.outputs.exists == 'true' && inputs.golangci-lint-version == '' }}
        env:
          GO_VERSION_FILE: ${{ inputs.go-version-file }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/golangci-lint-version.sh"

      - name: Setup Go
        if: ${{ steps.go-version-file.outputs.exists == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Run golangci-lint
        if: ${{ steps.go-version-file.outputs.exists == 'true' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}

  shellcheck:
    name: shellcheck
    if: ${{ inputs.lint-shellcheck && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run shellcheck
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
          EXCLUDE_PATTERN: ${{ inputs.lint-shellcheck-exclude }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/shellcheck.sh"

  shfmt:
    name: shfmt
    if: ${{ inputs.lint-shfmt && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run shfmt
        env:
          EXCLUDE_PATTERN: ${{ inputs.lint-shfmt-exclude }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/shfmt.sh"

  checkov:
    name: checkov
    if: ${{ inputs.lint-checkov && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run checkov
        env:
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/checkov.sh"

      - name: Filter skipped checks from SARIF
        if: ${{ always() && inputs.upload-sarif }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/checkov-sarif-filter.sh"

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ always() && inputs.upload-sarif }}
        with:
          sarif_file: ${{ runner.temp }}/results_sarif.sarif
          category: checkov

  trivy:
    name: trivy
    if: ${{ inputs.lint-trivy && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run trivy
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/trivy.sh"

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ inputs.upload-sarif }}
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy

  zizmor:
    name: zizmor
    if: ${{ inputs.lint-zizmor && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run zizmor
        env:
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/zizmor.sh"

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ always() && inputs.upload-sarif }}
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor

  ruff:
    name: ruff
    if: ${{ inputs.lint-ruff && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find Python files
        # Repositories without Python skip the mise install and ruff.
        id: python-files
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/detect-language.sh" python

      - name: Install mise
        if: ${{ steps.python-files.outputs.found == 'true' }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Run ruff
        id: ruff
        if: ${{ steps.python-files.outputs.found == 'true' }}
        env:
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/ruff.sh"

      - name: Upload SARIF report
        if: ${{ !cancelled() && steps.ruff.outputs.sarif == 'true' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/ruff.sarif
          category: ruff

  config-drift:
    name: config drift
    if: ${{ inputs.lint-config-drift && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check config drift against central repo
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/config-drift.sh"

  inline-scripts:
    name: inline scripts
    if: ${{ inputs.lint-inline-scripts && (inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for inline scripts
        env:
          LINT_INLINE_SCRIPTS_BLOCKING: ${{ inputs.lint-inline-scripts-blocking }}
        # The runner's system Python ships PyYAML; a caller's mise Python may not.
        run: /usr/bin/python3 "${RUNNER_TEMP}/devsecninja-lint/scripts/lint-inline-scripts.py"

  all-linters:
    # Single-job mode (`lint-job-mode: single`, or `auto` on a private
    # repository). Every enabled linter runs as a step of this one job, so a
    # lint run is billed as one job instead of a rounded-up minute per linter
    # job, and mise and its tools are installed once instead of ten times.
    # Each linter step runs the same script from scripts/lint/ as its
    # per-linter job above; tests/lint-job-modes-contract.sh fails when the
    # two `run:` lines drift.
    # Linter steps use continue-on-error so one failure does not hide the
    # others; the final step reports every failure and fails the job.
    name: all linters
    if: ${{ !(inputs.lint-job-mode == 'parallel' || (inputs.lint-job-mode == 'auto' && !github.event.repository.private))
      }}
    continue-on-error: ${{ ! inputs.lint-fail-on-error }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout lint scripts
        # The linter scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-lint
          sparse-checkout: |-
            scripts/lint/
            scripts/lint-inline-scripts.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move lint scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and the
        # code checkout doesn't delete them.
        run: mv .devsecninja-lint "${RUNNER_TEMP}/devsecninja-lint"

      - name: Validate lint-job-mode
        env:
          LINT_JOB_MODE: ${{ inputs.lint-job-mode }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/lint-job-mode.sh"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the full git history; the other linters need only HEAD.
          fetch-depth: ${{ !inputs.lint-gitleaks && 1 || 0 }}
          persist-credentials: false

      - name: Find Python files
        # Repositories without Python skip ruff (and its mise install).
        id: python-files
        if: ${{ inputs.lint-ruff }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/detect-language.sh" python

      - name: Install mise
        if: >-
          ${{ inputs.lint-dprint || inputs.lint-yamlfmt || inputs.lint-yamllint || inputs.lint-actionlint || inputs.lint-gitleaks
          || inputs.lint-shellcheck || inputs.lint-shfmt || inputs.lint-checkov || inputs.lint-trivy || inputs.lint-zizmor
          || steps.python-files.outputs.found == 'true' }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Check formatting with dprint
        id: dprint
        if: ${{ inputs.lint-dprint }}
        continue-on-error: true
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/dprint.sh"

      - name: Check YAML formatting
        id: yamlfmt
        if: ${{ inputs.lint-yamlfmt }}
        continue-on-error: true
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/yamlfmt.sh"

      - name: Run yamllint
        id: yamllint
        if: ${{ inputs.lint-yamllint }}
        continue-on-error: true
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/yamllint.sh"

      - name: Run actionlint
        id: actionlint
        if: ${{ inputs.lint-actionlint }}
        continue-on-error: true
        run: mise exec -- actionlint

      - name: Run gitleaks
        id: gitleaks
        if: ${{ inputs.lint-gitleaks }}
        continue-on-error: true
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
          GH_TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/gitleaks.sh"

      - name: Report gitleaks findings
        if: ${{ !cancelled() && inputs.lint-gitleaks }}
        env:
          SCAN_MODE: ${{ steps.gitleaks.outputs.mode }}
          FINDINGS_ARTIFACT: gitleaks-findings-${{ job.check_run_id }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/gitleaks-report.sh"

      - name: Upload gitleaks findings
        # The findings file exists only for PR and private history scans.
        if: ${{ !cancelled() && steps.gitleaks.outputs.mode != 'history-public' }}
        # Best effort: a failed upload must not change the lint gate.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Unique per job: a caller may run lint.yml more than once per run.
          name: gitleaks-findings-${{ job.check_run_id }}
          path: ${{ runner.temp }}/gitleaks-findings.json
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload gitleaks history to code scanning
        id: gitleaks-sarif
        if: ${{ !cancelled() && inputs.upload-sarif && steps.gitleaks.outputs.sarif == 'true' }}
        # Let the remaining linters run; the last step reports the failure.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-history.sarif
          category: gitleaks/history
      - name: Check for Go version file
        id: go-version-file
        if: ${{ inputs.lint-go }}
        env:
          GO_VERSION_FILE: ${{ inputs.go-version-file }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/go-version-file.sh"

      - name: Validate golangci-lint version
        id: golangci-lint-version
        if: ${{ steps.go-version-file.outputs.exists == 'true' && inputs.golangci-lint-version == '' }}
        continue-on-error: true
        env:
          GO_VERSION_FILE: ${{ inputs.go-version-file }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/golangci-lint-version.sh"

      - name: Setup Go
        id: setup-go
        if: ${{ steps.go-version-file.outputs.exists == 'true' && inputs.golangci-lint-version != '' }}
        continue-on-error: true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Run golangci-lint
        id: go
        if: ${{ steps.setup-go.outcome == 'success' }}
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}

      - name: Run shellcheck
        id: shellcheck
        if: ${{ inputs.lint-shellcheck }}
        continue-on-error: true
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
          EXCLUDE_PATTERN: ${{ inputs.lint-shellcheck-exclude }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/shellcheck.sh"

      - name: Run shfmt
        id: shfmt
        if: ${{ inputs.lint-shfmt }}
        continue-on-error: true
        env:
          EXCLUDE_PATTERN: ${{ inputs.lint-shfmt-exclude }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/shfmt.sh"

      - name: Run checkov
        id: checkov
        if: ${{ inputs.lint-checkov }}
        continue-on-error: true
        env:
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/checkov.sh"

      - name: Filter skipped checks from SARIF
        id: checkov-sarif-filter
        if: ${{ inputs.lint-checkov && inputs.upload-sarif }}
        continue-on-error: true
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/checkov-sarif-filter.sh"

      - name: Upload checkov SARIF report
        id: checkov-sarif
        if: ${{ inputs.lint-checkov && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/results_sarif.sarif
          category: checkov

      - name: Run trivy
        id: trivy
        if: ${{ inputs.lint-trivy }}
        continue-on-error: true
        env:
          CONFIG_DIR: ${{ inputs.lint-config-dir }}
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/trivy.sh"

      - name: Upload trivy SARIF report
        id: trivy-sarif
        if: ${{ inputs.lint-trivy && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy

      - name: Run zizmor
        id: zizmor
        if: ${{ inputs.lint-zizmor }}
        continue-on-error: true
        env:
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/zizmor.sh"

      - name: Upload zizmor SARIF report
        id: zizmor-sarif
        if: ${{ inputs.lint-zizmor && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor

      - name: Run ruff
        id: ruff
        if: ${{ steps.python-files.outputs.found == 'true' }}
        continue-on-error: true
        env:
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/ruff.sh"

      - name: Upload ruff SARIF report
        id: ruff-sarif
        if: ${{ !cancelled() && steps.ruff.outputs.sarif == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/ruff.sarif
          category: ruff

      - name: Check config drift against central repo
        id: config-drift
        if: ${{ inputs.lint-config-drift }}
        continue-on-error: true
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/config-drift.sh"

      - name: Check for inline scripts
        id: inline-scripts
        if: ${{ inputs.lint-inline-scripts }}
        continue-on-error: true
        env:
          LINT_INLINE_SCRIPTS_BLOCKING: ${{ inputs.lint-inline-scripts-blocking }}
        # The runner's system Python ships PyYAML; a caller's mise Python may not.
        run: /usr/bin/python3 "${RUNNER_TEMP}/devsecninja-lint/scripts/lint-inline-scripts.py"

      - name: Report linter results
        if: ${{ !cancelled() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: bash "${RUNNER_TEMP}/devsecninja-lint/scripts/lint/report-results.sh"
