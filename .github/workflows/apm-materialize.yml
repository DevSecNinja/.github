---
name: Reusable — APM Materialize

# Materializes a repo's installed APM (Agent Package Manager) primitives after an
# apm.yml change lands on the default branch.
#
# Renovate maintains the `owner/repo#vX.Y.Z` tag pins in apm.yml (via the custom
# manager in .renovate/customManagers.json5), but it only edits the manifest
# text — apm.lock.yaml and the deployed primitives under the harness dirs stay
# stale. This reusable runs `apm install` to refresh them.
#
# IMPORTANT — call this POST-MERGE on the default branch, never on the PR:
# Pushing the materialized files onto a Renovate PR branch corrupts Renovate's
# branch ownership (it stops rebasing/automerging and refuses to autoclose
# superseded PRs — "branch already modified"). So the caller triggers on
# `push` to the default branch (paths: apm.yml), and this opens a SEPARATE
# `chore: materialize` PR via the open-pr composite. Renovate's bump PR stays
# pristine and merges/automerges normally.
#
# Authentication: pass `app-id` + `app-private-key` so the materialize PR is
# opened by a GitHub App identity and required CI fires on it (a PR opened with
# GITHUB_TOKEN does not retrigger workflows). Same pattern as release-please.
#
# See also: DevSecNinja/.github docs/apm-sync-onboarding.md

on:
  workflow_call:
    inputs:
      apm-cli-version:
        description: |
          Version of the `apm` CLI (PyPI `apm-cli`) to install. Required — the
          caller owns the version (see ADR 0001). e.g. "0.21.0".
        required: true
        type: string
      base-branch:
        description: "Branch the materialize PR targets (defaults to main)."
        required: false
        type: string
        default: main
      pr-branch:
        description: "Working branch the materialize PR is pushed to."
        required: false
        type: string
        default: chore/apm-materialize
      app-id:
        description: "GitHub App ID used to open the materialize PR so required CI fires on it."
        required: true
        type: string
    secrets:
      app-private-key:
        description: "PEM contents of the GitHub App private key, paired with app-id."
        required: true
    outputs:
      changed:
        description: "`true` when materialization changed files and a PR was opened/updated."
        value: ${{ jobs.materialize.outputs.changed }}
      pr-url:
        description: "URL of the materialize PR that was opened or reused, if any."
        value: ${{ jobs.materialize.outputs.pr-url }}

permissions:
  contents: read

jobs:
  materialize:
    name: Materialize APM primitives
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.open-pr.outputs.changed }}
      pr-url: ${{ steps.open-pr.outputs.pr-url }}
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@7f2abdd838a855dba31a2b2de6358529fdcef09d # v1.8.0

      - name: Generate App token
        id: app-token
        # renovate: datasource=github-releases depName=actions/create-github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout default branch
        # zizmor: ignore[artipacked]
        # Persisted credentials are required: the open-pr step below pushes the
        # materialize branch using the token checkout writes into the remote URL.
        # This job runs no untrusted code — it installs the pinned apm CLI and
        # runs `apm install` over the repo's own committed apm.yml.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.base-branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Check for apm.yml
        id: precheck
        run: |
          if [ ! -f apm.yml ]; then
            echo "::notice::No apm.yml in this repo; nothing to materialize."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install apm CLI
        if: steps.precheck.outputs.skip != 'true'
        env:
          APM_CLI_VERSION: ${{ inputs.apm-cli-version }}
        run: |
          set -euo pipefail
          # ubuntu-24.04 ships python3 + pip; install the pinned apm-cli for this user.
          python3 -m pip install --user "apm-cli==${APM_CLI_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Materialize primitives (apm install)
        if: steps.precheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          apm --version
          apm install

      - name: Open materialize PR
        id: open-pr
        if: steps.precheck.outputs.skip != 'true'
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/open-pr@7f2abdd838a855dba31a2b2de6358529fdcef09d # v1.8.0
        with:
          branch: ${{ inputs.pr-branch }}
          base: ${{ inputs.base-branch }}
          title: "chore: materialize APM primitives"
          commit-message: "chore: materialize APM primitives from apm.yml"
          labels: apm-sync
          github-token: ${{ steps.app-token.outputs.token }}
          if-no-changes: skip
          body: |-
            Automated PR — materializes the APM primitives for the current
            `apm.yml`. Runs `apm install` to refresh `apm.lock.yaml` and redeploy
            the primitives into the harness directories after an `apm.yml` change
            landed on the default branch (e.g. a Renovate tag bump).

            Triggered by `${{ github.workflow }}` at commit `${{ github.sha }}`.
