---
name: Release Please

# Drives semver bumping via the central reusable workflow. On every push
# to main this opens (or updates) a `chore(main): release vX.Y.Z` PR
# with the next version's CHANGELOG bump (computed from Conventional
# Commits).
#
# Unlike consumer repos, `.github` itself does NOT have a tag-triggered
# release publishing workflow — release-please creates the GitHub
# Release directly (`skip-github-release: false`).
#
# Branch protection is fully respected: every release commit lands via
# PR through normal CI. GitHub App credentials (the DevSecNinja
# Automation App, docs/automation-app.md) are mandatory; the Actions
# "create and approve pull requests" setting is not needed. No bypass
# actor required.
#
# Onboarding guide:
#   docs/release-please-onboarding.md

on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    # Self-reference pinned to a released central workflow.
    uses: DevSecNinja/.github/.github/workflows/release-please.yml@a9e3a11178ccd6e76115d3d7b31616631305991f # v3.4.0
    permissions:
      contents: write
      pull-requests: write
    # Legacy names of the same DevSecNinja Automation App, passed explicitly
    # (explicit values win over AUTOMATION_APP_*). Replace with
    # `AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}`
    # once this repository is provisioned; see docs/automation-app.md.
    with:
      app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
