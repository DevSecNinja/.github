---
name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  renovate-presets:
    name: Renovate preset checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.9.15"

      - name: Verify custom-manager governance coverage
        run: mise run test
