---
name: Reusable — TODO to Issue

on:
  workflow_call:
    inputs:
      auto_assign:
        description: "Automatically assign new issues to the user who triggered the action"
        required: false
        type: boolean
        default: false
      label:
        description: "Label to apply to issues created by this action"
        required: false
        type: string
        default: "todo-to-issue"

permissions:
  contents: read
  issues: write

jobs:
  run:
    name: TODO to Issue
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: TODO to Issue
        uses: alstr/todo-to-issue-action@64aca8fda7023259aada83ba44ad988c4c443657 # v5.1.14
        with:
          AUTO_ASSIGN: "${{ inputs.auto_assign }}"
          IDENTIFIERS: >-
            ${{ inputs.label != '' && format('[{{"name": "TODO", "labels": ["{0}"]}}]', inputs.label) || '[{"name": "TODO",
            "labels": []}]' }}
