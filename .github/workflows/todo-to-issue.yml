---
name: Reusable — TODO to Issue

on:
  workflow_call:
    inputs:
      auto_assign:
        description: "Automatically assign new issues to the user who triggered the action"
        required: false
        type: boolean
        default: false
      label:
        description: "Label to apply to issues created by this action"
        required: false
        type: string
        default: "todo-to-issue"

permissions:
  contents: read
  issues: write

jobs:
  run:
    name: TODO to Issue
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: TODO to Issue
        uses: alstr/todo-to-issue-action@37bb7b56e58569ef273b60678048030a7f0c261a # v5.1.15
        with:
          AUTO_ASSIGN: "${{ inputs.auto_assign }}"
          IDENTIFIERS: >-
            ${{ inputs.label != '' && format('[{{"name": "TODO", "labels": ["{0}"]}}]', inputs.label) || '[{"name": "TODO",
            "labels": []}]' }}
