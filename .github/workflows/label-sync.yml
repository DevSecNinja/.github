---
name: Reusable — Label Sync

# Syncs GitHub labels from one or more YAML config files. By default it
# merges the org-wide base label set (`.github/labels-base.yaml`, kept in
# sync by config-sync) with the repository's own `.github/labels.yaml`.
# Either file is optional: whichever files exist are merged, and with
# `delete-other-labels: true` any label not present in the union is removed.

on:
  workflow_call:
    inputs:
      labels-file:
        description: "Path to the repository-specific labels YAML config file"
        required: false
        type: string
        default: ".github/labels.yaml"
      base-labels-file:
        description: "Path to the shared base labels YAML config file (synced from DevSecNinja/.github)"
        required: false
        type: string
        default: ".github/labels-base.yaml"
      delete-other-labels:
        description: "Delete labels not present in the config file(s)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  label-sync:
    name: Label Sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout label-sync scripts
        # The label-sync scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-label-sync
          sparse-checkout: |-
            scripts/label-sync/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move label-sync scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and a
        # code checkout doesn't delete them.
        run: mv .devsecninja-label-sync "${RUNNER_TEMP}/devsecninja-label-sync"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            ${{ inputs.base-labels-file }}
            ${{ inputs.labels-file }}

      - name: Resolve label config files
        id: resolve
        env:
          BASE_LABELS_FILE: ${{ inputs.base-labels-file }}
          LABELS_FILE: ${{ inputs.labels-file }}
        run: bash "${RUNNER_TEMP}/devsecninja-label-sync/scripts/label-sync/resolve-config-files.sh"

      - name: Sync Labels
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: ${{ steps.resolve.outputs.config-files }}
          delete-other-labels: ${{ inputs.delete-other-labels }}
          token: ${{ secrets.GITHUB_TOKEN }}
