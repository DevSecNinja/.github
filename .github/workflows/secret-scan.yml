---
name: Reusable — Secret scan

# Runs only the gitleaks job of the reusable Lint workflow, with every other
# linter switched off here, so callers don't keep their own list of linters to
# disable and a linter added to lint.yml later never starts running in them.
# tests/secret-scan-wrapper.py fails when lint.yml gains a linter input this
# workflow doesn't turn off. gitleaks behaves exactly as in lint.yml (see
# docs/architecture.md): pull requests scan their own commits, other events
# scan the full history, public repositories send history findings to code
# scanning (category `gitleaks/history`) and private ones to the job summary.
on:
  workflow_call:
    inputs:
      mise-version:
        description: "mise version to install"
        required: true
        type: string
      lint-config-dir:
        description: "Directory containing an optional .gitleaks.toml"
        required: false
        type: string
        default: ""
      lint-fail-on-error:
        description: "Fail when the scan or the code scanning upload fails (history findings only report)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gitleaks:
    # `$/` (self-repository syntax) resolves to this workflow's own repository
    # at the commit that is running, so a caller pinning secret-scan.yml@<sha>
    # gets lint.yml from that same commit, and this repository's caller tests
    # local changes to both. `./` is workspace-relative, so it isn't
    # guaranteed to resolve to this repository when another repository calls
    # this workflow, and an `owner/repo/...@<sha>` pin would lag behind
    # lint.yml. actionlint doesn't know `$/` yet: .github/actionlint.yaml
    # ignores that one error.
    uses: $/.github/workflows/lint.yml
    permissions:
      contents: read
      # Full-history findings of public repositories go to code scanning.
      security-events: write
    with:
      mise-version: ${{ inputs.mise-version }}
      lint-config-dir: ${{ inputs.lint-config-dir }}
      lint-fail-on-error: ${{ inputs.lint-fail-on-error }}
      lint-gitleaks: true
      lint-dprint: false
      lint-yamlfmt: false
      lint-yamllint: false
      lint-actionlint: false
      lint-go: false
      lint-shellcheck: false
      lint-shfmt: false
      lint-checkov: false
      lint-trivy: false
      lint-zizmor: false
      lint-config-drift: false
