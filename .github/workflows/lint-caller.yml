---
name: Lint

# Runs on pull requests and on push to main. This repo uploads SARIF to code
# scanning, which needs a default-branch analysis: without a main run, alerts
# fixed on main never close and PR alerts lack a baseline. See
# docs/workflow-trigger-conventions.md and workflow-templates/lint.yml.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: # checkov:skip=CKV_GHA_7: Validation workflow only -- no artifacts produced.

# A newer push to a PR cancels its running run; a running main run is never
# cancelled, a queued one is superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    # Local reference validates reusable workflow changes in this repository.
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      security-events: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.11.8"
      # renovate: datasource=github-releases depName=golangci/golangci-lint
      # golangci-lint-version: "v2.12.2"
      # renovate: datasource=nuget depName=PSScriptAnalyzer registryUrl=https://www.powershellgallery.com/api/v2/
      psscriptanalyzer-version: "1.25.0"
      lint-config-dir: config-sync/files
      # config-sync/templates holds a root biome.json for other repositories,
      # which Biome rejects as a second root config in this one.
      lint-biome-exclude: config-sync/templates/*
      # This repository has no inline scripts (#537), so it keeps it that way.
      lint-inline-scripts-blocking: true

  lint-single-job:
    # Exercises `lint-job-mode: single` — the default for private callers —
    # on every PR here (this repository is public, so it is free). Results
    # are gated on exit codes (upload-sarif: false) so the SARIF categories of
    # the job above are not uploaded twice. zizmor is left to the job above:
    # in exit-code mode it fails on the low-severity `self-repository` hints
    # about the local `./` references in this repo's own caller workflows.
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      security-events: write
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.11.8"
      # renovate: datasource=nuget depName=PSScriptAnalyzer registryUrl=https://www.powershellgallery.com/api/v2/
      psscriptanalyzer-version: "1.25.0"
      lint-config-dir: config-sync/files
      lint-biome-exclude: config-sync/templates/* # See the job above.
      lint-job-mode: single
      lint-inline-scripts-blocking: true
      upload-sarif: false
      lint-zizmor: false
