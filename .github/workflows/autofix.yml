---
name: Reusable — Auto-fix formatting

on:
  workflow_call:
    inputs:
      mise-version:
        description: "mise version to install"
        required: true
        type: string
      autofix-config-dir:
        description: "Directory containing optional formatter config files"
        required: false
        type: string
        default: ""
      autofix-dprint:
        description: "Run dprint fmt (Markdown auto-format)"
        required: false
        type: boolean
        default: true
      autofix-yamlfmt:
        description: "Run yamlfmt (YAML auto-format)"
        required: false
        type: boolean
        default: true
      autofix-shfmt:
        description: "Run shfmt --write (shell auto-format)"
        required: false
        type: boolean
        default: true
      commit-message:
        description: "Commit message for auto-fix changes"
        required: false
        type: string
        default: "style: auto-fix formatting"

permissions:
  contents: write

jobs:
  autofix:
    name: auto-fix formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        # zizmor: ignore[artipacked]
        # Persisted credentials are required: the final step commits the
        # auto-formatted changes and `git push`es them back to the branch using
        # the token checkout writes into the remote URL. Setting
        # `persist-credentials: false` here breaks that push without offering
        # meaningful isolation — this job runs no untrusted code (it only runs
        # the pinned formatters dprint/yamlfmt/shfmt over the repo's own files).
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Auto-fix with dprint
        if: ${{ inputs.autofix-dprint }}
        env:
          CONFIG_DIR: ${{ inputs.autofix-config-dir }}
        run: |-
          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/dprint.json" ]; then
            mise exec -- dprint fmt \
              --config "${CONFIG_DIR}/dprint.json" \
              --config-discovery=false
          else
            mise exec -- dprint fmt
          fi

      - name: Auto-fix with yamlfmt
        if: ${{ inputs.autofix-yamlfmt }}
        env:
          CONFIG_DIR: ${{ inputs.autofix-config-dir }}
        run: |-
          if [ -n "${CONFIG_DIR}" ] && [ -f "${CONFIG_DIR}/.yamlfmt.yaml" ]; then
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 |
              xargs -0 mise exec -- yamlfmt -conf "${CONFIG_DIR}/.yamlfmt.yaml"
          else
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 |
              xargs -0 mise exec -- yamlfmt
          fi

      - name: Auto-fix with shfmt
        if: ${{ inputs.autofix-shfmt }}
        run: find . -name '*.sh' -print0 | xargs -0 mise exec -- shfmt --write

      - name: Commit and push auto-fix changes
        env:
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes to commit."
          else
            git add .
            git commit -m "${COMMIT_MESSAGE}"
            git push
          fi
