---
name: Reusable — Auto-fix formatting

on:
  workflow_call:
    inputs:
      mise-version:
        description: "mise version to install"
        required: true
        type: string
      autofix-config-dir:
        description: "Directory containing optional formatter config files"
        required: false
        type: string
        default: ""
      autofix-dprint:
        description: "Run dprint fmt (Markdown auto-format)"
        required: false
        type: boolean
        default: true
      autofix-yamlfmt:
        description: "Run yamlfmt (YAML auto-format)"
        required: false
        type: boolean
        default: true
      autofix-shfmt:
        description: "Run shfmt --write (shell auto-format)"
        required: false
        type: boolean
        default: true
      commit-message:
        description: "Commit message for auto-fix changes"
        required: false
        type: string
        default: "style: auto-fix formatting"

permissions:
  contents: write

jobs:
  autofix:
    name: auto-fix formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout autofix scripts
        # The autofix scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-autofix
          sparse-checkout: |-
            scripts/autofix/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Move autofix scripts out of the workspace
        # Outside the workspace the formatters don't touch them and the commit
        # doesn't pick them up, and a code checkout doesn't delete them.
        run: mv .devsecninja-autofix "${RUNNER_TEMP}/devsecninja-autofix"

      - name: Checkout code
        # zizmor: ignore[artipacked]
        # Persisted credentials are required: the final step commits the
        # auto-formatted changes and `git push`es them back to the branch using
        # the token checkout writes into the remote URL. Setting
        # `persist-credentials: false` here breaks that push without offering
        # meaningful isolation — this job runs no untrusted code (it only runs
        # the pinned formatters dprint/yamlfmt/shfmt over the repo's own files).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          version: ${{ inputs.mise-version }}

      - name: Auto-fix with dprint
        if: ${{ inputs.autofix-dprint }}
        env:
          CONFIG_DIR: ${{ inputs.autofix-config-dir }}
        run: bash "${RUNNER_TEMP}/devsecninja-autofix/scripts/autofix/dprint.sh"

      - name: Auto-fix with yamlfmt
        if: ${{ inputs.autofix-yamlfmt }}
        env:
          CONFIG_DIR: ${{ inputs.autofix-config-dir }}
        run: bash "${RUNNER_TEMP}/devsecninja-autofix/scripts/autofix/yamlfmt.sh"

      - name: Auto-fix with shfmt
        if: ${{ inputs.autofix-shfmt }}
        run: bash "${RUNNER_TEMP}/devsecninja-autofix/scripts/autofix/shfmt.sh"

      - name: Commit and push auto-fix changes
        env:
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
        run: bash "${RUNNER_TEMP}/devsecninja-autofix/scripts/autofix/commit-and-push.sh"
