---
name: Reusable — Pages
on:
  workflow_call:
    inputs:
      node-version:
        description: >-
          Node.js version for setup-node. Required when install-command, test-setup-command, test-command, or build-command
          is set; leave empty for no-build static sites.
        required: false
        type: string
        default: ""
      node-cache:
        description: "Package manager cache for setup-node; use empty to disable"
        required: false
        type: string
        default: ""
      go-version:
        description: >-
          Go version to install before the build. Required for Hugo Modules and any other build step that shells out to Go;
          leave empty to skip Go setup. Without it the build silently uses whatever Go the runner image happens to ship.
        required: false
        type: string
        default: ""
      go-version-file:
        description: >-
          File to read the Go version from, used only when go-version is empty.
        required: false
        type: string
        default: ""
      wrangler-version:
        description: >-
          Wrangler version for Cloudflare Pages deploys. Required when cloudflare-preview, cloudflare-production, or cloudflare-acceptance
          is enabled.
        required: false
        type: string
        default: ""
      production-branch:
        description: "Branch that deploys to production"
        required: false
        type: string
        default: "main"
      github-pages:
        description: "Deploy production to GitHub Pages"
        required: false
        type: boolean
        default: true
      artifact-path:
        description: "Path uploaded to GitHub Pages or Cloudflare Pages"
        required: true
        type: string
      artifact-name:
        description: >-
          Name of an artifact, uploaded by an earlier job in the calling workflow, that already contains the built site. When
          set, the deploy jobs download it into `artifact-path` instead of running `install-command` / `build-command`.

          Use this when the build needs credentials or tooling this workflow does not provide: the build then runs in the
          caller's own job, where the caller controls the environment, and this workflow only deploys. The calling job must
          `needs:` the job that uploads the artifact.
        required: false
        type: string
        default: ""
      install-command:
        description: "Dependency installation command"
        required: false
        type: string
        default: "npm ci"
      test-command:
        description: "Shell commands that validate the site before deployment"
        required: false
        type: string
        default: ""
      test-setup-command:
        description: "Optional setup command after install and before tests"
        required: false
        type: string
        default: ""
      test-report-paths:
        description: >-
          JUnit XML files that test-command writes (glob patterns, one per line). When set, the test job shows them on the
          run page with actions/test-report from the same DevSecNinja/.github commit. Default: empty (off).
        required: false
        type: string
        default: ""
      test-report-title:
        description: "Heading of the test results summary when test-report-paths is set"
        required: false
        type: string
        default: "Tests"
      build-command:
        description: "Optional build command before uploading artifacts"
        required: false
        type: string
        default: ""
      build-github-token:
        description: >-
          Run `build-command` once in the read-only (`contents: read`) test job with `GITHUB_TOKEN` in its environment, and
          have the
          deploy jobs download the result instead of building. Use this when the build calls the GitHub API (avoids unauthenticated
          rate limits) without giving the build step the deploy jobs' write permissions. The build then runs with the test
          job's
          package-manager cache enabled.
        required: false
        type: boolean
        default: false
      build-artifact-name:
        description: >-
          Name of the artifact `build-github-token` uploads and the deploy jobs download. Artifact names must be unique within
          a
          workflow run, so give each call of this workflow its own name when more than one call sets `build-github-token`.
        required: false
        type: string
        default: pages-build
      pre-deploy-command:
        description: "Optional command before the GitHub Pages upload"
        required: false
        type: string
        default: ""
      pre-preview-command:
        description: "Optional command before the Cloudflare preview deploy"
        required: false
        type: string
        default: ""
      update-sitemap-lastmod:
        description: "Update sitemap.xml lastmod dates during production deploy"
        required: false
        type: boolean
        default: false
      sitemap-path:
        description: "Sitemap path used when update-sitemap-lastmod is true"
        required: false
        type: string
        default: "sitemap.xml"
      cloudflare-preview:
        description: "Deploy pull request previews to Cloudflare Pages"
        required: false
        type: boolean
        default: true
      cloudflare-production:
        description: "Deploy production to Cloudflare Pages"
        required: false
        type: boolean
        default: false
      cloudflare-production-on-release:
        description: >-
          Deploy Cloudflare production only on GitHub release events instead of on every production-branch commit. The caller
          must also trigger the workflow on the release event.
        required: false
        type: boolean
        default: false
      cloudflare-custom-domain:
        description: >-
          Optional lowercase FQDN to register on the production Cloudflare Pages project after a successful production deploy.
        required: false
        type: string
        default: ""
      cloudflare-manage-dns:
        description: >-
          Create the custom-domain CNAME when absent. Existing conflicting records are never changed. Requires cloudflare-dns-zone.
        required: false
        type: boolean
        default: false
      cloudflare-dns-zone:
        description: >-
          Lowercase zone apex containing cloudflare-custom-domain, for example example.com. Required when cloudflare-manage-dns
          is true.
        required: false
        type: string
        default: ""
      cloudflare-dns-proxied:
        description: "Proxy a workflow-managed custom-domain CNAME through Cloudflare"
        required: false
        type: boolean
        default: true
      cloudflare-acceptance:
        description: "Deploy an acceptance build to Cloudflare Pages on production-branch commits"
        required: false
        type: boolean
        default: false
      cloudflare-acceptance-branch:
        description: "Cloudflare branch name used for acceptance deploys (gives a stable acceptance URL)"
        required: false
        type: string
        default: "acceptance"
      cloudflare-project-name:
        description: "Cloudflare Pages project name; defaults to the repo name"
        required: false
        type: string
        default: ""
      cloudflare-production-branch:
        description: "Production branch configured on the Cloudflare project"
        required: false
        type: string
        default: "main"
      preview-comment-marker:
        description: "Marker used to update the Cloudflare preview PR comment"
        required: false
        type: string
        default: "<!-- cf-preview-comment -->"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
    outputs:
      cloudflare-custom-domain-status:
        description: >-
          Cloudflare Pages custom-domain status after registration, when enabled.
        value: ${{ jobs.register-cloudflare-domain.outputs.status }}
      cloudflare-custom-domain-dns-target:
        description: >-
          Resolved pages.dev CNAME target for the production Pages project.
        value: ${{ jobs.register-cloudflare-domain.outputs.dns-target }}
      cloudflare-custom-domain-dns-action:
        description: >-
          DNS result when custom-domain registration runs: unmanaged, created, or no-op.
        value: ${{ jobs.register-cloudflare-domain.outputs.dns-action }}
permissions:
  contents: read
jobs:
  validate-inputs:
    name: Validate inputs
    # Every other job needs this one (directly or transitively), so skipping it
    # skips the whole run without billing a single minute. On pull_request:
    # - `edited` also fires for title/body edits, which Renovate makes on most
    #   of its runs; only a base-branch change can affect the outcome.
    # - On `closed`, only close-preview has work to do, and only for
    #   same-repository, non-bot PRs with previews enabled.
    if: >-
      github.event_name != 'pull_request' || ((github.event.action != 'edited' || github.event.changes.base) && (github.event.action
      != 'closed' || (inputs.cloudflare-preview && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login
      != 'renovate[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout pages scripts
        # The pages scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-pages
          sparse-checkout: |-
            scripts/pages/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Move pages scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and a
        # code checkout doesn't delete them.
        run: mv .devsecninja-pages "${RUNNER_TEMP}/devsecninja-pages"
      - name: Validate tool versions
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          WRANGLER_VERSION: ${{ inputs.wrangler-version }}
          INSTALL_COMMAND: ${{ inputs.install-command }}
          TEST_SETUP_COMMAND: ${{ inputs.test-setup-command }}
          TEST_COMMAND: ${{ inputs.test-command }}
          TEST_REPORT_PATHS: ${{ inputs.test-report-paths }}
          BUILD_COMMAND: ${{ inputs.build-command }}
          BUILD_GITHUB_TOKEN: ${{ inputs.build-github-token }}
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          CLOUDFLARE_PREVIEW: ${{ inputs.cloudflare-preview }}
          CLOUDFLARE_PRODUCTION: ${{ inputs.cloudflare-production }}
          CLOUDFLARE_ACCEPTANCE: ${{ inputs.cloudflare-acceptance }}
          CLOUDFLARE_CUSTOM_DOMAIN: ${{ inputs.cloudflare-custom-domain }}
          CLOUDFLARE_MANAGE_DNS: ${{ inputs.cloudflare-manage-dns }}
          CLOUDFLARE_DNS_ZONE: ${{ inputs.cloudflare-dns-zone }}
          CONFIGURED_PROJECT_NAME: ${{ inputs.cloudflare-project-name }}
        run: bash "${RUNNER_TEMP}/devsecninja-pages/scripts/pages/validate-inputs.sh"
  detect-cloudflare:
    name: Detect Cloudflare configuration
    needs:
      - validate-inputs
    # On pull_request this job only feeds the preview jobs, which never run for
    # Renovate/Dependabot PRs, so skip it for those PRs. Never skipped on push,
    # release, or workflow_dispatch: production deploys depend on it.
    if: >-
      github.event_name != 'pull_request' || github.event.action == 'closed' || (github.event.pull_request.user.login != 'renovate[bot]'
      && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
      project-name: ${{ steps.detect.outputs.project-name }}
      deploy-production: ${{ steps.detect.outputs.deploy-production }}
      # JSON array of production-style deploy targets ({target, environment,
      # branch}) that should run for this event. Empty when nothing deploys.
      targets: ${{ steps.detect.outputs.targets }}
    steps:
      - name: Checkout pages scripts
        # The pages scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-pages
          sparse-checkout: |-
            scripts/pages/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Move pages scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and a
        # code checkout doesn't delete them.
        run: mv .devsecninja-pages "${RUNNER_TEMP}/devsecninja-pages"
      - name: Detect Cloudflare secrets
        id: detect
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PRODUCTION: ${{ inputs.cloudflare-production }}
          CLOUDFLARE_PRODUCTION_ON_RELEASE: ${{ inputs.cloudflare-production-on-release }}
          CLOUDFLARE_CUSTOM_DOMAIN: ${{ inputs.cloudflare-custom-domain }}
          CLOUDFLARE_ACCEPTANCE: ${{ inputs.cloudflare-acceptance }}
          CLOUDFLARE_PREVIEW: ${{ inputs.cloudflare-preview }}
          CLOUDFLARE_PRODUCTION_BRANCH: ${{ inputs.cloudflare-production-branch }}
          CLOUDFLARE_ACCEPTANCE_BRANCH: ${{ inputs.cloudflare-acceptance-branch }}
          PRODUCTION_BRANCH: ${{ inputs.production-branch }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          CONFIGURED_PROJECT_NAME: ${{ inputs.cloudflare-project-name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: bash "${RUNNER_TEMP}/devsecninja-pages/scripts/pages/detect-cloudflare.sh"
  test:
    name: Run tests
    needs:
      - validate-inputs
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch tags so a build-github-token build can read the release tag
          # at HEAD (footer/version metadata). Safe when no tags exist.
          fetch-tags: ${{ inputs.build-github-token }}
      - name: Checkout test-report action
        # The action ships with this reusable workflow: fetch it from the same
        # commit of DevSecNinja/.github that the caller pinned (a `uses:` ref
        # can't be an expression).
        if: ${{ inputs.test-report-paths != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-test-report
          sparse-checkout: |-
            actions/test-report/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Move test-report action out of the workspace
        if: ${{ inputs.test-report-paths != '' }}
        run: mv .devsecninja-test-report "${RUNNER_TEMP}/devsecninja-test-report"
      - name: Setup Node.js
        if: ${{ inputs.node-version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-cache }}
      - name: Setup Go
        if: ${{ inputs.go-version != '' || inputs.go-version-file != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
      - name: Install dependencies
        if: ${{ inputs.install-command != '' }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "${INSTALL_COMMAND}"
      - name: Run test setup
        if: ${{ inputs.test-setup-command != '' }}
        env:
          TEST_SETUP_COMMAND: ${{ inputs.test-setup-command }}
        run: bash -euo pipefail -c "${TEST_SETUP_COMMAND}"
      - name: Run tests
        id: tests
        if: ${{ inputs.test-command != '' }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "${TEST_COMMAND}"
      - name: Publish test results
        # Also when the tests failed, but not when they never ran.
        if: >-
          ${{ always() && inputs.test-report-paths != '' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
          }}
        env:
          REPORT_PATHS: ${{ inputs.test-report-paths }}
          REPORT_TITLE: ${{ inputs.test-report-title }}
          REPORT_MAX_FAILURES: "50"
          REPORT_IF_NO_FILES: warn
        run: bash "${RUNNER_TEMP}/devsecninja-test-report/actions/test-report/report.sh"
      # Runs here, in a contents: read job, rather than in the privileged deploy
      # jobs: the build gets GITHUB_TOKEN for authenticated API calls (rate
      # limits) without any deployment, pages, or PR write permission.
      - name: Build site
        if: ${{ inputs.build-command != '' && inputs.build-github-token }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          GITHUB_TOKEN: ${{ github.token }}
          APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash -euo pipefail -c "${BUILD_COMMAND}"
      - name: Upload built site
        if: ${{ inputs.build-command != '' && inputs.build-github-token }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.build-artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          # v4+ omits dotfiles; needed for .well-known, .nojekyll, …
          include-hidden-files: true
  deploy:
    name: Deploy to GitHub Pages
    needs:
      - test
    if: >-
      inputs.github-pages && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', inputs.production-branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      # Concurrency groups are already scoped to the repository, so naming the
      # repo adds nothing. A repository has exactly one GitHub Pages site, so
      # every call that deploys to Pages does belong in a single group.
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    env:
      # Real commit being built; on pull_request events github.sha is the
      # ephemeral merge commit, so prefer the PR head SHA when present.
      APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout pages scripts
        if: ${{ inputs.update-sitemap-lastmod }}
        # The pages scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-pages
          sparse-checkout: |-
            scripts/pages/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Move pages scripts out of the workspace
        if: ${{ inputs.update-sitemap-lastmod }}
        # Outside the workspace the caller's linters don't scan them, and a
        # code checkout doesn't delete them.
        run: mv .devsecninja-pages "${RUNNER_TEMP}/devsecninja-pages"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch tags so builds can read the release tag at HEAD
          # (footer/version metadata). Safe when no tags exist.
          fetch-tags: true
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Setup Node.js
        if: ${{ inputs.build-command != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          # Caching disabled on this privileged production-deploy job to remove
          # the cache-poisoning surface (zizmor), matching deploy-preview below.
          # These jobs run only on merge to the production branch, so the lost
          # package-download caching is negligible; test/preview keep it.
          package-manager-cache: false
      - name: Setup Go
        if: >-
          ${{ inputs.artifact-name == '' && (inputs.go-version != '' || inputs.go-version-file != '') }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          # Caching disabled on this privileged job to remove the
          # cache-poisoning surface (zizmor), matching setup-node above.
          cache: false
      - name: Install dependencies
        if: ${{ inputs.build-command != '' && inputs.install-command != '' && !inputs.build-github-token }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "${INSTALL_COMMAND}"
      - name: Build site
        if: ${{ inputs.build-command != '' && !inputs.build-github-token }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "${BUILD_COMMAND}"
      # Artifacts are scoped to the workflow run, and a reusable workflow's jobs
      # are part of the caller's run — so this picks up an artifact uploaded by
      # an earlier caller job (or the test job, with build-github-token) with no
      # extra permissions and no token handoff.
      - name: Clear stale files from artifact path
        if: ${{ inputs.build-command != '' && inputs.build-github-token }}
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: rm -rf -- "${ARTIFACT_PATH}"
      - name: Download prebuilt site
        if: ${{ inputs.artifact-name != '' || (inputs.build-command != '' && inputs.build-github-token) }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name || inputs.build-artifact-name }}
          path: ${{ inputs.artifact-path }}
      - name: Run pre-deploy command
        if: ${{ inputs.pre-deploy-command != '' }}
        env:
          PRE_DEPLOY_COMMAND: ${{ inputs.pre-deploy-command }}
        run: bash -euo pipefail -c "${PRE_DEPLOY_COMMAND}"
      - name: Update sitemap lastmod dates
        if: ${{ inputs.update-sitemap-lastmod }}
        env:
          SITEMAP_PATH: ${{ inputs.sitemap-path }}
        run: bash "${RUNNER_TEMP}/devsecninja-pages/scripts/pages/update-sitemap-lastmod.sh"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.artifact-path }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  deploy-cloudflare:
    name: Deploy Cloudflare ${{ matrix.target }}
    needs:
      - detect-cloudflare
      - test
    if: >-
      needs.detect-cloudflare.outputs.enabled == 'true' && needs.detect-cloudflare.outputs.targets != '[]'
    strategy:
      fail-fast: false
      # Production and acceptance share the same build and deploy steps; the
      # detect-cloudflare job decides which targets run for this event.
      matrix:
        include: ${{ fromJSON(needs.detect-cloudflare.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      # Scoped per Cloudflare project: a repository may call this workflow once
      # per site, and those deploys are independent of each other.
      group: cloudflare-pages-${{ matrix.target }}-${{ needs.detect-cloudflare.outputs.project-name }}
      cancel-in-progress: false
    environment:
      name: ${{ matrix.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    env:
      # Real commit being built; on pull_request events github.sha is the
      # ephemeral merge commit, so prefer the PR head SHA when present.
      APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch tags so builds can read the release tag at HEAD
          # (footer/version metadata). Safe when no tags exist.
          fetch-tags: true
      - name: Setup Node.js
        if: ${{ inputs.build-command != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          # Caching disabled on this privileged production-deploy job to remove
          # the cache-poisoning surface (zizmor), matching deploy-preview below.
          # These jobs run only on merge to the production branch, so the lost
          # package-download caching is negligible; test/preview keep it.
          package-manager-cache: false
      - name: Setup Go
        if: >-
          ${{ inputs.artifact-name == '' && (inputs.go-version != '' || inputs.go-version-file != '') }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          # Caching disabled on this privileged job to remove the
          # cache-poisoning surface (zizmor), matching setup-node above.
          cache: false
      - name: Install dependencies
        if: ${{ inputs.build-command != '' && inputs.install-command != '' && !inputs.build-github-token }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "${INSTALL_COMMAND}"
      - name: Build site
        if: ${{ inputs.build-command != '' && !inputs.build-github-token }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "${BUILD_COMMAND}"
      # Artifacts are scoped to the workflow run, and a reusable workflow's jobs
      # are part of the caller's run — so this picks up an artifact uploaded by
      # an earlier caller job (or the test job, with build-github-token) with no
      # extra permissions and no token handoff.
      - name: Clear stale files from artifact path
        if: ${{ inputs.build-command != '' && inputs.build-github-token }}
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: rm -rf -- "${ARTIFACT_PATH}"
      - name: Download prebuilt site
        if: ${{ inputs.artifact-name != '' || (inputs.build-command != '' && inputs.build-github-token) }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name || inputs.build-artifact-name }}
          path: ${{ inputs.artifact-path }}
      - name: Run pre-deploy command
        if: ${{ inputs.pre-deploy-command != '' }}
        env:
          PRE_DEPLOY_COMMAND: ${{ inputs.pre-deploy-command }}
        run: bash -euo pipefail -c "${PRE_DEPLOY_COMMAND}"
      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        continue-on-error: true
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            pages project create ${{ needs.detect-cloudflare.outputs.project-name }} --production-branch ${{ inputs.cloudflare-production-branch
            }}
          wranglerVersion: ${{ inputs.wrangler-version }}
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            pages deploy ${{ inputs.artifact-path }} --project-name=${{ needs.detect-cloudflare.outputs.project-name }} --branch=${{
            matrix.branch }}
          wranglerVersion: ${{ inputs.wrangler-version }}
  register-cloudflare-domain:
    name: Register Cloudflare production domain
    needs:
      - detect-cloudflare
      - deploy-cloudflare
    if: >-
      needs.detect-cloudflare.outputs.deploy-production == 'true' && inputs.cloudflare-custom-domain != '' && needs.deploy-cloudflare.result
      == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: >-
        cloudflare-pages-domain-${{ needs.detect-cloudflare.outputs.project-name }}-${{ inputs.cloudflare-custom-domain }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      status: ${{ steps.register.outputs.status }}
      dns-target: ${{ steps.register.outputs.dns-target }}
      dns-action: ${{ steps.register.outputs.dns-action }}
    steps:
      - name: Checkout pages scripts
        # The pages scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-pages
          sparse-checkout: |-
            scripts/pages/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Move pages scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and a
        # code checkout doesn't delete them.
        run: mv .devsecninja-pages "${RUNNER_TEMP}/devsecninja-pages"
      - name: Register Cloudflare Pages custom domain
        id: register
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUSTOM_DOMAIN: ${{ inputs.cloudflare-custom-domain }}
          MANAGE_DNS: ${{ inputs.cloudflare-manage-dns }}
          DNS_ZONE: ${{ inputs.cloudflare-dns-zone }}
          DNS_PROXIED: ${{ inputs.cloudflare-dns-proxied }}
          PROJECT_NAME: ${{ needs.detect-cloudflare.outputs.project-name }}
        run: bash "${RUNNER_TEMP}/devsecninja-pages/scripts/pages/register-cloudflare-domain.sh"
  deploy-preview:
    name: Deploy Cloudflare preview
    needs:
      - detect-cloudflare
      - test
    # Bot PRs are matched on the PR author as well as the triggering actor, so
    # a human pushing "Update branch" on a Renovate PR still deploys no preview.
    if: >-
      inputs.cloudflare-preview && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.login != 'renovate[bot]' && github.event.pull_request.user.login
      != 'dependabot[bot]' && github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]' && needs.detect-cloudflare.outputs.enabled
      == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      # Scoped per Cloudflare project, as above. Without the project name two
      # calls from one repository share a group and, because this one cancels
      # in progress, the second preview kills the first.
      group: preview-${{ github.event.pull_request.number }}-${{ needs.detect-cloudflare.outputs.project-name }}
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
      issues: write
      pull-requests: write
    env:
      # Real commit being built; on pull_request events github.sha is the
      # ephemeral merge commit, so prefer the PR head SHA when present.
      APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch tags so builds can read the release tag at HEAD
          # (footer/version metadata). Safe when no tags exist.
          fetch-tags: true
      - name: Setup Node.js
        if: ${{ inputs.build-command != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Setup Go
        if: >-
          ${{ inputs.artifact-name == '' && (inputs.go-version != '' || inputs.go-version-file != '') }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          # Caching disabled on this privileged job to remove the
          # cache-poisoning surface (zizmor), matching setup-node above.
          cache: false
      - name: Install dependencies
        if: ${{ inputs.build-command != '' && inputs.install-command != '' && !inputs.build-github-token }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "${INSTALL_COMMAND}"
      - name: Build site
        if: ${{ inputs.build-command != '' && !inputs.build-github-token }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "${BUILD_COMMAND}"
      # Artifacts are scoped to the workflow run, and a reusable workflow's jobs
      # are part of the caller's run — so this picks up an artifact uploaded by
      # an earlier caller job (or the test job, with build-github-token) with no
      # extra permissions and no token handoff.
      - name: Clear stale files from artifact path
        if: ${{ inputs.build-command != '' && inputs.build-github-token }}
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: rm -rf -- "${ARTIFACT_PATH}"
      - name: Download prebuilt site
        if: ${{ inputs.artifact-name != '' || (inputs.build-command != '' && inputs.build-github-token) }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name || inputs.build-artifact-name }}
          path: ${{ inputs.artifact-path }}
      - name: Run pre-preview command
        if: ${{ inputs.pre-preview-command != '' }}
        env:
          PRE_PREVIEW_COMMAND: ${{ inputs.pre-preview-command }}
        run: bash -euo pipefail -c "${PRE_PREVIEW_COMMAND}"
      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        continue-on-error: true
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            pages project create ${{ needs.detect-cloudflare.outputs.project-name }} --production-branch ${{ inputs.cloudflare-production-branch
            }}
          wranglerVersion: ${{ inputs.wrangler-version }}
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            pages deploy ${{ inputs.artifact-path }} --project-name=${{ needs.detect-cloudflare.outputs.project-name }} --branch=${{
            github.head_ref }}
          wranglerVersion: ${{ inputs.wrangler-version }}
      - name: Post or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PREVIEW_COMMENT_MARKER: ${{ inputs.preview-comment-marker }}
        with:
          script: |-
            const marker = process.env.PREVIEW_COMMENT_MARKER;
            const body = [
              marker,
              `🔍 **Preview deployed:** ${process.env.DEPLOYMENT_URL}`,
              '',
              `_Updated: ${new Date().toUTCString()}_`,
            ].join('\n');
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
  close-preview:
    name: Close Cloudflare preview
    needs:
      - detect-cloudflare
    if: >-
      inputs.cloudflare-preview && github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name
      == github.repository && github.event.pull_request.user.login != 'renovate[bot]' && github.event.pull_request.user.login
      != 'dependabot[bot]' && github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]' && needs.detect-cloudflare.outputs.enabled
      == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Checkout pages scripts
        # The pages scripts ship with this reusable workflow: fetch them from
        # the same commit of DevSecNinja/.github that the caller pinned.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devsecninja-pages
          sparse-checkout: |-
            scripts/pages/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Move pages scripts out of the workspace
        # Outside the workspace the caller's linters don't scan them, and a
        # code checkout doesn't delete them.
        run: mv .devsecninja-pages "${RUNNER_TEMP}/devsecninja-pages"
      - name: Delete Cloudflare Pages preview deployments
        env:
          BRANCH: ${{ github.head_ref }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_NAME: ${{ needs.detect-cloudflare.outputs.project-name }}
        run: bash "${RUNNER_TEMP}/devsecninja-pages/scripts/pages/delete-preview-deployments.sh"
