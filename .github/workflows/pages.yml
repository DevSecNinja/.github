---
name: Reusable — Pages
on:
  workflow_call:
    inputs:
      node-version:
        description: >-
          Node.js version for setup-node. Required when install-command, test-setup-command, test-command, or build-command
          is set; leave empty for no-build static sites.
        required: false
        type: string
        default: ""
      node-cache:
        description: "Package manager cache for setup-node; use empty to disable"
        required: false
        type: string
        default: ""
      go-version:
        description: >-
          Go version to install before the build. Required for Hugo Modules and any other build step that shells out to Go;
          leave empty to skip Go setup. Without it the build silently uses whatever Go the runner image happens to ship.
        required: false
        type: string
        default: ""
      go-version-file:
        description: >-
          File to read the Go version from, used only when go-version is empty.
        required: false
        type: string
        default: ""
      wrangler-version:
        description: >-
          Wrangler version for Cloudflare Pages deploys. Required when cloudflare-preview, cloudflare-production, or cloudflare-acceptance
          is enabled.
        required: false
        type: string
        default: ""
      production-branch:
        description: "Branch that deploys to production"
        required: false
        type: string
        default: "main"
      github-pages:
        description: "Deploy production to GitHub Pages"
        required: false
        type: boolean
        default: true
      artifact-path:
        description: "Path uploaded to GitHub Pages or Cloudflare Pages"
        required: true
        type: string
      artifact-name:
        description: >-
          Name of an artifact, uploaded by an earlier job in the calling workflow, that already contains the built site. When
          set, the deploy jobs download it into `artifact-path` instead of running `install-command` / `build-command`.

          Use this when the build needs credentials or tooling this workflow does not provide: the build then runs in the
          caller's own job, where the caller controls the environment, and this workflow only deploys. The calling job must
          `needs:` the job that uploads the artifact.
        required: false
        type: string
        default: ""
      install-command:
        description: "Dependency installation command"
        required: false
        type: string
        default: "npm ci"
      test-command:
        description: "Shell commands that validate the site before deployment"
        required: false
        type: string
        default: ""
      test-setup-command:
        description: "Optional setup command after install and before tests"
        required: false
        type: string
        default: ""
      build-command:
        description: "Optional build command before uploading artifacts"
        required: false
        type: string
        default: ""
      pre-deploy-command:
        description: "Optional command before the GitHub Pages upload"
        required: false
        type: string
        default: ""
      pre-preview-command:
        description: "Optional command before the Cloudflare preview deploy"
        required: false
        type: string
        default: ""
      update-sitemap-lastmod:
        description: "Update sitemap.xml lastmod dates during production deploy"
        required: false
        type: boolean
        default: false
      sitemap-path:
        description: "Sitemap path used when update-sitemap-lastmod is true"
        required: false
        type: string
        default: "sitemap.xml"
      cloudflare-preview:
        description: "Deploy pull request previews to Cloudflare Pages"
        required: false
        type: boolean
        default: true
      cloudflare-production:
        description: "Deploy production to Cloudflare Pages"
        required: false
        type: boolean
        default: false
      cloudflare-production-on-release:
        description: >-
          Deploy Cloudflare production only on GitHub release events instead of on every production-branch commit. The caller
          must also trigger the workflow on the release event.
        required: false
        type: boolean
        default: false
      cloudflare-custom-domain:
        description: >-
          Optional lowercase FQDN to register on the production Cloudflare Pages project after a successful production deploy.
        required: false
        type: string
        default: ""
      cloudflare-manage-dns:
        description: >-
          Create the custom-domain CNAME when absent. Existing conflicting records are never changed. Requires cloudflare-dns-zone.
        required: false
        type: boolean
        default: false
      cloudflare-dns-zone:
        description: >-
          Lowercase zone apex containing cloudflare-custom-domain, for example example.com. Required when cloudflare-manage-dns
          is true.
        required: false
        type: string
        default: ""
      cloudflare-dns-proxied:
        description: "Proxy a workflow-managed custom-domain CNAME through Cloudflare"
        required: false
        type: boolean
        default: true
      cloudflare-acceptance:
        description: "Deploy an acceptance build to Cloudflare Pages on production-branch commits"
        required: false
        type: boolean
        default: false
      cloudflare-acceptance-branch:
        description: "Cloudflare branch name used for acceptance deploys (gives a stable acceptance URL)"
        required: false
        type: string
        default: "acceptance"
      cloudflare-project-name:
        description: "Cloudflare Pages project name; defaults to the repo name"
        required: false
        type: string
        default: ""
      cloudflare-production-branch:
        description: "Production branch configured on the Cloudflare project"
        required: false
        type: string
        default: "main"
      preview-comment-marker:
        description: "Marker used to update the Cloudflare preview PR comment"
        required: false
        type: string
        default: "<!-- cf-preview-comment -->"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
    outputs:
      cloudflare-custom-domain-status:
        description: >-
          Cloudflare Pages custom-domain status after registration, when enabled.
        value: ${{ jobs.register-cloudflare-domain.outputs.status }}
      cloudflare-custom-domain-dns-target:
        description: >-
          Resolved pages.dev CNAME target for the production Pages project.
        value: ${{ jobs.register-cloudflare-domain.outputs.dns-target }}
      cloudflare-custom-domain-dns-action:
        description: >-
          DNS result when custom-domain registration runs: unmanaged, created, or no-op.
        value: ${{ jobs.register-cloudflare-domain.outputs.dns-action }}
permissions:
  contents: read
jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate tool versions
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          WRANGLER_VERSION: ${{ inputs.wrangler-version }}
          INSTALL_COMMAND: ${{ inputs.install-command }}
          TEST_SETUP_COMMAND: ${{ inputs.test-setup-command }}
          TEST_COMMAND: ${{ inputs.test-command }}
          BUILD_COMMAND: ${{ inputs.build-command }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          CLOUDFLARE_PREVIEW: ${{ inputs.cloudflare-preview }}
          CLOUDFLARE_PRODUCTION: ${{ inputs.cloudflare-production }}
          CLOUDFLARE_ACCEPTANCE: ${{ inputs.cloudflare-acceptance }}
          CLOUDFLARE_CUSTOM_DOMAIN: ${{ inputs.cloudflare-custom-domain }}
          CLOUDFLARE_MANAGE_DNS: ${{ inputs.cloudflare-manage-dns }}
          CLOUDFLARE_DNS_ZONE: ${{ inputs.cloudflare-dns-zone }}
          CONFIGURED_PROJECT_NAME: ${{ inputs.cloudflare-project-name }}
        run: |-
          set -euo pipefail

          if [ -z "${NODE_VERSION}" ] && {
            [ -n "${INSTALL_COMMAND}" ] ||
            [ -n "${TEST_SETUP_COMMAND}" ] ||
            [ -n "${TEST_COMMAND}" ] ||
            [ -n "${BUILD_COMMAND}" ]
          }; then
            echo "::error::node-version is required when install-command, test-setup-command, test-command, or build-command is set; provide node-version or clear those commands."
            exit 1
          fi

          if [ -n "${ARTIFACT_NAME}" ] && [ -n "${BUILD_COMMAND}" ]; then
            echo "::error::artifact-name and build-command are mutually exclusive; the artifact is deployed as-is."
            exit 1
          fi

          if [ -z "${WRANGLER_VERSION}" ] && {
            [ "${CLOUDFLARE_PREVIEW}" = "true" ] ||
            [ "${CLOUDFLARE_PRODUCTION}" = "true" ] ||
            [ "${CLOUDFLARE_ACCEPTANCE}" = "true" ]
          }; then
            echo "::error::wrangler-version is required when cloudflare-preview, cloudflare-production, or cloudflare-acceptance is enabled."
            exit 1
          fi

          if [ -n "${CLOUDFLARE_CUSTOM_DOMAIN}" ]; then
            if [ "${CLOUDFLARE_PRODUCTION}" != "true" ]; then
              echo "::error::cloudflare-custom-domain requires cloudflare-production: true."
              exit 1
            fi

            if [ -z "${CONFIGURED_PROJECT_NAME}" ]; then
              echo "::error::cloudflare-project-name is required when cloudflare-custom-domain is set."
              exit 1
            fi

            if [ "${#CLOUDFLARE_CUSTOM_DOMAIN}" -gt 253 ] ||
              ! [[ "${CLOUDFLARE_CUSTOM_DOMAIN}" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$ ]]; then
              echo "::error::cloudflare-custom-domain must be a lowercase FQDN with at least two labels; schemes, paths, ports, wildcards, underscores, and trailing dots are not allowed."
              exit 1
            fi
          fi

          if [ "${CLOUDFLARE_MANAGE_DNS}" = "true" ]; then
            if [ "${CLOUDFLARE_PRODUCTION}" != "true" ]; then
              echo "::error::cloudflare-manage-dns requires cloudflare-production: true."
              exit 1
            fi

            if [ -z "${CLOUDFLARE_CUSTOM_DOMAIN}" ]; then
              echo "::error::cloudflare-manage-dns requires cloudflare-custom-domain."
              exit 1
            fi

            if [ -z "${CLOUDFLARE_DNS_ZONE}" ]; then
              echo "::error::cloudflare-manage-dns requires cloudflare-dns-zone."
              exit 1
            fi

            if [ "${#CLOUDFLARE_DNS_ZONE}" -gt 253 ] ||
              ! [[ "${CLOUDFLARE_DNS_ZONE}" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$ ]]; then
              echo "::error::cloudflare-dns-zone must be a lowercase DNS zone with at least two labels; schemes, paths, ports, wildcards, underscores, and trailing dots are not allowed."
              exit 1
            fi

            case "${CLOUDFLARE_CUSTOM_DOMAIN}" in
              "${CLOUDFLARE_DNS_ZONE}" | *."${CLOUDFLARE_DNS_ZONE}") ;;
              *)
                echo "::error::cloudflare-custom-domain must equal cloudflare-dns-zone or be its subdomain."
                exit 1
                ;;
            esac
          fi

          echo "Input validation passed."
  detect-cloudflare:
    name: Detect Cloudflare configuration
    needs:
      - validate-inputs
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
      project-name: ${{ steps.detect.outputs.project-name }}
      deploy-production: ${{ steps.detect.outputs.deploy-production }}
      # JSON array of production-style deploy targets ({target, environment,
      # branch}) that should run for this event. Empty when nothing deploys.
      targets: ${{ steps.detect.outputs.targets }}
    steps:
      - name: Detect Cloudflare secrets
        id: detect
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PRODUCTION: ${{ inputs.cloudflare-production }}
          CLOUDFLARE_PRODUCTION_ON_RELEASE: ${{ inputs.cloudflare-production-on-release }}
          CLOUDFLARE_CUSTOM_DOMAIN: ${{ inputs.cloudflare-custom-domain }}
          CLOUDFLARE_ACCEPTANCE: ${{ inputs.cloudflare-acceptance }}
          CLOUDFLARE_PREVIEW: ${{ inputs.cloudflare-preview }}
          CLOUDFLARE_PRODUCTION_BRANCH: ${{ inputs.cloudflare-production-branch }}
          CLOUDFLARE_ACCEPTANCE_BRANCH: ${{ inputs.cloudflare-acceptance-branch }}
          PRODUCTION_BRANCH: ${{ inputs.production-branch }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          CONFIGURED_PROJECT_NAME: ${{ inputs.cloudflare-project-name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |-
          set -euo pipefail

          project_name="${CONFIGURED_PROJECT_NAME:-$REPOSITORY_NAME}"

          if [ "${CLOUDFLARE_PREVIEW}" != "true" ] && [ "${CLOUDFLARE_PRODUCTION}" != "true" ] && [ "${CLOUDFLARE_ACCEPTANCE}" != "true" ]; then
            {
              echo "enabled=false"
              echo "deploy-production=false"
              echo "targets=[]"
            } >>"${GITHUB_OUTPUT}"
            echo "Cloudflare Pages deployments are disabled by input."
            exit 0
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            {
              echo "enabled=false"
              echo "deploy-production=false"
              echo "targets=[]"
            } >>"${GITHUB_OUTPUT}"
            if [ -n "${CLOUDFLARE_CUSTOM_DOMAIN}" ]; then
              echo "::error::cloudflare-custom-domain requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
              exit 1
            elif [ "${CLOUDFLARE_PRODUCTION}" = "true" ] || [ "${CLOUDFLARE_ACCEPTANCE}" = "true" ]; then
              echo "::error::cloudflare-production or cloudflare-acceptance is enabled, but CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing."
              exit 1
            fi

            echo "::notice::Missing Cloudflare secrets; skipping preview deploys."
            exit 0
          fi

          if [ -z "${project_name}" ]; then
            echo "::error::cloudflare-project-name is required."
            exit 1
          fi

          if ! [[ "${project_name}" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "::error::cloudflare-project-name must contain only lowercase letters, numbers, and hyphens."
            exit 1
          fi

          # Work out which production-style targets deploy for this event.
          # Pull request previews are handled by a separate job.
          is_production_branch="false"
          if [ "${EVENT_NAME}" != "pull_request" ] && [ "${GIT_REF}" = "refs/heads/${PRODUCTION_BRANCH}" ]; then
            is_production_branch="true"
          fi

          deploy_production="false"
          if [ "${CLOUDFLARE_PRODUCTION}" = "true" ]; then
            if [ "${CLOUDFLARE_PRODUCTION_ON_RELEASE}" = "true" ]; then
              [ "${EVENT_NAME}" = "release" ] && deploy_production="true"
            else
              [ "${is_production_branch}" = "true" ] && deploy_production="true"
            fi
          fi

          deploy_acceptance="false"
          if [ "${CLOUDFLARE_ACCEPTANCE}" = "true" ] && [ "${is_production_branch}" = "true" ]; then
            deploy_acceptance="true"
          fi

          targets="$(
            jq -cn \
              --arg prod_branch "${CLOUDFLARE_PRODUCTION_BRANCH}" \
              --arg acc_branch "${CLOUDFLARE_ACCEPTANCE_BRANCH}" \
              --argjson prod "${deploy_production}" \
              --argjson acc "${deploy_acceptance}" \
              '[
                 (if $prod then {target: "production", environment: "cloudflare-pages", branch: $prod_branch} else empty end),
                 (if $acc then {target: "acceptance", environment: "cloudflare-pages-acceptance", branch: $acc_branch} else empty end)
               ]'
          )"

          {
            echo "project-name=${project_name}"
            echo "enabled=true"
            echo "deploy-production=${deploy_production}"
            echo "targets=${targets}"
          } >>"${GITHUB_OUTPUT}"
          echo "Cloudflare Pages deployments are configured (targets: ${targets})."
  test:
    name: Run tests
    needs:
      - validate-inputs
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        if: ${{ inputs.node-version != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-cache }}
      - name: Setup Go
        if: ${{ inputs.go-version != '' || inputs.go-version-file != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
      - name: Install dependencies
        if: ${{ inputs.install-command != '' }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "${INSTALL_COMMAND}"
      - name: Run test setup
        if: ${{ inputs.test-setup-command != '' }}
        env:
          TEST_SETUP_COMMAND: ${{ inputs.test-setup-command }}
        run: bash -euo pipefail -c "${TEST_SETUP_COMMAND}"
      - name: Run tests
        if: ${{ inputs.test-command != '' }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "${TEST_COMMAND}"
  deploy:
    name: Deploy to GitHub Pages
    needs:
      - test
    if: >-
      inputs.github-pages && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', inputs.production-branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      # Concurrency groups are already scoped to the repository, so naming the
      # repo adds nothing. A repository has exactly one GitHub Pages site, so
      # every call that deploys to Pages does belong in a single group.
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    env:
      # Real commit being built; on pull_request events github.sha is the
      # ephemeral merge commit, so prefer the PR head SHA when present.
      APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch tags so builds can read the release tag at HEAD
          # (footer/version metadata). Safe when no tags exist.
          fetch-tags: true
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Setup Node.js
        if: ${{ inputs.build-command != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          # Caching disabled on this privileged production-deploy job to remove
          # the cache-poisoning surface (zizmor), matching deploy-preview below.
          # These jobs run only on merge to the production branch, so the lost
          # package-download caching is negligible; test/preview keep it.
          package-manager-cache: false
      - name: Setup Go
        if: >-
          ${{ inputs.artifact-name == '' && (inputs.go-version != '' || inputs.go-version-file != '') }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          # Caching disabled on this privileged job to remove the
          # cache-poisoning surface (zizmor), matching setup-node above.
          cache: false
      - name: Install dependencies
        if: ${{ inputs.build-command != '' && inputs.install-command != '' }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "${INSTALL_COMMAND}"
      - name: Build site
        if: ${{ inputs.build-command != '' }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "${BUILD_COMMAND}"
      # Artifacts are scoped to the workflow run, and a reusable workflow's jobs
      # are part of the caller's run — so this picks up an artifact uploaded by
      # an earlier caller job with no extra permissions and no token handoff.
      - name: Download prebuilt site
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
      - name: Run pre-deploy command
        if: ${{ inputs.pre-deploy-command != '' }}
        env:
          PRE_DEPLOY_COMMAND: ${{ inputs.pre-deploy-command }}
        run: bash -euo pipefail -c "${PRE_DEPLOY_COMMAND}"
      - name: Update sitemap lastmod dates
        if: ${{ inputs.update-sitemap-lastmod }}
        env:
          SITEMAP_PATH: ${{ inputs.sitemap-path }}
        run: |-
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          if [ ! -f "${SITEMAP_PATH}" ]; then
            echo "::error::Sitemap file '${SITEMAP_PATH}' does not exist."
            exit 1
          fi
          if ! grep -Eq "<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>" "${SITEMAP_PATH}"; then
            echo "::error::No sitemap lastmod tags found in '${SITEMAP_PATH}'."
            exit 1
          fi
          sed -i -E \
            "s|<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>|<lastmod>${today}</lastmod>|g" \
            "${SITEMAP_PATH}"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.artifact-path }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
  deploy-cloudflare:
    name: Deploy Cloudflare ${{ matrix.target }}
    needs:
      - detect-cloudflare
      - test
    if: >-
      needs.detect-cloudflare.outputs.enabled == 'true' && needs.detect-cloudflare.outputs.targets != '[]'
    strategy:
      fail-fast: false
      # Production and acceptance share the same build and deploy steps; the
      # detect-cloudflare job decides which targets run for this event.
      matrix:
        include: ${{ fromJSON(needs.detect-cloudflare.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      # Scoped per Cloudflare project: a repository may call this workflow once
      # per site, and those deploys are independent of each other.
      group: cloudflare-pages-${{ matrix.target }}-${{ needs.detect-cloudflare.outputs.project-name }}
      cancel-in-progress: false
    environment:
      name: ${{ matrix.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    env:
      # Real commit being built; on pull_request events github.sha is the
      # ephemeral merge commit, so prefer the PR head SHA when present.
      APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch tags so builds can read the release tag at HEAD
          # (footer/version metadata). Safe when no tags exist.
          fetch-tags: true
      - name: Setup Node.js
        if: ${{ inputs.build-command != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          # Caching disabled on this privileged production-deploy job to remove
          # the cache-poisoning surface (zizmor), matching deploy-preview below.
          # These jobs run only on merge to the production branch, so the lost
          # package-download caching is negligible; test/preview keep it.
          package-manager-cache: false
      - name: Setup Go
        if: >-
          ${{ inputs.artifact-name == '' && (inputs.go-version != '' || inputs.go-version-file != '') }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          # Caching disabled on this privileged job to remove the
          # cache-poisoning surface (zizmor), matching setup-node above.
          cache: false
      - name: Install dependencies
        if: ${{ inputs.build-command != '' && inputs.install-command != '' }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "${INSTALL_COMMAND}"
      - name: Build site
        if: ${{ inputs.build-command != '' }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "${BUILD_COMMAND}"
      # Artifacts are scoped to the workflow run, and a reusable workflow's jobs
      # are part of the caller's run — so this picks up an artifact uploaded by
      # an earlier caller job with no extra permissions and no token handoff.
      - name: Download prebuilt site
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
      - name: Run pre-deploy command
        if: ${{ inputs.pre-deploy-command != '' }}
        env:
          PRE_DEPLOY_COMMAND: ${{ inputs.pre-deploy-command }}
        run: bash -euo pipefail -c "${PRE_DEPLOY_COMMAND}"
      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        continue-on-error: true
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            pages project create ${{ needs.detect-cloudflare.outputs.project-name }} --production-branch ${{ inputs.cloudflare-production-branch
            }}
          wranglerVersion: ${{ inputs.wrangler-version }}
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            pages deploy ${{ inputs.artifact-path }} --project-name=${{ needs.detect-cloudflare.outputs.project-name }} --branch=${{
            matrix.branch }}
          wranglerVersion: ${{ inputs.wrangler-version }}
  register-cloudflare-domain:
    name: Register Cloudflare production domain
    needs:
      - detect-cloudflare
      - deploy-cloudflare
    if: >-
      needs.detect-cloudflare.outputs.deploy-production == 'true' && inputs.cloudflare-custom-domain != '' && needs.deploy-cloudflare.result
      == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: >-
        cloudflare-pages-domain-${{ needs.detect-cloudflare.outputs.project-name }}-${{ inputs.cloudflare-custom-domain }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      status: ${{ steps.register.outputs.status }}
      dns-target: ${{ steps.register.outputs.dns-target }}
      dns-action: ${{ steps.register.outputs.dns-action }}
    steps:
      - name: Register Cloudflare Pages custom domain
        id: register
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUSTOM_DOMAIN: ${{ inputs.cloudflare-custom-domain }}
          MANAGE_DNS: ${{ inputs.cloudflare-manage-dns }}
          DNS_ZONE: ${{ inputs.cloudflare-dns-zone }}
          DNS_PROXIED: ${{ inputs.cloudflare-dns-proxied }}
          PROJECT_NAME: ${{ needs.detect-cloudflare.outputs.project-name }}
        run: |-
          set -euo pipefail

          api_base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          domain_response="$(mktemp)"
          project_response="$(mktemp)"
          zone_response="$(mktemp)"
          records_response="$(mktemp)"
          records_all="$(mktemp)"
          records_next="$(mktemp)"
          request_body="$(mktemp)"
          trap 'rm -f "${domain_response}" "${project_response}" "${zone_response}" "${records_response}" "${records_all}" "${records_next}" "${request_body}"' EXIT

          api_errors() {
            local response_file="$1"
            jq -r \
              'if ([.errors[]?.message] | length) > 0
               then [.errors[]?.message] | join("; ")
               else "no error details returned"
               end' \
              "${response_file}" 2>/dev/null || printf '%s' "invalid JSON response"
          }

          request() {
            local method="$1"
            local url="$2"
            local output_file="$3"
            local data_file="${4:-}"
            local -a args=(
              --silent
              --show-error
              --connect-timeout 10
              --max-time 60
              --output "${output_file}"
              --write-out "%{http_code}"
              --request "${method}"
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
            )

            if [ "${method}" = "GET" ]; then
              args+=(--retry 2 --retry-all-errors)
            fi

            if [ -n "${data_file}" ]; then
              args+=(
                --header "Content-Type: application/json"
                --data-binary "@${data_file}"
              )
            fi

            local http_code
            if ! http_code="$(curl "${args[@]}" "${url}")"; then
              echo "::error::Cloudflare API ${method} request failed before an HTTP response was received." >&2
              return 1
            fi
            printf '%s' "${http_code}"
          }

          domain_url="${api_base}/domains/${CUSTOM_DOMAIN}"
          domain_http_code="$(request GET "${domain_url}" "${domain_response}")"

          if [ "${domain_http_code}" = "200" ]; then
            if ! jq -e \
              --arg domain "${CUSTOM_DOMAIN}" \
              '.success == true and .result.name == $domain' \
              "${domain_response}" >/dev/null; then
              echo "::error::Cloudflare returned an unsuccessful or mismatched custom-domain response: $(api_errors "${domain_response}")"
              exit 1
            fi
            status="$(jq -r '.result.status' "${domain_response}")"
            case "${status}" in
              active | pending | initializing)
                echo "Cloudflare Pages custom domain '${CUSTOM_DOMAIN}' already exists with status '${status}'."
                ;;
              *)
                echo "::error::Cloudflare Pages custom domain '${CUSTOM_DOMAIN}' is in unexpected status '${status}'."
                exit 1
                ;;
            esac
          elif [ "${domain_http_code}" = "404" ]; then
            jq -cn --arg name "${CUSTOM_DOMAIN}" '{name: $name}' >"${request_body}"
            domain_http_code="$(request POST "${api_base}/domains" "${domain_response}" "${request_body}")"
            if [ "${domain_http_code}" -lt 200 ] || [ "${domain_http_code}" -ge 300 ]; then
              echo "::error::Failed to register Cloudflare Pages custom domain '${CUSTOM_DOMAIN}' (HTTP ${domain_http_code}): $(api_errors "${domain_response}")"
              exit 1
            fi
            if ! jq -e \
              --arg domain "${CUSTOM_DOMAIN}" \
              '.success == true and .result.name == $domain' \
              "${domain_response}" >/dev/null; then
              echo "::error::Cloudflare returned an unsuccessful or mismatched custom-domain registration response: $(api_errors "${domain_response}")"
              exit 1
            fi
            status="$(jq -r '.result.status' "${domain_response}")"
            case "${status}" in
              active | pending | initializing)
                echo "Registered Cloudflare Pages custom domain '${CUSTOM_DOMAIN}' with status '${status}'."
                ;;
              *)
                echo "::error::Cloudflare registered custom domain '${CUSTOM_DOMAIN}' with unexpected status '${status}'."
                exit 1
                ;;
            esac
          else
            echo "::error::Failed to query Cloudflare Pages custom domain '${CUSTOM_DOMAIN}' (HTTP ${domain_http_code}): $(api_errors "${domain_response}")"
            exit 1
          fi

          project_http_code="$(request GET "${api_base}" "${project_response}")"
          if [ "${project_http_code}" -lt 200 ] || [ "${project_http_code}" -ge 300 ]; then
            echo "::error::Failed to query Cloudflare Pages project '${PROJECT_NAME}' (HTTP ${project_http_code}): $(api_errors "${project_response}")"
            exit 1
          fi
          if ! dns_target="$(
            jq -er \
              --arg project "${PROJECT_NAME}" \
              'select(.success == true and .result.name == $project)
               | .result.subdomain
               | select(type == "string" and endswith(".pages.dev"))' \
              "${project_response}"
          )"; then
            echo "::error::Cloudflare returned an unsuccessful project response or no valid pages.dev subdomain: $(api_errors "${project_response}")"
            exit 1
          fi

          dns_action="unmanaged"
          dns_proxied_summary="not managed"
          if [ "${MANAGE_DNS}" = "true" ]; then
            dns_proxied_summary="${DNS_PROXIED}"
            zones_url="https://api.cloudflare.com/client/v4/zones?name=${DNS_ZONE}&status=active&account.id=${CLOUDFLARE_ACCOUNT_ID}&page=1&per_page=50"
            zones_http_code="$(request GET "${zones_url}" "${zone_response}")"
            if [ "${zones_http_code}" -lt 200 ] || [ "${zones_http_code}" -ge 300 ]; then
              echo "::error::Failed to resolve active Cloudflare DNS zone '${DNS_ZONE}' (HTTP ${zones_http_code}): $(api_errors "${zone_response}")"
              exit 1
            fi
            if ! jq -e \
              --arg zone "${DNS_ZONE}" \
              --arg account "${CLOUDFLARE_ACCOUNT_ID}" \
              '.success == true
               and (.result | type) == "array"
               and ((.result_info.total_pages // 1) == 1)
               and ([.result[]
                     | select(.name == $zone
                              and .status == "active"
                              and .account.id == $account)]
                    | length) == 1
               and (.result | length) == 1' \
              "${zone_response}" >/dev/null; then
              echo "::error::Cloudflare must return exactly one active '${DNS_ZONE}' zone in the configured account: $(api_errors "${zone_response}")"
              exit 1
            fi
            zone_id="$(jq -er '.result[0].id | select(type == "string" and length > 0)' "${zone_response}")"
            zone_api="https://api.cloudflare.com/client/v4/zones/${zone_id}"

            printf '[]' >"${records_all}"
            page=1
            total_pages=1
            while [ "${page}" -le "${total_pages}" ]; do
              records_url="${zone_api}/dns_records?name=${CUSTOM_DOMAIN}&page=${page}&per_page=100"
              records_http_code="$(request GET "${records_url}" "${records_response}")"
              if [ "${records_http_code}" -lt 200 ] || [ "${records_http_code}" -ge 300 ]; then
                echo "::error::Failed to query DNS records for '${CUSTOM_DOMAIN}' (HTTP ${records_http_code}): $(api_errors "${records_response}")"
                exit 1
              fi
              if ! jq -e \
                '.success == true
                 and (.result | type) == "array"
                 and ((.result_info.total_pages // 1) | type) == "number"
                 and (.result_info.total_pages // 1) >= 1' \
                "${records_response}" >/dev/null; then
                echo "::error::Cloudflare returned an invalid DNS records response: $(api_errors "${records_response}")"
                exit 1
              fi
              total_pages="$(jq -r '.result_info.total_pages // 1' "${records_response}")"
              jq -s '.[0] + .[1].result' "${records_all}" "${records_response}" >"${records_next}"
              mv "${records_next}" "${records_all}"
              page=$((page + 1))
            done

            record_count="$(
              jq -r --arg name "${CUSTOM_DOMAIN}" \
                '[.[] | select(.name == $name)] | length' \
                "${records_all}"
            )"
            if [ "${record_count}" -eq 0 ]; then
              jq -cn \
                --arg name "${CUSTOM_DOMAIN}" \
                --arg content "${dns_target}" \
                --argjson proxied "${DNS_PROXIED}" \
                '{type: "CNAME", name: $name, content: $content, ttl: 1, proxied: $proxied}' \
                >"${request_body}"
              create_http_code="$(request POST "${zone_api}/dns_records" "${records_response}" "${request_body}")"
              if [ "${create_http_code}" -lt 200 ] || [ "${create_http_code}" -ge 300 ]; then
                echo "::error::Failed to create DNS CNAME for '${CUSTOM_DOMAIN}' (HTTP ${create_http_code}): $(api_errors "${records_response}")"
                exit 1
              fi
              if ! jq -e \
                --arg name "${CUSTOM_DOMAIN}" \
                --arg content "${dns_target}" \
                --argjson proxied "${DNS_PROXIED}" \
                '.success == true
                 and .result.type == "CNAME"
                 and .result.name == $name
                 and .result.content == $content
                 and .result.proxied == $proxied' \
                "${records_response}" >/dev/null; then
                echo "::error::Cloudflare returned an unsuccessful or mismatched DNS creation response: $(api_errors "${records_response}")"
                exit 1
              fi
              dns_action="created"
              echo "Created DNS CNAME '${CUSTOM_DOMAIN}' pointing to '${dns_target}' (proxied: ${DNS_PROXIED})."
            elif [ "${record_count}" -eq 1 ] && jq -e \
              --arg name "${CUSTOM_DOMAIN}" \
              --arg content "${dns_target}" \
              --argjson proxied "${DNS_PROXIED}" \
              '.[] | select(.name == $name)
               | .type == "CNAME"
                 and .content == $content
                 and .proxied == $proxied' \
              "${records_all}" >/dev/null; then
              dns_action="no-op"
              echo "DNS CNAME '${CUSTOM_DOMAIN}' already points to '${dns_target}' with the requested proxy state."
            else
              echo "::error::A conflicting DNS record already exists for '${CUSTOM_DOMAIN}'. Refusing to change or replace it."
              exit 1
            fi

            if [ "${status}" != "active" ]; then
              poll_interval="${PAGES_DOMAIN_POLL_INTERVAL_SECONDS:-10}"
              for attempt in $(seq 1 12); do
                sleep "${poll_interval}"
                domain_http_code="$(request GET "${domain_url}" "${domain_response}")"
                if [ "${domain_http_code}" != "200" ] || ! jq -e \
                  --arg domain "${CUSTOM_DOMAIN}" \
                  '.success == true and .result.name == $domain' \
                  "${domain_response}" >/dev/null; then
                  echo "::error::Failed to poll Cloudflare Pages custom domain '${CUSTOM_DOMAIN}' (HTTP ${domain_http_code}): $(api_errors "${domain_response}")"
                  exit 1
                fi
                status="$(jq -r '.result.status' "${domain_response}")"
                case "${status}" in
                  active)
                    echo "Cloudflare Pages custom domain '${CUSTOM_DOMAIN}' is active."
                    break
                    ;;
                  pending | initializing)
                    if [ "${attempt}" -eq 12 ]; then
                      echo "::notice title=Cloudflare Pages domain pending::Custom domain '${CUSTOM_DOMAIN}' remains '${status}' after the bounded activation wait."
                    fi
                    ;;
                  *)
                    echo "::error::Cloudflare Pages custom domain '${CUSTOM_DOMAIN}' entered unexpected status '${status}'."
                    exit 1
                    ;;
                esac
              done
            fi
          fi

          {
            echo "status=${status}"
            echo "dns-target=${dns_target}"
            echo "dns-action=${dns_action}"
          } >>"${GITHUB_OUTPUT}"
          echo "::notice title=Cloudflare Pages custom domain::Domain '${CUSTOM_DOMAIN}', project '${PROJECT_NAME}', target '${dns_target}', DNS '${dns_action}', proxied '${dns_proxied_summary}', Pages status '${status}'."
          {
            echo "### Cloudflare Pages custom domain"
            echo
            echo "- Domain: \`${CUSTOM_DOMAIN}\`"
            echo "- Resolved project: \`${PROJECT_NAME}\`"
            echo "- DNS CNAME target: \`${dns_target}\`"
            echo "- DNS action: \`${dns_action}\`"
            echo "- DNS proxied: \`${dns_proxied_summary}\`"
            echo "- Pages domain status: \`${status}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
  deploy-preview:
    name: Deploy Cloudflare preview
    needs:
      - detect-cloudflare
      - test
    if: >-
      inputs.cloudflare-preview && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name
      == github.repository && github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]' && needs.detect-cloudflare.outputs.enabled
      == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      # Scoped per Cloudflare project, as above. Without the project name two
      # calls from one repository share a group and, because this one cancels
      # in progress, the second preview kills the first.
      group: preview-${{ github.event.pull_request.number }}-${{ needs.detect-cloudflare.outputs.project-name }}
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
      issues: write
      pull-requests: write
    env:
      # Real commit being built; on pull_request events github.sha is the
      # ephemeral merge commit, so prefer the PR head SHA when present.
      APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch tags so builds can read the release tag at HEAD
          # (footer/version metadata). Safe when no tags exist.
          fetch-tags: true
      - name: Setup Node.js
        if: ${{ inputs.build-command != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Setup Go
        if: >-
          ${{ inputs.artifact-name == '' && (inputs.go-version != '' || inputs.go-version-file != '') }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version-file }}
          # Caching disabled on this privileged job to remove the
          # cache-poisoning surface (zizmor), matching setup-node above.
          cache: false
      - name: Install dependencies
        if: ${{ inputs.build-command != '' && inputs.install-command != '' }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "${INSTALL_COMMAND}"
      - name: Build site
        if: ${{ inputs.build-command != '' }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "${BUILD_COMMAND}"
      # Artifacts are scoped to the workflow run, and a reusable workflow's jobs
      # are part of the caller's run — so this picks up an artifact uploaded by
      # an earlier caller job with no extra permissions and no token handoff.
      - name: Download prebuilt site
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
      - name: Run pre-preview command
        if: ${{ inputs.pre-preview-command != '' }}
        env:
          PRE_PREVIEW_COMMAND: ${{ inputs.pre-preview-command }}
        run: bash -euo pipefail -c "${PRE_PREVIEW_COMMAND}"
      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        continue-on-error: true
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            pages project create ${{ needs.detect-cloudflare.outputs.project-name }} --production-branch ${{ inputs.cloudflare-production-branch
            }}
          wranglerVersion: ${{ inputs.wrangler-version }}
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            pages deploy ${{ inputs.artifact-path }} --project-name=${{ needs.detect-cloudflare.outputs.project-name }} --branch=${{
            github.head_ref }}
          wranglerVersion: ${{ inputs.wrangler-version }}
      - name: Post or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PREVIEW_COMMENT_MARKER: ${{ inputs.preview-comment-marker }}
        with:
          script: |-
            const marker = process.env.PREVIEW_COMMENT_MARKER;
            const body = [
              marker,
              `🔍 **Preview deployed:** ${process.env.DEPLOYMENT_URL}`,
              '',
              `_Updated: ${new Date().toUTCString()}_`,
            ].join('\n');
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
  close-preview:
    name: Close Cloudflare preview
    needs:
      - detect-cloudflare
    if: >-
      inputs.cloudflare-preview && github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name
      == github.repository && github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]' && needs.detect-cloudflare.outputs.enabled
      == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Delete Cloudflare Pages preview deployments
        env:
          BRANCH: ${{ github.head_ref }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_NAME: ${{ needs.detect-cloudflare.outputs.project-name }}
        run: |-
          set -euo pipefail

          http_code="$(
            curl -sS -o /tmp/cf_response.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments"
          )"
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Failed to list deployments (HTTP ${http_code}):"
            cat /tmp/cf_response.json
            exit 1
          fi

          if ! deployment_ids="$(
            jq -r \
              --arg branch "${BRANCH}" \
              'if (.result | type) == "array" then
                .result[]
                | select(.deployment_trigger.metadata.branch == $branch)
                | .id
              else
                error("Cloudflare response did not include a result array")
              end' \
              /tmp/cf_response.json
          )"; then
            echo "::error::Failed to parse Cloudflare deployments response:"
            cat /tmp/cf_response.json
            exit 1
          fi

          if [ -z "${deployment_ids}" ]; then
            echo "No preview deployments found for branch '${BRANCH}'"
            exit 0
          fi

          for deployment_id in ${deployment_ids}; do
            echo "Deleting deployment ${deployment_id} for branch '${BRANCH}'"
            del_code="$(
              curl -sS -o /tmp/cf_del_response.json -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments/${deployment_id}?force=true"
            )"
            if [ "${del_code}" -lt 200 ] || [ "${del_code}" -ge 300 ]; then
              echo "::warning::Failed to delete deployment ${deployment_id} (HTTP ${del_code}):"
              cat /tmp/cf_del_response.json
            else
              echo "Deleted ${deployment_id}"
            fi
          done
