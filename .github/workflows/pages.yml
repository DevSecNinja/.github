---
name: Reusable — Pages

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to install for test and build commands"
        required: true
        type: string
      node-cache:
        description: "Package manager cache for setup-node; use empty to disable"
        required: false
        type: string
        default: "npm"
      wrangler-version:
        description: "Wrangler version to install for Cloudflare Pages previews"
        required: true
        type: string
      production-branch:
        description: "Branch that deploys to GitHub Pages"
        required: false
        type: string
        default: "main"
      artifact-path:
        description: "Path uploaded to GitHub Pages or Cloudflare Pages"
        required: false
        type: string
        default: "."
      install-command:
        description: "Dependency installation command"
        required: false
        type: string
        default: "npm ci"
      test-command:
        description: "Shell commands that validate the site before deployment"
        required: false
        type: string
        default: ""
      test-setup-command:
        description: "Optional setup command after install and before tests"
        required: false
        type: string
        default: ""
      build-command:
        description: "Optional build command before uploading artifacts"
        required: false
        type: string
        default: ""
      pre-deploy-command:
        description: "Optional command before the GitHub Pages upload"
        required: false
        type: string
        default: ""
      pre-preview-command:
        description: "Optional command before the Cloudflare preview deploy"
        required: false
        type: string
        default: ""
      update-sitemap-lastmod:
        description: "Update sitemap.xml lastmod dates during production deploy"
        required: false
        type: boolean
        default: false
      sitemap-path:
        description: "Sitemap path used when update-sitemap-lastmod is true"
        required: false
        type: string
        default: "sitemap.xml"
      cloudflare-preview:
        description: "Deploy pull request previews to Cloudflare Pages"
        required: false
        type: boolean
        default: true
      cloudflare-project-name:
        description: "Cloudflare Pages project name; defaults to the repo name"
        required: false
        type: string
        default: ""
      cloudflare-production-branch:
        description: "Production branch configured on the Cloudflare project"
        required: false
        type: string
        default: "main"
      preview-comment-marker:
        description: "Marker used to update the Cloudflare preview PR comment"
        required: false
        type: string
        default: "<!-- cf-preview-comment -->"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  detect-cloudflare:
    name: Detect Cloudflare configuration
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
      project-name: ${{ steps.detect.outputs.project-name }}
    steps:
      - name: Detect Cloudflare secrets
        id: detect
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PREVIEW: ${{ inputs.cloudflare-preview }}
          CONFIGURED_PROJECT_NAME: ${{ inputs.cloudflare-project-name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |-
          set -euo pipefail

          project_name="${CONFIGURED_PROJECT_NAME:-$REPOSITORY_NAME}"

          if [ "${CLOUDFLARE_PREVIEW}" != "true" ]; then
            echo "enabled=false" >>"${GITHUB_OUTPUT}"
            echo "Cloudflare Pages previews are disabled by input."
            exit 0
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "enabled=false" >>"${GITHUB_OUTPUT}"
            echo "::notice::Missing Cloudflare secrets; skipping preview deploys."
            exit 0
          fi

          if [ -z "${project_name}" ]; then
            echo "::error::cloudflare-project-name is required."
            exit 1
          fi

          if ! [[ "${project_name}" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "::error::cloudflare-project-name must contain only lowercase letters, numbers, and hyphens."
            exit 1
          fi

          echo "project-name=${project_name}" >>"${GITHUB_OUTPUT}"
          echo "enabled=true" >>"${GITHUB_OUTPUT}"
          echo "Cloudflare Pages previews are configured."

  test:
    name: Run tests
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-cache }}

      - name: Install dependencies
        if: ${{ inputs.install-command != '' }}
        run: ${{ inputs.install-command }}

      - name: Run test setup
        if: ${{ inputs.test-setup-command != '' }}
        run: ${{ inputs.test-setup-command }}

      - name: Run tests
        if: ${{ inputs.test-command != '' }}
        run: ${{ inputs.test-command }}

  deploy:
    name: Deploy to GitHub Pages
    needs:
      - test
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', inputs.production-branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Setup Node.js
        if: ${{ inputs.build-command != '' }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-cache }}

      - name: Install dependencies
        if: ${{ inputs.build-command != '' && inputs.install-command != '' }}
        run: ${{ inputs.install-command }}

      - name: Build site
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}

      - name: Run pre-deploy command
        if: ${{ inputs.pre-deploy-command != '' }}
        run: ${{ inputs.pre-deploy-command }}

      - name: Update sitemap lastmod dates
        if: ${{ inputs.update-sitemap-lastmod }}
        env:
          SITEMAP_PATH: ${{ inputs.sitemap-path }}
        run: |-
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          sed -i -E \
            "s|<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>|<lastmod>${today}</lastmod>|g" \
            "${SITEMAP_PATH}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ inputs.artifact-path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  deploy-preview:
    name: Deploy Cloudflare preview
    needs:
      - detect-cloudflare
      - test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]' &&
      needs.detect-cloudflare.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: preview-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ inputs.build-command != '' }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.node-cache }}

      - name: Install dependencies
        if: ${{ inputs.build-command != '' && inputs.install-command != '' }}
        run: ${{ inputs.install-command }}

      - name: Build site
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}

      - name: Run pre-preview command
        if: ${{ inputs.pre-preview-command != '' }}
        run: ${{ inputs.pre-preview-command }}

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        continue-on-error: true
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            pages project create ${{ needs.detect-cloudflare.outputs.project-name }}
            --production-branch ${{ inputs.cloudflare-production-branch }}
          wranglerVersion: ${{ inputs.wrangler-version }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            pages deploy ${{ inputs.artifact-path }}
            --project-name=${{ needs.detect-cloudflare.outputs.project-name }}
            --branch=${{ github.head_ref }}
          wranglerVersion: ${{ inputs.wrangler-version }}

      - name: Post or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PREVIEW_COMMENT_MARKER: ${{ inputs.preview-comment-marker }}
        with:
          script: |-
            const marker = process.env.PREVIEW_COMMENT_MARKER;
            const body = [
              marker,
              `🔍 **Preview deployed:** ${process.env.DEPLOYMENT_URL}`,
              '',
              `_Updated: ${new Date().toUTCString()}_`,
            ].join('\n');
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  close-preview:
    name: Close Cloudflare preview
    needs:
      - detect-cloudflare
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]' &&
      needs.detect-cloudflare.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Delete Cloudflare Pages preview deployments
        env:
          BRANCH: ${{ github.head_ref }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_NAME: ${{ needs.detect-cloudflare.outputs.project-name }}
        run: |-
          set -euo pipefail

          http_code="$(
            curl -sS -o /tmp/cf_response.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments"
          )"
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Failed to list deployments (HTTP ${http_code}):"
            cat /tmp/cf_response.json
            exit 1
          fi

          deployment_ids="$(
            jq -r \
              --arg branch "${BRANCH}" \
              '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id' \
              /tmp/cf_response.json
          )"

          if [ -z "${deployment_ids}" ]; then
            echo "No preview deployments found for branch '${BRANCH}'"
            exit 0
          fi

          for deployment_id in ${deployment_ids}; do
            echo "Deleting deployment ${deployment_id} for branch '${BRANCH}'"
            del_code="$(
              curl -sS -o /tmp/cf_del_response.json -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments/${deployment_id}?force=true"
            )"
            if [ "${del_code}" -lt 200 ] || [ "${del_code}" -ge 300 ]; then
              echo "::warning::Failed to delete deployment ${deployment_id} (HTTP ${del_code}):"
              cat /tmp/cf_del_response.json
            else
              echo "Deleted ${deployment_id}"
            fi
          done
