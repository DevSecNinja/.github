---
name: Reusable — APM Sync

# Refreshes installed APM (Agent Package Manager) primitives in the calling
# repo and opens a PR when anything changed — the agentic-primitive equivalent
# of the config-sync workflow (which only handles static config files).
#
# What it does on each run:
#   1. Installs a pinned `apm` CLI.
#   2. Runs `apm update --yes`, which re-resolves every dependency in apm.yml to
#      its latest matching Git ref, rewrites apm.lock.yaml, and redeploys the
#      compiled primitives into the harness directories (.github/, .claude/, …).
#   3. Opens (or force-updates) a PR with the result, via the central
#      actions/open-pr composite. Branch protection is fully respected — the bot
#      opens a PR and a human (or auto-merge with required checks) merges it.
#
# Prerequisite: the calling repo must already depend on at least one APM package
# (run `apm install <owner>/<repo>` once and commit apm.yml + apm.lock.yaml). If
# apm.yml is absent the job is a no-op.
#
# Authentication (single-App contract, see docs/automation-app.md): the PR is
# opened with a token of the DevSecNinja Automation GitHub App, so required CI
# fires on it. The App ID comes from the `app-id` input or the caller
# repository's `AUTOMATION_APP_ID` variable; the private key from the
# `app-private-key` secret or the `AUTOMATION_APP_PRIVATE_KEY` secret (passed
# by name or via `secrets: inherit`). Without both, the workflow falls back to
# GITHUB_TOKEN with a warning: that PR does not retrigger workflows (GitHub
# design) and only opens when "Allow GitHub Actions to create and approve pull
# requests" is enabled.
#
# See also: DevSecNinja/.github docs/apm-sync-onboarding.md

on:
  workflow_call:
    inputs:
      apm-version:
        description: |
          Version of the `apm` CLI to install (e.g. v0.13.0). Required — the
          caller owns the version (see ADR 0001). Accepts `vX.Y.Z` or `X.Y.Z`.
        required: true
        type: string
      packages:
        description: |
          Optional space-separated list of package names to update (e.g.
          "DevSecNinja/ai-toolkit"). When empty, every dependency in apm.yml is
          refreshed.
        required: false
        type: string
        default: ""
      target-branch:
        description: "Base branch the PR targets (defaults to main)."
        required: false
        type: string
        default: main
      pr-branch:
        description: "Working branch the sync PR is pushed to."
        required: false
        type: string
        default: chore/apm-sync
      app-id:
        description: |
          GitHub App ID used to open the PR so required CI fires on it. Empty
          (default) reads the caller repository's AUTOMATION_APP_ID variable.
          Without App credentials, falls back to GITHUB_TOKEN (PR opens but
          won't retrigger CI).
        required: false
        type: string
        default: ""
      app-environment:
        description: |
          Actions environment that holds the App credentials (the dotfiles
          GitHubRepoConfig module provisions them into `production`, pinned
          to the default branch). Repository-level credentials work with the
          default too.
        required: false
        type: string
        default: production
    secrets:
      app-private-key:
        description: "Explicit PEM private key of the GitHub App; overrides AUTOMATION_APP_PRIVATE_KEY."
        required: false
      AUTOMATION_APP_PRIVATE_KEY:
        description: "PEM private key of the GitHub App. Pass it by name, or use `secrets: inherit`."
        required: false
    outputs:
      changed:
        description: "`true` when the sync produced changes and a PR was opened/updated."
        value: ${{ jobs.apm-sync.outputs.changed }}
      pr-url:
        description: "URL of the PR that was opened or reused, if any."
        value: ${{ jobs.apm-sync.outputs.pr-url }}

permissions:
  contents: read

jobs:
  apm-sync:
    name: Sync APM primitives
    runs-on: ubuntu-24.04
    # Exposes the environment's AUTOMATION_APP_* values without creating a
    # deployment record on every run.
    environment:
      name: ${{ inputs.app-environment }}
      deployment: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.open-pr.outputs.changed }}
      pr-url: ${{ steps.open-pr.outputs.pr-url }}
    steps:
      - name: Harden runner
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/harden-runner@24acc67adf1be33089e73b2fdbdb4be8c12d145b # v3.2.0

      - name: Resolve GitHub App credentials
        id: app
        env:
          APP_ID: ${{ inputs.app-id || vars.AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key || secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: |-
          set -euo pipefail

          id_set=false
          key_set=false
          [[ -n "${APP_ID//[[:space:]]/}" ]] && id_set=true
          [[ -n "${APP_PRIVATE_KEY//[[:space:]]/}" ]] && key_set=true

          if [[ "${id_set}" == true && "${key_set}" == true ]]; then
            echo "available=true" >>"${GITHUB_OUTPUT}"
            echo "Opening the PR as the GitHub App (ID ${APP_ID})."
            exit 0
          fi

          echo "available=false" >>"${GITHUB_OUTPUT}"
          if [[ "${id_set}" == true ]]; then
            reason="AUTOMATION_APP_ID is set, but the calling job does not pass the AUTOMATION_APP_PRIVATE_KEY secret."
          elif [[ "${key_set}" == true ]]; then
            reason="A private key was passed, but neither the AUTOMATION_APP_ID variable nor the app-id input is set."
          else
            reason="No GitHub App credentials (AUTOMATION_APP_ID variable, AUTOMATION_APP_PRIVATE_KEY secret)."
          fi
          echo "::warning title=APM Sync falls back to GITHUB_TOKEN::${reason} GITHUB_TOKEN can only open the PR when 'Allow GitHub Actions to create and approve pull requests' is enabled, and that PR does not trigger CI. See https://github.com/DevSecNinja/.github/blob/main/docs/automation-app.md"

      - name: Generate App token
        id: app-token
        if: steps.app.outputs.available == 'true'
        # renovate: datasource=github-releases depName=actions/create-github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-id || vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.app-private-key || secrets.AUTOMATION_APP_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout calling repository
        # zizmor: ignore[artipacked]
        # Persisted credentials are required: the `actions/open-pr` step below
        # invokes `git push --force-with-lease`, which relies on the bearer
        # token that `actions/checkout` writes into the remote URL. Setting
        # `persist-credentials: false` here breaks PR creation without offering
        # meaningful isolation — this job runs no untrusted code (it only
        # installs the pinned apm CLI and runs `apm update` over the repo's own
        # committed apm.yml/apm.lock.yaml).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Check for apm.yml
        id: precheck
        run: |
          if [ ! -f apm.yml ]; then
            echo "::notice::No apm.yml in this repo; nothing to sync."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install apm CLI
        if: steps.precheck.outputs.skip != 'true'
        env:
          VERSION: ${{ inputs.apm-version }}
          APM_INSTALL_DIR: ${{ runner.temp }}/apm/bin
          APM_LIB_DIR: ${{ runner.temp }}/apm/lib/apm
        run: |
          set -euo pipefail
          curl -sSL https://aka.ms/apm-unix | sh
          echo "${APM_INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Refresh APM primitives
        if: steps.precheck.outputs.skip != 'true'
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          apm --version
          # shellcheck disable=SC2086 # PACKAGES is an intentional arg list.
          apm update --yes ${PACKAGES}

      - name: Open sync PR
        id: open-pr
        if: steps.precheck.outputs.skip != 'true'
        # renovate: datasource=github-tags depName=DevSecNinja/.github
        uses: DevSecNinja/.github/actions/open-pr@9c281b38f863550ddff25df04e6fda0b9b23d00c # v3.3.0
        with:
          branch: ${{ inputs.pr-branch }}
          base: ${{ inputs.target-branch }}
          title: "chore: sync APM primitives"
          commit-message: "chore: sync APM primitives from upstream packages"
          labels: apm-sync
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          body: |-
            Automated PR — refreshed APM primitives via `apm update`.

            Installed primitives were re-resolved to the latest matching refs of
            the packages in `apm.yml` and redeployed into the harness
            directories. Review the diff and merge to adopt.

            Triggered by `${{ github.workflow }}` on `${{ github.ref_name }}`
            at commit `${{ github.sha }}`.
