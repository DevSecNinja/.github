# Template — adapt per repo. Config for ruff, which the shared Lint workflow
# (lint-ruff) runs on the repository's Python files: `ruff check` and
# `ruff format --diff`. Config-sync doesn't add it to a repo that configures
# ruff in .ruff.toml or [tool.ruff] of pyproject.toml.
line-length = 120

# Generated and vendored paths, as in the shared dprint.json. The Lint workflow
# skips them already; this keeps local `ruff check .` runs in line.
extend-exclude = [
  "apm_modules",
  ".agents",
  ".claude",
  ".cursor",
  ".gemini",
  ".github/agents",
  ".github/chatmodes",
  ".github/instructions",
  ".github/prompts",
  ".github/skills",
  ".kiro",
  ".opencode",
  ".specify",
  ".venv*",
  ".windsurf",
]
