---
name: Open pull request
description: |
  Open (or update) a pull request from the current working tree.

  Stages any uncommitted changes in the caller's checkout, commits them
  as a single commit on top of the checked-out commit to a dedicated
  working branch, then opens a PR against the target branch via the `gh`
  CLI. If a PR for that branch already exists (e.g. a previous run that
  hasn't been merged yet), the branch is replaced with the new commit and
  the existing PR is reused.

  With `commit-method: api` the commit is created through the GitHub
  GraphQL API, so GitHub signs it and the PR passes a "require signed
  commits" rule. The default, `commit-method: git`, keeps the original
  local commit and force-push, which is unsigned.

  This is a composite action so it can act on the caller's working tree
  (a reusable workflow runs in its own job and would not see those
  changes). Uses only the preinstalled `gh` CLI — no third-party action
  dependency.

  Designed for jobs like:
    - signing artifacts then committing them back through PR review,
    - auto-formatters that should land via PR rather than a direct push,
    - generated-content updates (labels, configs, manifests).

  Branch protection on the base branch stays fully enforced — the bot
  opens a PR and a human (or auto-merge with required checks) merges it.
  No bypass actor required.

inputs:
  branch:
    description: |
      Name of the working branch to create or replace. Choose a
      stable per-purpose name (e.g. `chore/sign-powershell-scripts`) so
      repeat runs reuse the same PR rather than opening duplicates.
    required: true
  base:
    description: "Branch to merge into. Defaults to `main`."
    required: false
    default: main
  title:
    description: "Pull request title. Should be a Conventional Commit subject."
    required: true
  body:
    description: |
      Pull request body. Plain Markdown. Empty by default. The caller is
      responsible for any context, links, or trigger metadata they want
      shown in the PR description.
    required: false
    default: ""
  commit-message:
    description: |
      Commit message for the staged changes. Defaults to `title` so the
      commit and PR titles match. Provide a different value if the body
      of the commit should differ from the PR description.
    required: false
    default: ""
  paths:
    description: |
      Newline-delimited list of pathspecs to stage with `git add`. Glob
      patterns are forwarded to `git add` literally. Defaults to `.`
      (stage everything in the working tree).
    required: false
    default: "."
  labels:
    description: |
      Newline-delimited list of labels to apply when opening the PR, and to
      add when an existing PR is reused. Missing labels are created first; a
      label that can't be created is skipped with a warning. Empty by default.
    required: false
    default: ""
  draft:
    description: "Open the PR as a draft."
    required: false
    default: "false"
  signoff:
    description: |
      Add a `Signed-off-by` trailer to the commit, using `git-user-name`
      and `git-user-email`.
    required: false
    default: "false"
  commit-method:
    description: |
      How the commit is made:
        - `git` (default): local commit authored as `git-user-name` and
          a leased force-push. The commit is unsigned, so a base branch
          that requires signed commits blocks the PR.
        - `api`: GraphQL `createCommitOnBranch` with `github-token`.
          GitHub signs the commit and authors it as the token's identity
          (the GitHub App bot, or github-actions[bot] for GITHUB_TOKEN).
          The executable bit can't be set on new files, symlinks and
          submodules can't be committed, and the checked-out commit must
          be on GitHub.
    required: false
    default: git
  if-no-changes:
    description: |
      What to do when there is nothing to commit:
        - `skip` (default): exit 0 and set `changed=false`.
        - `fail`: exit non-zero so the calling job fails loudly.
    required: false
    default: skip
  git-user-name:
    description: |
      Author name for `commit-method: git`, and the `signoff` name. The
      API method always authors the commit as the token's identity.
    required: false
    default: "github-actions[bot]"
  git-user-email:
    description: "Author email for `commit-method: git`, and the `signoff` email."
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  github-token:
    description: |
      Token used for the commit (API call or `git push`) and the PR API
      calls. Defaults to the workflow's GITHUB_TOKEN, which is enough for
      same-repo PRs and intentionally will NOT retrigger workflows on the
      bot's commit (so this action is safe to use inside loops like
      sign-on-push). With `commit-method: api` it needs Contents: write.

      Pass a GitHub App token if you want the bot's commit to retrigger
      CI on the new branch; the commit is then authored as the App.
    required: false
    default: ${{ github.token }}

outputs:
  changed:
    description: "`true` when there were uncommitted changes and a PR was opened or updated."
    value: ${{ steps.commit.outputs.changed }}
  pr-number:
    description: "Number of the PR that was opened or reused. Empty when changed=false."
    value: ${{ steps.pr.outputs.pr-number }}
  pr-url:
    description: "URL of the PR that was opened or reused. Empty when changed=false."
    value: ${{ steps.pr.outputs.pr-url }}
  created:
    description: |
      `true` when a brand-new PR was opened by this run, `false` when
      an existing PR for `branch` was reused (its branch replaced with
      the new commit), or when changed=false.
    value: ${{ steps.pr.outputs.created }}

runs:
  using: composite
  steps:
    - name: Stage and commit changes
      id: commit
      shell: bash
      env:
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        BRANCH: ${{ inputs.branch }}
        BASE: ${{ inputs.base }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        COMMIT_METHOD: ${{ inputs.commit-method }}
        TITLE: ${{ inputs.title }}
        PATHS: ${{ inputs.paths }}
        SIGNOFF: ${{ inputs.signoff }}
        IF_NO_CHANGES: ${{ inputs.if-no-changes }}
        # The same token commits (API or git push) and opens the PR below, so
        # the bot identity is consistent.
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${GITHUB_ACTION_PATH}/commit.sh"

    - name: Open or reuse pull request
      id: pr
      if: steps.commit.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BRANCH: ${{ inputs.branch }}
        BASE: ${{ inputs.base }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        LABELS: ${{ inputs.labels }}
        DRAFT: ${{ inputs.draft }}
      run: |-
        set -euo pipefail

        # Collect labels from newline-delimited input.
        labels=()
        while IFS= read -r line; do
          trimmed="${line#"${line%%[![:space:]]*}"}"
          trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
          [ -n "${trimmed}" ] && labels+=("${trimmed}")
        done <<< "${LABELS}"

        # `gh pr create --label` fails outright on a label the repo doesn't
        # have. Create missing labels first (the Pull requests permission is
        # enough); drop one that can't be created with a warning rather than
        # failing the whole PR. Check each label directly: a listing is paged
        # and can miss labels. Re-check after a failed create, which also
        # covers another run creating the label first.
        label_exists() {
          gh api "repos/{owner}/{repo}/labels/$(jq -rn --arg l "$1" '$l | @uri')" --silent >/dev/null 2>&1
        }
        label_args=()
        add_label_args=()
        for label in ${labels[@]+"${labels[@]}"}; do
          if ! label_exists "${label}" &&
            ! gh label create "${label}" >/dev/null 2>&1 &&
            ! label_exists "${label}"; then
            echo "::warning::Label '${label}' does not exist and could not be created; continuing without it."
            continue
          fi
          label_args+=(--label "${label}")
          add_label_args+=(--add-label "${label}")
        done

        draft_args=()
        if [ "${DRAFT}" = "true" ]; then
          draft_args+=(--draft)
        fi

        # Try to create. If a PR already exists for `head:branch -> base`,
        # `gh pr create` exits non-zero — fall back to looking it up.
        if gh pr create \
            --base "${BASE}" \
            --head "${BRANCH}" \
            --title "${TITLE}" \
            --body  "${BODY}" \
            "${label_args[@]}" \
            "${draft_args[@]}" \
            > /tmp/gh-pr-create.out 2>&1; then
          url=$(tail -n1 /tmp/gh-pr-create.out)
          number=$(gh pr view "${BRANCH}" --json number --jq '.number')
          {
            echo "created=true"
            echo "pr-url=${url}"
            echo "pr-number=${number}"
          } >> "${GITHUB_OUTPUT}"
          echo "Opened PR #${number}: ${url}"
        else
          # Surface the original error for debuggability, then try reuse.
          cat /tmp/gh-pr-create.out
          existing=$(gh pr list \
            --base "${BASE}" \
            --head "${BRANCH}" \
            --state open \
            --json number,url \
            --jq '.[0]')
          if [ -z "${existing}" ] || [ "${existing}" = "null" ]; then
            echo "::error::gh pr create failed and no existing open PR found for ${BRANCH} -> ${BASE}." >&2
            exit 1
          fi
          number=$(printf '%s' "${existing}" | jq -r '.number')
          url=$(printf '%s' "${existing}"    | jq -r '.url')
          if [ "${#add_label_args[@]}" -gt 0 ] &&
            ! gh pr edit "${number}" "${add_label_args[@]}" >/dev/null; then
            echo "::warning::Could not add labels to existing PR #${number}."
          fi
          {
            echo "created=false"
            echo "pr-url=${url}"
            echo "pr-number=${number}"
          } >> "${GITHUB_OUTPUT}"
          echo "Reused existing PR #${number}: ${url} (its branch holds the new commit)."
        fi
