---
name: Harden runner
description: |
  Apply StepSecurity Harden-Runner runtime controls to the current job.

  This composite wrapper pins the upstream action and defaults to audit mode
  so repositories can observe network egress before moving selected jobs to
  block mode with an allow-list.

inputs:
  allowed-endpoints:
    description: "Allowed outbound endpoints when egress-policy is block."
    required: false
    default: ""
  egress-policy:
    description: "Outbound traffic policy: audit or block."
    required: false
    default: audit
  token:
    description: "GitHub token used by Harden-Runner to avoid API rate limits."
    required: false
    default: ${{ github.token }}
  disable-telemetry:
    description: "Disable telemetry to StepSecurity. Only supported when egress-policy is block."
    required: false
    default: "false"
  disable-sudo-and-containers:
    description: "Disable sudo and container access for the runner account."
    required: false
    default: "false"
  disable-file-monitoring:
    description: "Disable file monitoring."
    required: false
    default: "false"
  policy:
    description: "Policy name to use from the policy store. Requires id-token: write."
    required: false
    default: ""
  use-policy-store:
    description: "Set to true to fetch policy from the StepSecurity policy store."
    required: false
    default: "false"
  api-key:
    description: "StepSecurity API key for policy-store authentication."
    required: false
    default: ""
  deploy-on-self-hosted-vm:
    description: "Deploy the agent directly on an ephemeral self-hosted Linux VM."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Harden runner
      # renovate: datasource=github-releases depName=step-security/harden-runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        allowed-endpoints: ${{ inputs.allowed-endpoints }}
        egress-policy: ${{ inputs.egress-policy }}
        token: ${{ inputs.token }}
        disable-telemetry: ${{ inputs.disable-telemetry }}
        disable-sudo-and-containers: ${{ inputs.disable-sudo-and-containers }}
        disable-file-monitoring: ${{ inputs.disable-file-monitoring }}
        policy: ${{ inputs.policy }}
        use-policy-store: ${{ inputs.use-policy-store }}
        api-key: ${{ inputs.api-key }}
        deploy-on-self-hosted-vm: ${{ inputs.deploy-on-self-hosted-vm }}
