---
# Cases for tests/app-key-confinement.py. Each `workflow` is checked as if it
# lived at `as-workflow` (default fixture.yml), so the real emptiness-check
# allowlist applies. `expect` is a substring of the single violation the case
# must produce; `expect: null` marks a case that must pass.

- name: key in workflow-level env
  expect: workflow-level env
  workflow:
    env:
      KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
    jobs:
      build:
        runs-on: ubuntu-24.04
        steps:
          - run: "true"

- name: legacy key name in job-level env
  expect: job-level env
  workflow:
    jobs:
      build:
        runs-on: ubuntu-24.04
        environment: production
        env:
          KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        steps:
          - run: "true"

- name: allowlisted emptiness check runs in a job container with SHELLOPTS
  as-workflow: .github/workflows/apm-sync.yml
  expect: must not run in a job container
  workflow:
    jobs:
      apm-sync:
        runs-on: ubuntu-24.04
        environment: production
        container:
          image: ubuntu:24.04
          env:
            SHELLOPTS: xtrace
        steps:
          - name: Resolve GitHub App credentials
            env:
              APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
            run: '[[ -n "${APP_PRIVATE_KEY//[[:space:]]/}" ]] && key_set=true'

- name: key hidden behind a quoted closing delimiter in job env
  expect: job-level env
  workflow:
    jobs:
      build:
        runs-on: ubuntu-24.04
        environment: production
        env:
          KEY: ${{ '}}' && secrets.AUTOMATION_APP_PRIVATE_KEY }}
        steps:
          - run: "true"

- name: toJSON(secrets) hidden behind a quoted closing delimiter
  expect: exposes every secret
  workflow:
    jobs:
      build:
        runs-on: ubuntu-24.04
        steps:
          - run: echo '${{ '}}' && toJSON(secrets) }}'

- name: key passed to another action via with (bracket syntax)
  expect: passed to some/action@0123456789abcdef0123456789abcdef01234567 via with
  workflow:
    jobs:
      build:
        runs-on: ubuntu-24.04
        environment: production
        steps:
          - uses: some/action@0123456789abcdef0123456789abcdef01234567
            with:
              key: ${{ secrets['app-private-key'] }}

- name: key interpolated into a run script
  expect: run script outside the emptiness-check allowlist
  workflow:
    jobs:
      build:
        runs-on: ubuntu-24.04
        environment: production
        steps:
          - run: echo "${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}" > key.pem

- name: key in the env of a step that is not allowlisted
  expect: step env outside the emptiness-check allowlist
  workflow:
    jobs:
      build:
        runs-on: ubuntu-24.04
        environment: production
        steps:
          - name: Check key
            env:
              KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
            run: '[[ -n "${KEY//[[:space:]]/}" ]]'

- name: allowlisted emptiness check writes the key through an emptiness-style expansion
  as-workflow: .github/workflows/release-please.yml
  expect: reads $APP_PRIVATE_KEY outside an emptiness test
  workflow:
    jobs:
      release-please:
        runs-on: ubuntu-24.04
        environment: production
        steps:
          - name: Validate GitHub App credentials
            env:
              APP_PRIVATE_KEY: ${{ secrets.app-private-key || secrets.AUTOMATION_APP_PRIVATE_KEY }}
            run: |-
              [[ -n "${APP_PRIVATE_KEY//[[:space:]]/}" ]] || exit 1
              echo -n "${APP_PRIVATE_KEY//[[:space:]]/}" > key.pem

- name: allowlisted emptiness check pipes into another command
  as-workflow: .github/workflows/config-sync.yml
  expect: reads $APP_PRIVATE_KEY outside an emptiness test
  workflow:
    jobs:
      sync:
        runs-on: ubuntu-24.04
        environment: production
        steps:
          - name: Resolve GitHub App credentials
            env:
              APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
            run: '[[ -n "${APP_PRIVATE_KEY//[[:space:]]/}" ]] && printenv'

- name: allowlisted emptiness check writes the environment to a file
  as-workflow: .github/workflows/config-sync.yml
  expect: changed since review
  workflow:
    jobs:
      sync:
        runs-on: ubuntu-24.04
        environment: production
        steps:
          - name: Resolve GitHub App credentials
            env:
              APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
            run: |-
              [[ -n "${APP_PRIVATE_KEY//[[:space:]]/}" ]] && key_set=true
              export > key.env

- name: allowlisted emptiness check inherits a tracing job shell
  as-workflow: .github/workflows/apm-sync.yml
  expect: must run in plain bash
  workflow:
    jobs:
      apm-sync:
        runs-on: ubuntu-24.04
        environment: production
        defaults:
          run:
            shell: bash -ex {0}
        steps:
          - name: Resolve GitHub App credentials
            env:
              APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
            run: '[[ -n "${APP_PRIVATE_KEY//[[:space:]]/}" ]] && key_set=true'

- name: allowlisted emptiness check inherits a tracing workflow shell
  as-workflow: .github/workflows/apm-sync.yml
  expect: must run in plain bash
  workflow:
    defaults:
      run:
        shell: bash -x {0}
    jobs:
      apm-sync:
        runs-on: ubuntu-24.04
        environment: production
        steps:
          - name: Resolve GitHub App credentials
            env:
              APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
            run: '[[ -n "${APP_PRIVATE_KEY//[[:space:]]/}" ]] && key_set=true'

- name: allowlisted emptiness check runs with SHELLOPTS from the job
  as-workflow: .github/workflows/apm-sync.yml
  expect: shell-behaviour variable
  workflow:
    jobs:
      apm-sync:
        runs-on: ubuntu-24.04
        environment: production
        env:
          SHELLOPTS: xtrace
        steps:
          - name: Resolve GitHub App credentials
            env:
              APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
            run: '[[ -n "${APP_PRIVATE_KEY//[[:space:]]/}" ]] && key_set=true'

- name: token action pinned to a tag
  expect: not pinned to a full commit SHA
  workflow:
    jobs:
      build:
        runs-on: ubuntu-24.04
        environment: production
        steps:
          - uses: actions/create-github-app-token@v3
            with:
              client-id: ${{ vars.AUTOMATION_APP_ID }}
              private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

- name: key in the env of the token step
  expect: token step 'env'
  workflow:
    jobs:
      build:
        runs-on: ubuntu-24.04
        environment: production
        steps:
          - uses: actions/create-github-app-token@0123456789abcdef0123456789abcdef01234567
            env:
              KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
            with:
              client-id: ${{ vars.AUTOMATION_APP_ID }}

- name: token step in a job without environment
  expect: declares no environment
  workflow:
    jobs:
      build:
        runs-on: ubuntu-24.04
        steps:
          - uses: actions/create-github-app-token@0123456789abcdef0123456789abcdef01234567
            with:
              client-id: ${{ vars.AUTOMATION_APP_ID }}
              private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

- name: toJSON(secrets) dump
  expect: exposes every secret
  workflow:
    jobs:
      build:
        runs-on: ubuntu-24.04
        steps:
          - run: echo '${{ toJSON(secrets) }}'

- name: computed secrets index
  expect: exposes every secret
  workflow:
    jobs:
      build:
        runs-on: ubuntu-24.04
        steps:
          - run: echo '${{ secrets['AUTOMATION_APP_PRIVATE_KEY' || 'fallback'] }}'

- name: literal secrets index with spaces in the token step is allowed
  expect: null
  workflow:
    jobs:
      build:
        runs-on: ubuntu-24.04
        environment: production
        steps:
          - uses: actions/create-github-app-token@0123456789abcdef0123456789abcdef01234567
            with:
              client-id: ${{ vars.AUTOMATION_APP_ID }}
              private-key: ${{ secrets[ 'AUTOMATION_APP_PRIVATE_KEY' ] }}

- name: secrets inherit to a foreign reusable workflow
  expect: "secrets: inherit hands the App key"
  workflow:
    jobs:
      call:
        uses: someone/repo/.github/workflows/build.yml@0123456789abcdef0123456789abcdef01234567
        secrets: inherit

- name: secrets inherit to an App-key reusable workflow not pinned by SHA
  expect: "secrets: inherit hands the App key"
  workflow:
    jobs:
      call:
        uses: DevSecNinja/.github/.github/workflows/config-sync.yml@main
        secrets: inherit

- name: key passed by name to a foreign reusable workflow
  expect: not an allowlisted App-key reusable workflow
  workflow:
    jobs:
      call:
        uses: someone/repo/.github/workflows/build.yml@0123456789abcdef0123456789abcdef01234567
        secrets:
          AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

- name: key passed under another secret name
  expect: use AUTOMATION_APP_PRIVATE_KEY or app-private-key
  workflow:
    jobs:
      call:
        uses: DevSecNinja/.github/.github/workflows/release-please.yml@0123456789abcdef0123456789abcdef01234567
        secrets:
          token: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

- name: key passed to a reusable workflow as an input
  expect: job-level 'with' of a reusable-workflow call
  workflow:
    jobs:
      call:
        uses: DevSecNinja/.github/.github/workflows/apm-sync.yml@0123456789abcdef0123456789abcdef01234567
        with:
          app-id: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

- name: secrets inherit to a pinned App-key reusable workflow is allowed
  expect: null
  workflow:
    jobs:
      call:
        uses: DevSecNinja/.github/.github/workflows/config-sync.yml@0123456789abcdef0123456789abcdef01234567
        secrets: inherit

- name: local App-key reusable call with the key by name is allowed
  expect: null
  workflow:
    jobs:
      call:
        uses: ./.github/workflows/release-please.yml
        secrets:
          app-private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
