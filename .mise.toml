# renovate: datasource=github-releases depName=jdx/mise
min_version = "2026.9.1"

[tools]
actionlint = "1.7.12"
cocogitto = "7.0.0"
dprint = "0.57.4"
gitleaks = "8.30.1"
git-cliff = "2.14.1"
"pipx:checkov" = "3.3.16"
"pipx:json5" = "0.15.0"
"pipx:yamllint" = "1.38.0"
shellcheck = "0.11.0"
shfmt = "3.14.0"
trivy = "0.74.0"
uv = "0.12.10"
yamlfmt = "0.21.0"
zizmor = "1.30.0"

[tasks.test]
description = "Run repository tests"
run = [
  "bash ./tests/pages-custom-domain-contract.sh",
  "bash ./tests/renovate-custom-manager-coverage.sh",
  "bash ./tests/release-please-auth-contract.sh",
]
