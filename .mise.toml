# renovate: datasource=github-releases depName=jdx/mise
min_version = "2026.11.1"

[tools]
actionlint = "1.7.12"
biome = "2.6.8"
cocogitto = "7.0.0"
dprint = "0.64.3"
gitleaks = "8.30.1"
git-cliff = "2.14.2"
"pipx:checkov" = "3.4.3"
"pipx:json5" = "0.17.3"
"pipx:yamllint" = "1.38.0"
# tests/renovate-pr-cooldown.py runs the pr-cooldown github-script under Node.
node = "26.13.1"
ruff = "0.17.5"
shellcheck = "0.11.0"
shfmt = "3.14.1"
trivy = "0.76.1"
uv = "0.13.7"
yamlfmt = "0.21.0"
zizmor = "1.32.0"

[tasks.test]
description = "Run repository tests"
run = [
  "bash ./tests/copilot-model-policy-contract.sh",
  "bash ./tests/pages-custom-domain-contract.sh",
  "bash ./tests/pages-scripts.sh",
  "bash ./tests/label-sync-scripts.sh",
  "bash ./tests/apm-scripts.sh",
  "bash ./tests/autofix-scripts.sh",
  "bash ./tests/config-sync-scripts.sh",
  "bash ./tests/vendored-file-sync-scripts.sh",
  "uv run --script ./tests/workflow-script-fetch.py",
  "uv run --script ./tests/renovate-pr-cooldown.py",
  "bash ./tests/renovate-custom-manager-coverage.sh",
  "bash ./tests/renovate-apm-manager.sh",
  "bash ./tests/renovate-annotation-managers.sh",
  "bash ./tests/renovate-version-presets.sh",
  "bash ./tests/renovate-commit-types.sh",
  "bash ./tests/renovate-update-not-scheduled.sh",
  "bash ./tests/renovate-shell-manager.sh",
  "bash ./tests/renovate-dprint-plugins.sh",
  "bash ./tests/renovate-batching-contract.sh",
  "bash ./tests/renovate-engines-range.sh",
  "bash ./tests/renovate-npm-allow-remote.sh",
  "bash ./tests/renovate-branch-pin-digests.sh",
  "bash ./tests/renovate-pin-no-soak.sh",
  "bash ./tests/renovate-abandonment-exemptions.sh",
  "bash ./tests/release-please-auth-contract.sh",
  "bash ./tests/automation-app-contract.sh",
  "uv run --script ./tests/app-key-confinement.py",
  "uv run --script ./tests/lint-include.py",
  "bash ./tests/lint-job-modes-contract.sh",
  "uv run --script ./tests/lint-inline-scripts.py",
  "bash ./tests/open-pr-push.sh",
  "bash ./tests/open-pr-api-commit.sh",
  "bash ./tests/open-pr-labels.sh",
  "bash ./tests/release-publish-scripts.sh",
  "bash ./tests/notify-irm-scripts.sh",
  "bash ./tests/config-sync-ai-toolkit-instructions.sh",
  "bash ./tests/config-sync-lint-excludes.sh",
  "bash ./tests/config-sync-renovate-stub.sh",
  "bash ./tests/gitleaks-config.sh",
  "bash ./tests/lint-gitleaks-report.sh",
  "bash ./tests/lint-scripts.sh",
  "uv run --script ./tests/issue-labeler-config.py",
  "python3 ./tests/workflow-job-conditions.py",
  "python3 ./tests/ai-commits-badge.py",
  "uv run --script ./tests/pr-labeler-config.py",
]
